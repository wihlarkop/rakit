name: Patch Accessibility JS

on:
  push:
    branches:
      - feat/accessibility-foundation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/accessibility-foundation
      - run: python .github/scripts/patch_accessibility_js.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-web/src/rakit_web/static/rakit-ui.js
          git rm .github/scripts/patch_accessibility_js.py .github/workflows/patch-accessibility-js.yml
          git commit -m "feat(web): restore focus across dialogs and HTMX swaps"
          git push origin HEAD:feat/accessibility-foundation

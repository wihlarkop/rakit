name: First Generated REST Mutations Patch

on:
  push:
    branches: [feat/first-generated-rest-mutations]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'ci: apply generated REST mutation compiler patch' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/first-generated-rest-mutations
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --dev --locked
      - name: Patch mutation route compilation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/rakit-core/src/rakit_core/compiler.py')
          text = path.read_text()

          old = 'from .generated_api import CompiledResourceApi, GeneratedCrudOperation\n'
          new = 'from .generated_api import ApiExposure, CompiledResourceApi, GeneratedCrudOperation\n'
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    operation_routes = {\n        GeneratedCrudOperation.LIST: ("list", ("GET", "HEAD"), False),\n        GeneratedCrudOperation.DETAIL: ("detail", ("GET", "HEAD"), True),\n    }\n'''
          new = '''    operation_routes = {\n        GeneratedCrudOperation.LIST: ("list", ("GET", "HEAD"), False),\n        GeneratedCrudOperation.DETAIL: ("detail", ("GET", "HEAD"), True),\n        GeneratedCrudOperation.CREATE: ("create", ("POST",), False),\n        GeneratedCrudOperation.UPDATE_PARTIAL: ("update", ("PATCH",), True),\n        GeneratedCrudOperation.DELETE: ("delete", ("DELETE",), True),\n    }\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    capability_reports = tuple(\n        require_capabilities(requirement, builder.capability_providers)\n        for requirement in capability_requirements\n    )\n    builder._mark_compiled()\n'''
          new = '''    capability_reports = tuple(\n        require_capabilities(requirement, builder.capability_providers)\n        for requirement in capability_requirements\n    )\n    generated_executor_providers = dict(builder.generated_resource_executor_providers)\n    for api in generated_api.resources:\n        if (\n            api.definition.exposure is ApiExposure.CRUD\n            and api.resource_id not in generated_executor_providers\n        ):\n            raise RakitError(\n                code=ErrorCode.CONFIG_INVALID_RESOURCE_POLICY,\n                message=(\n                    f'Resource "{api.resource_id}" exposes generated CRUD but its adapter '\n                    "does not provide a generated resource executor."\n                ),\n                status_code=500,\n                details={\n                    "resource_id": api.resource_id,\n                    "reason": "generated_api_executor_not_supported",\n                },\n            )\n    builder._mark_compiled()\n'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          uv run ruff format packages/rakit-core/src/rakit_core/compiler.py
          uv run ruff check packages/rakit-core/src/rakit_core/compiler.py
      - name: Commit compiler patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-core/src/rakit_core/compiler.py
          git commit -m "feat(core): activate generated REST mutation routes"
          git push origin HEAD:feat/first-generated-rest-mutations

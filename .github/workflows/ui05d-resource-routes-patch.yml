name: UI-05D resource routes patch

on:
  pull_request:
    branches:
      - ui-05-resource-experience

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-05d-resource-query-configuration
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic route patch
        run: python .github/ui05d_patch_resource_routes.py
      - name: Normalize route modules
        run: |
          uv run ruff format \
            packages/rakit-web/src/rakit_web/resource_routes.py \
            packages/rakit-web/src/rakit_web/resource_query_ui.py
          uv run ruff check --fix \
            packages/rakit-web/src/rakit_web/resource_routes.py \
            packages/rakit-web/src/rakit_web/resource_query_ui.py
          uv run ruff check \
            packages/rakit-web/src/rakit_web/resource_routes.py \
            packages/rakit-web/src/rakit_web/resource_query_ui.py
      - name: Commit route patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/rakit-web/src/rakit_web/resource_routes.py \
            packages/rakit-web/src/rakit_web/resource_query_ui.py
          if git diff --cached --quiet; then
            echo 'No route patch changes to commit.'
            exit 0
          fi
          git commit -m 'feat(web): wire resource query presentation'
          git push origin HEAD:ui-05d-resource-query-configuration

name: UI-06 Polish Apply

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-polish:
    if: github.head_ref == 'ui-06-polish-crud-bulk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply asserted source patch
        run: python .github/ui06_polish_apply.py
      - name: Rebuild committed CSS
        run: |
          bun install --frozen-lockfile
          bun run css:build
      - name: Remove helper and restore normal CI
        run: |
          git checkout origin/ui-06-advanced-operations -- .github/workflows/ci.yml
          rm .github/ui06_polish_apply.py
          git diff --check
      - name: Commit product source
        run: |
          git config user.name "rakit-ci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(web): wire UI-06 CRUD and bulk polish"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

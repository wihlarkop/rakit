name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  c4-compat-maintenance:
    if: github.event_name == 'pull_request' && github.head_ref == 'phase-c4-capability-discovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-c4-capability-discovery
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - name: Restore legacy capability error projection
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          path = Path("packages/rakit-core/src/rakit_core/compiler.py")
          text = path.read_text()

          old = '''        missing_ids = tuple(
              requirement.requirement_id for requirement in analysis.missing_requirements
          )
          super().__init__(
'''
          new = '''        missing_ids = tuple(
              requirement.requirement_id for requirement in analysis.missing_requirements
          )
          missing_reports = tuple(report for report in analysis.reports if not report.satisfied)
          first_missing = missing_reports[0]
          super().__init__(
'''
          if text.count(old) != 1:
              raise RuntimeError("Expected exactly one CapabilityConfigurationError prelude")
          text = text.replace(old, new, 1)

          old_details = '''            details={
                  "reason": "missing_capabilities",
                  "available": list(analysis.available.names),
                  "providers": [
                      {
                          "id": provider.provider_id,
                          "capabilities": list(provider.capabilities.names),
                      }
                      for provider in analysis.providers
                  ],
                  "requirements": [
'''
          new_details = '''            details={
                  "reason": "missing_capabilities",
                  "requirement": first_missing.requirement.requirement_id,
                  "required": list(first_missing.requirement.required.names),
                  "available": list(first_missing.available.names),
                  "missing": list(first_missing.missing.names),
                  "providers": list(first_missing.provider_ids),
                  "provider_details": [
                      {
                          "id": provider.provider_id,
                          "capabilities": list(provider.capabilities.names),
                      }
                      for provider in analysis.providers
                  ],
                  "requirements": [
'''
          if text.count(old_details) != 1:
              raise RuntimeError("Expected exactly one CapabilityConfigurationError details block")
          path.write_text(text.replace(old_details, new_details, 1))
          PY
      - name: Verify compatibility patch
        run: |
          uv run ruff format --check packages/rakit-core/src/rakit_core/compiler.py
          uv run ruff check packages/rakit-core/src/rakit_core/compiler.py
          uv run ty check packages/rakit-core/src/rakit_core/compiler.py
          uv run pytest -q \
            packages/rakit-core/tests/test_generated_api_compilation.py \
            packages/rakit-core/tests/test_generated_rest_compilation.py \
            packages/rakit-web/tests/test_generated_rest_partial_schema.py \
            packages/rakit/tests/test_capability_cli.py
      - name: Restore canonical CI and commit source fix
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm -f .github/workflows/c4-compat-fix.yml 2>/dev/null || true
          git add .github/workflows/ci.yml packages/rakit-core/src/rakit_core/compiler.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve capability error compatibility"
          git push origin HEAD:phase-c4-capability-discovery

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest

  web-assets:
    name: Web asset reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run css:build
      - name: Verify committed CSS matches canonical source
        run: git diff --exit-code -- packages/rakit-web/src/rakit_web/static/rakit.css

  dependency-compatibility:
    name: Dependencies (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [lowest-direct, latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync minimum supported direct dependencies
        if: matrix.mode == 'lowest-direct'
        run: uv sync --all-packages --dev --resolution lowest-direct
      - name: Sync latest allowed dependencies
        if: matrix.mode == 'latest'
        run: uv sync --all-packages --dev --upgrade
      - name: Run test suite without re-syncing
        run: uv run --no-sync pytest -q --tb=short --maxfail=5

  release-gate:
    name: Plan 07 release gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - run: uv run pytest --cov
      - run: uv run mkdocs build --strict
      - run: uv run python scripts/check_artifacts.py

  artifact-dry-run:
    name: Artifact dry run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - run: uv run pytest tests/release -v
      - name: Build all official distributions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          for project in packages/*; do
            uv build "$project" --out-dir dist
          done
          ls -la dist
      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pr-python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  d3-refresh:
    if: github.head_ref == 'phase-d3-persistence-adapter-ecosystem'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-d3-persistence-adapter-ecosystem
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: python .github/d3_refresh.py
      - run: uv lock
      - run: uv sync --all-packages --dev --locked
      - run: uv run ruff format packages/rakit-tortoise packages/rakit/src/rakit/_install.py packages/rakit/tests/test_install_ux.py packages/rakit/tests/test_integration_discovery.py tests/examples/test_read_examples.py
      - run: uv run ruff check packages/rakit-tortoise packages/rakit/src/rakit/_install.py packages/rakit/tests/test_install_ux.py packages/rakit/tests/test_integration_discovery.py tests/examples/test_read_examples.py
      - name: Commit generated D3 workspace changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock packages/rakit-tortoise packages/rakit/src/rakit/_install.py packages/rakit/tests/test_install_ux.py packages/rakit/tests/test_integration_discovery.py tests/examples/test_read_examples.py
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore: refresh D3 workspace metadata"
          git push origin HEAD:phase-d3-persistence-adapter-ecosystem

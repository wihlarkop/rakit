name: UI-06 Polish Static Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  static-review:
    if: github.head_ref == 'ui-06-polish-crud-bulk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Apply review fixes
        run: python .github/ui06_polish_review.py
      - name: Sync dependencies
        run: uv sync --all-packages --dev --locked
      - name: Format changed Python source
        run: |
          uv run ruff format \
            packages/rakit-web/src/rakit_web/admin.py \
            packages/rakit-web/src/rakit_web/bulk_admin.py \
            packages/rakit-web/src/rakit_web/bulk_delete.py \
            packages/rakit-web/src/rakit_web/bulk_review.py \
            packages/rakit-web/src/rakit_web/resource_routes.py \
            packages/rakit-web/src/rakit_web/security/authentication.py
      - name: Remove helper and restore normal CI in workspace
        run: |
          git checkout origin/ui-06-advanced-operations -- .github/workflows/ci.yml
          rm .github/ui06_polish_review.py
          git diff --check
      - name: Static source gates
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run ty check
      - name: Commit reviewed source
        run: |
          git config user.name "rakit-ci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(web): harden UI-06 bulk delete routing"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  d2-source-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Patch neutral schema selection into web Admin
        shell: python
        run: |
          from pathlib import Path

          path = Path("packages/rakit-web/src/rakit_web/admin.py")
          text = path.read_text()
          text = text.replace(
              "from .schema import PydanticSchemaAdapter\n",
              "from .schema_selection import resolve_schema_adapter\n",
          )
          text = text.replace(
              "        schema_adapter: SchemaAdapter | None = None,\n    ) -> None:\n",
              "        schema_adapter: SchemaAdapter | None = None,\n"
              "        schema_integration_id: str | None = None,\n"
              "    ) -> None:\n",
              1,
          )
          text = text.replace(
              "        self._schema_adapter = schema_adapter or PydanticSchemaAdapter()\n",
              "        self._schema_adapter = resolve_schema_adapter(\n"
              "            schema_adapter, schema_integration_id=schema_integration_id\n"
              "        )\n",
              1,
          )
          if "PydanticSchemaAdapter" in text or "from .schema import" in text:
              raise SystemExit("stale Pydantic schema ownership remains in admin.py")
          path.write_text(text)
      - name: Refresh workspace lock and format D2 source
        run: |
          uv lock
          uv run ruff format packages/rakit-schema-pydantic packages/rakit-schema-msgspec packages/rakit-web/src/rakit_web/schema_selection.py packages/rakit-web/src/rakit_web/admin.py packages/rakit/src/rakit/_install.py
          uv run ruff check --fix packages/rakit-schema-pydantic packages/rakit-schema-msgspec packages/rakit-web/src/rakit_web/schema_selection.py packages/rakit-web/src/rakit_web/admin.py packages/rakit/src/rakit/_install.py
          uv run ruff format packages/rakit-schema-pydantic packages/rakit-schema-msgspec packages/rakit-web/src/rakit_web/schema_selection.py packages/rakit-web/src/rakit_web/admin.py packages/rakit/src/rakit/_install.py
      - name: Commit source patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source patch changes remain"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packages/rakit-web/src/rakit_web/admin.py packages/rakit-web/src/rakit_web/schema_selection.py packages/rakit-schema-pydantic packages/rakit-schema-msgspec packages/rakit/src/rakit/_install.py packages/rakit/pyproject.toml uv.lock
          git commit -m "feat(schema): wire deterministic schema selection"
          git push origin HEAD:${{ github.head_ref }}

name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  ui06c-contract-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ui-06c-auth-system-surfaces
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
      - run: uv sync --all-packages --dev --locked
      - run: bun install --frozen-lockfile
      - run: uv run python .github/ui06c_contract_fix.py
      - run: uv run ruff format packages/rakit-web/src/rakit_web/admin.py packages/rakit-web/src/rakit_web/auth_routes.py packages/rakit-web/src/rakit_web/security/authentication.py packages/rakit-web/src/rakit_web/system_responses.py
      - run: uv run ruff check --fix packages/rakit-web/src/rakit_web/admin.py packages/rakit-web/src/rakit_web/auth_routes.py packages/rakit-web/src/rakit_web/security/authentication.py packages/rakit-web/src/rakit_web/system_responses.py
      - run: bun run css:build
      - name: Restore trusted CI and remove helper
        run: |
          git fetch origin ui-06-advanced-operations
          git checkout origin/ui-06-advanced-operations -- .github/workflows/ci.yml
          rm -f .github/ui06c_contract_fix.py
      - name: Commit contract-aligned source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(web): align auth system security contracts"
          git push origin HEAD:ui-06c-auth-system-surfaces

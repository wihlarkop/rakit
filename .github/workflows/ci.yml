name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  d2-manual-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - name: Plain-Python D2 schema smoke
        shell: bash
        run: |
          uv run python - <<'PY'
          import asyncio
          import msgspec
          from pydantic import BaseModel
          from rakit_core.adapter_capabilities import (
              SCHEMA_FIELD_INTROSPECTION,
              SCHEMA_INPUT_VALIDATION,
              SCHEMA_OUTPUT_SERIALIZATION,
              SCHEMA_PARTIAL_UPDATE,
          )
          from rakit_core.conformance import run_integration_conformance
          from rakit_core.errors import RakitError
          from rakit_core.testing.capability_conformance import (
              CANONICAL_CONFORMANCE_SPEC_REGISTRY,
              SchemaConformanceHarness,
          )
          from rakit_schema_msgspec import MsgspecSchemaAdapter
          from rakit_schema_msgspec.discovery import MSGSPEC_INTEGRATION
          from rakit_schema_pydantic import PydanticSchemaAdapter
          from rakit_schema_pydantic.discovery import PYDANTIC_INTEGRATION
          from rakit_web.schema_selection import resolve_schema_adapter

          class PydanticContact(BaseModel):
              name: str
              age: int
              nickname: str | None = None

          class MsgspecContact(msgspec.Struct):
              name: str
              age: int
              nickname: str | None = None

          async def prove(adapter, descriptor, schema):
              harness = SchemaConformanceHarness(
                  adapter=adapter,
                  schema=schema,
                  expected_field_names=("name", "age", "nickname"),
                  valid_input={"name": "Ada", "age": 36, "nickname": None},
                  invalid_input={"name": "Ada", "age": "bad"},
                  serializable_input={"name": "Ada", "age": 36, "nickname": "Enchantress"},
                  expected_serialized_output={"name": "Ada", "age": 36, "nickname": "Enchantress"},
                  partial_input={"nickname": None},
                  expected_partial_output={"nickname": None},
              )
              harnesses = {
                  SCHEMA_FIELD_INTROSPECTION.name: harness,
                  SCHEMA_INPUT_VALIDATION.name: harness,
                  SCHEMA_OUTPUT_SERIALIZATION.name: harness,
                  SCHEMA_PARTIAL_UPDATE.name: harness,
              }
              result = await run_integration_conformance(
                  descriptor=descriptor,
                  harnesses=harnesses,
                  specs=CANONICAL_CONFORMANCE_SPEC_REGISTRY,
              )
              assert result.passed, result.failures

          asyncio.run(prove(PydanticSchemaAdapter(), PYDANTIC_INTEGRATION, PydanticContact))
          asyncio.run(prove(MsgspecSchemaAdapter(), MSGSPEC_INTEGRATION, MsgspecContact))

          assert PydanticSchemaAdapter().validate_partial_input(PydanticContact, {}) == {}
          assert PydanticSchemaAdapter().validate_partial_input(PydanticContact, {"nickname": None}) == {"nickname": None}
          assert MsgspecSchemaAdapter().validate_partial_input(MsgspecContact, {}) == {}
          assert MsgspecSchemaAdapter().validate_partial_input(MsgspecContact, {"nickname": None}) == {"nickname": None}

          default = resolve_schema_adapter(None, schema_integration_id=None)
          explicit = resolve_schema_adapter(None, schema_integration_id="schema.msgspec")
          assert default.rakit_integration.integration_id == "schema.pydantic"
          assert explicit.rakit_integration.integration_id == "schema.msgspec"
          try:
              resolve_schema_adapter(None, schema_integration_id="schema.unknown")
          except RakitError as exc:
              assert exc.details["reason"] == "schema_adapter_unavailable"
              assert "schema.pydantic" in exc.details["available"]
              assert "schema.msgspec" in exc.details["available"]
          else:
              raise AssertionError("unknown explicit schema adapter did not fail")

          print("D2_MANUAL_CONFORMANCE_OK")
          PY

name: UI-06 Acceptance Refresh

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  refresh-acceptance:
    if: github.head_ref == 'ui-06-showcase-acceptance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Merge latest UI-06 integration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ui-06-advanced-operations
          set +e
          git merge --no-ff --no-commit origin/ui-06-advanced-operations
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U)"
            expected="packages/rakit-web/src/rakit_web/static/rakit.css"
            if [ "$unresolved" != "$expected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$unresolved"
              exit 1
            fi
            git checkout --theirs -- "$expected"
            git add "$expected"
          fi
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          # Generated CSS belongs to the latest integration source. The acceptance
          # fixture has no CSS-source change, so never carry an obsolete generated diff.
          git checkout origin/ui-06-advanced-operations -- packages/rakit-web/src/rakit_web/static/rakit.css
          git add packages/rakit-web/src/rakit_web/static/rakit.css
      - name: Validate acceptance fixture presence
        run: python .github/ui06_acceptance_refresh.py
      - name: Sync dependencies
        run: uv sync --all-packages --dev --locked
      - name: Let Ruff normalize the regression test
        run: |
          uv run ruff check --fix packages/rakit-web/tests/test_ui06_showcase_acceptance.py
          uv run ruff format packages/rakit-web/tests/test_ui06_showcase_acceptance.py
      - name: Focused acceptance verification
        run: |
          uv run ruff check packages/rakit-web/tests/test_ui06_showcase_acceptance.py examples/ui_showcase/advanced_states.py examples/ui_showcase/main.py
          uv run ty check
          uv run pytest packages/rakit-web/tests/test_ui06_showcase_acceptance.py -q
          uv run python -c "from examples.ui_showcase.main import app, admin; assert app is not None; assert admin.compiled is not None"
      - name: Restore normal CI and remove helper
        run: |
          git checkout origin/ui-06-advanced-operations -- .github/workflows/ci.yml
          rm .github/ui06_acceptance_refresh.py
          git diff --check
      - name: Commit refreshed acceptance branch
        run: |
          git config user.name "rakit-ci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "merge: refresh UI-06 acceptance on integration"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

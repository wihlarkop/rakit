name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  d2-closure-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-d2-schema-adapter-ecosystem
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Apply closure patch
        run: uv run python scripts/d2_closure_patch.py
      - name: Format and verify closure files
        run: |
          uv run ruff format packages/rakit-schema-pydantic/tests/test_pydantic_schema_contracts.py
          uv run ruff format packages/rakit-schema-msgspec/tests/test_msgspec_schema_contracts.py
          uv run ruff format scripts/check_artifacts.py tests/examples/test_read_examples.py
          uv run ruff check --fix packages/rakit-schema-pydantic/tests/test_pydantic_schema_contracts.py packages/rakit-schema-msgspec/tests/test_msgspec_schema_contracts.py scripts/check_artifacts.py tests/examples/test_read_examples.py
          uv run ruff format packages/rakit-schema-pydantic/tests/test_pydantic_schema_contracts.py packages/rakit-schema-msgspec/tests/test_msgspec_schema_contracts.py scripts/check_artifacts.py tests/examples/test_read_examples.py
          uv run mkdocs build --strict
      - name: Commit closure changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/roadmap.md scripts/check_artifacts.py tests/examples/test_read_examples.py packages/rakit-schema-pydantic/tests/test_pydantic_schema_contracts.py packages/rakit-schema-msgspec/tests/test_msgspec_schema_contracts.py
          git commit -m "chore(schema): apply D2 closure verification fixes"
          git push origin HEAD:phase-d2-schema-adapter-ecosystem

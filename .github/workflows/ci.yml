name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  d3-2-tortoise-source:
    if: github.head_ref == 'phase-d3-2-tortoise'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-d3-2-tortoise
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - run: uv run ruff format packages/rakit-tortoise/src/rakit_tortoise .github/d3_2_tortoise_smoke.py
      - run: uv run ruff check packages/rakit-tortoise/src/rakit_tortoise .github/d3_2_tortoise_smoke.py
      - run: uv run ty check
      - run: uv run python .github/d3_2_tortoise_smoke.py
      - name: Commit normalized Tortoise source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-tortoise/src/rakit_tortoise
          if git diff --cached --quiet; then
            echo "Tortoise source already normalized"
            exit 0
          fi
          git commit -m "style(tortoise): normalize write adapter source"
          git push origin HEAD:phase-d3-2-tortoise

name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  d1-ruff-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - name: Apply Ruff import fixes in checkout
        run: |
          uv run ruff check --fix \
            packages/rakit-core/tests/test_capability_contracts.py \
            packages/rakit-core/tests/test_capability_conformance.py \
            packages/rakit-web/tests/test_capability_conformance.py \
            packages/rakit-sqlalchemy/tests/test_capability_profile.py
      - name: Print exact Ruff diff
        run: git diff --no-ext-diff --unified=20 -- packages/rakit-core/tests packages/rakit-web/tests/test_capability_conformance.py packages/rakit-sqlalchemy/tests/test_capability_profile.py

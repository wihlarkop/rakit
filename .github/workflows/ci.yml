name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  d1-source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - name: Format temporary source-smoke checkout
        run: uv run ruff format .
      - run: uv run ruff check .
      - name: Run D1 plain-Python first-party conformance smoke
        run: uv run python scripts/_d1_source_smoke.py
      - name: Print formatter changes for cleanup reference
        if: always()
        run: git diff --no-ext-diff --unified=20 -- scripts/_d1_source_smoke.py

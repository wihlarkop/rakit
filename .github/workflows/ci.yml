name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  formatter-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - name: Print formatter diff
        shell: bash
        run: |
          uv run ruff format packages/rakit-core/src/rakit_core/conformance.py packages/rakit-core/src/rakit_core/testing/capability_conformance.py
          git diff --no-ext-diff --unified=99999 -- packages/rakit-core/src/rakit_core/conformance.py packages/rakit-core/src/rakit_core/testing/capability_conformance.py
          exit 1

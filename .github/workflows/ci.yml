name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  d3-3-bootstrap:
    name: D3.3 source bootstrap
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-d3-3-peewee
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Refresh lockfile and package inventory
        run: |
          uv lock
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/examples/test_read_examples.py")
          text = path.read_text()
          old_name = "test_all_packages_builds_exactly_the_twelve_official_distributions"
          new_name = "test_all_packages_builds_exactly_the_fourteen_official_distributions"
          if old_name in text:
              if text.count(old_name) != 1:
                  raise SystemExit("unexpected official-distribution test name")
              text = text.replace(old_name, new_name)
          elif text.count(new_name) != 1:
              raise SystemExit("official-distribution test name is not canonical")

          marker = '        "rakit_core",\n'
          peewee = '        "rakit_peewee",\n'
          if peewee not in text:
              if text.count(marker) != 1:
                  raise SystemExit("unexpected official-distribution inventory marker")
              text = text.replace(marker, marker + peewee)
          path.write_text(text)
          PY
      - name: Commit source-stage generated changes
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock tests/examples/test_read_examples.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock tests/examples/test_read_examples.py
          git commit -m "build: lock Peewee adapter dependencies"
          git push origin HEAD:phase-d3-3-peewee

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest

  web-assets:
    name: Web asset reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run css:build
      - name: Verify committed CSS matches canonical source
        run: git diff --exit-code -- packages/rakit-web/src/rakit_web/static/rakit.css

  dependency-compatibility:
    name: Dependencies (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [lowest-direct, latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync minimum supported direct dependencies
        if: matrix.mode == 'lowest-direct'
        run: uv sync --all-packages --dev --resolution lowest-direct
      - name: Sync latest allowed dependencies
        if: matrix.mode == 'latest'
        run: uv sync --all-packages --dev --upgrade
      - name: Run test suite without re-syncing
        run: uv run --no-sync pytest -q --tb=short --maxfail=5

  release-gate:
    name: Plan 07 release gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - run: uv run pytest --cov
      - run: uv run mkdocs build --strict
      - run: uv run python scripts/check_artifacts.py

  artifact-dry-run:
    name: Artifact dry run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - run: uv run pytest tests/release -v
      - name: Build all official distributions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          for project in packages/*; do
            uv build "$project" --out-dir dist
          done
          ls -la dist
      - name: Clean-install Tortoise extra from built artifacts
        shell: bash
        run: |
          set -euo pipefail
          uv venv .artifact-tortoise --python 3.12
          uv pip install \
            --python .artifact-tortoise/bin/python \
            --find-links dist \
            "rakit[tortoise]==0.1.0a1"
          .artifact-tortoise/bin/python -I - <<'PY'
          from importlib.metadata import entry_points
          from pathlib import Path

          import rakit_tortoise
          from rakit_tortoise.capabilities import TORTOISE_CAPABILITIES

          module_path = Path(rakit_tortoise.__file__).resolve()
          assert ".artifact-tortoise" in module_path.parts
          assert TORTOISE_CAPABILITIES.capabilities.names == (
              "persistence.read",
              "persistence.write",
              "transactions.root-uow",
          )
          integrations = entry_points(group="rakit.integrations")
          matches = [item for item in integrations if item.name == "persistence.tortoise"]
          assert len(matches) == 1
          assert matches[0].load().integration_id == "persistence.tortoise"
          PY
      - name: Clean-install Peewee extra from built artifacts
        shell: bash
        run: |
          set -euo pipefail
          uv venv .artifact-peewee --python 3.12
          uv pip install \
            --python .artifact-peewee/bin/python \
            --find-links dist \
            "rakit[peewee]==0.1.0a1"
          .artifact-peewee/bin/python -I - <<'PY'
          from importlib.metadata import entry_points
          from pathlib import Path

          import rakit_peewee
          from rakit_peewee.capabilities import PEEWEE_CAPABILITIES

          module_path = Path(rakit_peewee.__file__).resolve()
          assert ".artifact-peewee" in module_path.parts
          assert PEEWEE_CAPABILITIES.capabilities.names == (
              "persistence.read",
              "persistence.write",
              "transactions.root-uow",
          )
          integrations = entry_points(group="rakit.integrations")
          matches = [item for item in integrations if item.name == "persistence.peewee"]
          assert len(matches) == 1
          assert matches[0].load().integration_id == "persistence.peewee"
          PY
      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pr-python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  lint-fix-c3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - name: Apply canonical Ruff import ordering
        run: uv run ruff check --fix packages/rakit/tests/test_install_ux.py
      - name: Commit lint fix when needed
        run: |
          if git diff --quiet; then
            echo "No lint changes required."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit/tests/test_install_ux.py
          git commit -m "style: apply C3 canonical import ordering"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

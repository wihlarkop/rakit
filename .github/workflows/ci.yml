name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  ui06d-compat-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ui-06d-custom-pages-feedback
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - run: uv run python .github/ui06d_compat_fix.py
      - run: uv run ruff format packages/rakit-web/src/rakit_web/page_routes.py packages/rakit-web/tests/test_custom_page_ui_maturity.py
      - run: uv run ruff check --fix packages/rakit-web/src/rakit_web/page_routes.py packages/rakit-web/tests/test_custom_page_ui_maturity.py
      - name: Restore trusted CI and remove helper
        run: |
          git fetch origin ui-06-advanced-operations
          git checkout origin/ui-06-advanced-operations -- .github/workflows/ci.yml
          rm -f .github/ui06d_compat_fix.py
      - name: Commit compatibility fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(web): preserve custom page helper compatibility"
          git push origin HEAD:ui-06d-custom-pages-feedback

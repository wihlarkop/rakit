name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  d3-2-tortoise-source:
    if: github.head_ref == 'phase-d3-2-tortoise'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - run: uv run ruff format --check packages/rakit-tortoise/src/rakit_tortoise .github/d3_2_tortoise_smoke.py
      - run: uv run ruff check packages/rakit-tortoise/src/rakit_tortoise .github/d3_2_tortoise_smoke.py
      - run: uv run ty check
      - run: uv run python .github/d3_2_tortoise_smoke.py

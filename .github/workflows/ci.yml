name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  d2-test-import-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - name: Migrate Pydantic test ownership
        shell: python
        run: |
          from pathlib import Path

          root = Path("packages/rakit-web/tests")
          changed = 0
          for path in root.glob("test_*.py"):
              text = path.read_text()
              original = text
              text = text.replace(
                  "from rakit_web.schema import PydanticSchemaAdapter",
                  "from rakit_schema_pydantic import PydanticSchemaAdapter",
              )
              text = text.replace(
                  "from rakit_web.schema import PYDANTIC_SCHEMA_CAPABILITIES, PydanticSchemaAdapter",
                  "from rakit_schema_pydantic import PYDANTIC_SCHEMA_CAPABILITIES, PydanticSchemaAdapter",
              )
              text = text.replace(
                  "from rakit_web.discovery import PYDANTIC_INTEGRATION, STARLETTE_INTEGRATION",
                  "from rakit_schema_pydantic.discovery import PYDANTIC_INTEGRATION\nfrom rakit_web.discovery import STARLETTE_INTEGRATION",
              )
              if text != original:
                  path.write_text(text)
                  changed += 1
          print(f"migrated {changed} test files")
          stale = [
              str(path)
              for path in root.glob("test_*.py")
              if "rakit_web.schema" in path.read_text()
              or "from rakit_web.discovery import PYDANTIC_INTEGRATION" in path.read_text()
          ]
          if stale:
              raise SystemExit(f"stale schema ownership imports: {stale}")
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: |
          uv sync --all-packages --dev --locked
          uv run ruff check --fix packages/rakit-web/tests
          uv run ruff format packages/rakit-web/tests
          uv run ty check
      - name: Commit import migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packages/rakit-web/tests
          git commit -m "test(schema): migrate Pydantic ownership imports"
          git push origin HEAD:${{ github.head_ref }}

name: UI-06 Acceptance V2 Build

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  build-acceptance:
    if: github.head_ref == 'ui-06-showcase-acceptance-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Fetch accepted fixture source from superseded branch
        run: |
          git fetch origin ui-06-showcase-acceptance
          git show origin/ui-06-showcase-acceptance:examples/ui_showcase/advanced_states.py > examples/ui_showcase/advanced_states.py
          git show origin/ui-06-showcase-acceptance:packages/rakit-web/tests/test_ui06_showcase_acceptance.py > packages/rakit-web/tests/test_ui06_showcase_acceptance.py
      - name: Apply integration-relative main wiring
        run: python .github/ui06_acceptance_v2.py
      - name: Sync dependencies and normalize source
        run: |
          uv sync --all-packages --dev --locked
          uv run ruff check --fix packages/rakit-web/tests/test_ui06_showcase_acceptance.py examples/ui_showcase/advanced_states.py examples/ui_showcase/main.py
          uv run ruff format packages/rakit-web/tests/test_ui06_showcase_acceptance.py examples/ui_showcase/advanced_states.py examples/ui_showcase/main.py
      - name: Focused acceptance verification
        run: |
          uv run ruff check packages/rakit-web/tests/test_ui06_showcase_acceptance.py examples/ui_showcase/advanced_states.py examples/ui_showcase/main.py
          uv run ty check
          uv run pytest packages/rakit-web/tests/test_ui06_showcase_acceptance.py -q
          uv run python -c "from examples.ui_showcase.main import app, admin; assert app is not None; assert admin.compiled is not None"
      - name: Restore normal CI and remove helper
        run: |
          git checkout origin/ui-06-advanced-operations -- .github/workflows/ci.yml
          rm .github/ui06_acceptance_v2.py
          git diff --check
      - name: Commit clean acceptance fixture
        run: |
          git config user.name "rakit-ci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(showcase): complete UI-06 acceptance fixtures"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

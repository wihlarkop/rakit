name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-c3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - name: Apply canonical Ruff formatting
        run: |
          uv run ruff format \
            packages/rakit/src/rakit/scaffold/render.py \
            packages/rakit/tests/test_facade.py \
            scripts/check_artifacts.py \
            tests/release/test_installed_artifacts.py
      - name: Commit canonical formatting when needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/rakit/src/rakit/scaffold/render.py \
            packages/rakit/tests/test_facade.py \
            scripts/check_artifacts.py \
            tests/release/test_installed_artifacts.py
          git commit -m "style: apply C3 canonical formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
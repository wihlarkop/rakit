name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  c1-provider-hardening:
    name: C1 provider hardening
    if: github.event_name == 'pull_request' && github.head_ref == 'phase-c1-crud-lifecycle-ergonomics'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-c1-crud-lifecycle-ergonomics
          fetch-depth: 0
      - run: python scripts/_c1_harden_write_provider.py
      - name: Commit hardening when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-web/src/rakit_web/admin.py
          if ! git diff --cached --quiet; then
            git commit -m "fix(web): fail closed on incomplete declarative write provider"
            git push origin HEAD:phase-c1-crud-lifecycle-ergonomics
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest

  web-assets:
    name: Web asset reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run css:build
      - name: Verify committed CSS matches canonical source
        run: git diff --exit-code -- packages/rakit-web/src/rakit_web/static/rakit.css

  dependency-compatibility:
    name: Dependencies (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [lowest-direct, latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync minimum supported direct dependencies
        if: matrix.mode == 'lowest-direct'
        run: uv sync --all-packages --dev --resolution lowest-direct
      - name: Sync latest allowed dependencies
        if: matrix.mode == 'latest'
        run: uv sync --all-packages --dev --upgrade
      - name: Run test suite without re-syncing
        run: uv run --no-sync pytest -q --tb=short --maxfail=5

  release-gate:
    name: Plan 07 release gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - run: uv run pytest --cov
      - run: uv run mkdocs build --strict
      - run: uv run python scripts/check_artifacts.py

  artifact-dry-run:
    name: Artifact dry run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - run: uv run pytest tests/release -v
      - name: Build all official distributions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          for project in packages/*; do
            uv build "$project" --out-dir dist
          done
          ls -la dist
      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pr-python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

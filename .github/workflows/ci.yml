name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  ui06-showcase-wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ui-06-showcase-acceptance
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
      - run: uv sync --all-packages --dev --locked
      - run: bun install --frozen-lockfile
      - run: uv run python .github/ui06_showcase_wire.py
      - run: uv run ruff format examples/ui_showcase/main.py examples/ui_showcase/advanced_states.py
      - run: uv run ruff check --fix examples/ui_showcase/main.py examples/ui_showcase/advanced_states.py
      - run: bun run css:build
      - name: Import and compile showcase
        run: uv run python -c "from examples.ui_showcase.main import app; print(type(app).__name__)"
      - name: Restore trusted CI and remove helper
        run: |
          git fetch origin ui-06-advanced-operations
          git checkout origin/ui-06-advanced-operations -- .github/workflows/ci.yml
          rm -f .github/ui06_showcase_wire.py
      - name: Commit acceptance source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(showcase): wire UI-06 acceptance states"
          git push origin HEAD:ui-06-showcase-acceptance

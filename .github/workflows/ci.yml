name: UI-06 Final Polish Build

on:
  pull_request:

permissions:
  contents: write

jobs:
  build-polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ui-06-final-polish-scroll-dialog
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - name: Apply bounded source polish
        run: python .github/ui06_final_polish.py
      - name: Rebuild committed CSS
        run: |
          bun install --frozen-lockfile
          bun run css:build
      - name: Non-test source verification
        shell: bash
        run: |
          set -euo pipefail
          node --check packages/rakit-web/src/rakit_web/static/rakit-shell.js
          grep -q 'data-rakit-desktop-navigation-scroll' packages/rakit-web/src/rakit_web/templates/components/admin_navigation.html
          grep -q 'sessionStorage.setItem' packages/rakit-web/src/rakit_web/static/rakit-shell.js
          grep -q 'transform: translate(-50%, -50%);' packages/rakit-web/src/rakit_web/assets/rakit.css
          grep -q 'transform:translate(-50%,-50%)' packages/rakit-web/src/rakit_web/static/rakit.css
      - name: Restore normal CI and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ui-06-advanced-operations
          git show origin/ui-06-advanced-operations:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm .github/ui06_final_polish.py
          git status --short
      - name: Commit clean product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-web/src/rakit_web/assets/rakit.css \
                  packages/rakit-web/src/rakit_web/static/rakit.css \
                  packages/rakit-web/src/rakit_web/static/rakit-shell.js \
                  packages/rakit-web/src/rakit_web/templates/components/admin_navigation.html \
                  .github/workflows/ci.yml \
                  .github/ui06_final_polish.py
          git diff --cached --exit-code -- .github/workflows/ci.yml || {
            echo "Normal CI was not restored exactly" >&2
            exit 1
          }
          if git diff --cached --name-only | grep -q '^\.github/'; then
            echo "Temporary helper files remain staged" >&2
            git diff --cached --name-only
            exit 1
          fi
          git commit -m "fix(web): preserve sidebar scroll and center dialogs"
          git push origin HEAD:ui-06-final-polish-scroll-dialog

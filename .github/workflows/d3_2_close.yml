name: D3.2 closure

on:
  push:
    branches: [phase-d3-2-tortoise]

permissions:
  contents: write

jobs:
  close-d3-2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-d3-2-tortoise
      - name: Close D3.2 roadmap state
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap = Path("docs/roadmap.md")
          text = roadmap.read_text()
          replacements = {
              "| Phase D3 persistence adapter ecosystem | **Next** |": "| Phase D3 persistence adapter ecosystem | **Active** |",
              "| Phase D adapter ecosystem | **Next** |": "| Phase D adapter ecosystem | **Active** |",
              "## Phase D — Adapter ecosystem\n\n**Status: Next**": "## Phase D — Adapter ecosystem\n\n**Status: Active**",
              "#### D3.2 — Tortoise ORM\n\n**Status: Active**\n\nComplete the first-party Tortoise adapter, then add writes, root-UoW behavior, and higher capabilities only where public Tortoise APIs satisfy the canonical contracts cleanly.": "#### D3.2 — Tortoise ORM\n\n**Status: Complete**\n\n- native Tortoise model introspection and deterministic read/query support;\n- generated scalar create, partial update, and delete through one root-owned Tortoise transaction;\n- verified `persistence.read`, `persistence.write`, and `transactions.root-uow` capability profile;\n- permanent SQLite-backed conformance, generated compiler regression, lowest/latest dependency verification, and clean-installed artifact smoke;\n- relationships and atomic optimistic concurrency remain deliberately unadvertised because D3.2 does not yet provide the neutral mutation/token implementations required to prove those canonical contracts.",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one roadmap match, got {count}: {old!r}")
              text = text.replace(old, new)
          roadmap.write_text(text)

          smoke = Path(".github/d3_2_tortoise_smoke.py")
          if not smoke.exists():
              raise SystemExit("expected temporary D3.2 smoke helper to exist")
          smoke.unlink()
          PY
      - name: Commit closure
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap.md .github/d3_2_tortoise_smoke.py
          git commit -m "docs(d3.2): close Tortoise integration"
          git push origin HEAD:phase-d3-2-tortoise

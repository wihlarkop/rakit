name: Phase B test formatting

on:
  push:
    branches: [phase-b-reference-app-hardening]

permissions:
  contents: write

jobs:
  format-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-b-reference-app-hardening
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - run: |
          uv run ruff format packages/rakit-web/tests/test_public_write_composition.py packages/rakit-web/tests/test_lifecycle_startup_callbacks.py packages/rakit/tests/test_phase_b_facades.py tests/test_reference_app.py
          uv run ruff check --fix packages/rakit-web/tests/test_public_write_composition.py packages/rakit-web/tests/test_lifecycle_startup_callbacks.py packages/rakit/tests/test_phase_b_facades.py tests/test_reference_app.py
          git diff --check
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-web/tests/test_public_write_composition.py packages/rakit-web/tests/test_lifecycle_startup_callbacks.py packages/rakit/tests/test_phase_b_facades.py tests/test_reference_app.py
          git commit -m "style: normalize Phase B regression tests"
          git push origin HEAD:phase-b-reference-app-hardening

# Temporary workflow; remove after formatting lands.

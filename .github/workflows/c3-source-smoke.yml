name: C3 source smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  source-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Refresh lockfile if metadata changed
        run: |
          uv lock
          if ! git diff --quiet -- uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- uv.lock
            git commit -m "chore: refresh uv lock for C3 extras"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Sync locked workspace
        run: uv sync --all-packages --dev --locked
      - name: Verify canonical package metadata
        run: |
          uv run python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("packages/rakit/pyproject.toml").read_text())
          extras = data["project"]["optional-dependencies"]
          expected = {
              "uvicorn",
              "granian",
              "sqlalchemy",
              "auth-sqlalchemy",
              "storage-local",
              "standard",
          }
          assert set(extras) == expected, extras
          assert extras["standard"] == [
              "rakit-sqlalchemy==0.1.0a1",
              "rakit-auth-sqlalchemy==0.1.0a1",
              "rakit-storage-local==0.1.0a1",
          ]
          print("metadata: PASS")
          PY
      - name: Verify install vocabulary and scaffold combinations
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from rakit._install import InstallExtra, rakit_requirement, uv_add_command
          from rakit.scaffold.model import InitConfig, InitMode, ServerAdapter, StarterTemplate
          from rakit.scaffold.render import dependency_command_for, render_scaffold_files

          assert rakit_requirement(InstallExtra.STANDARD, InstallExtra.UVICORN) == "rakit[standard,uvicorn]"
          assert rakit_requirement(InstallExtra.UVICORN, InstallExtra.STANDARD, InstallExtra.STANDARD) == "rakit[standard,uvicorn]"
          assert rakit_requirement(InstallExtra.STANDARD, InstallExtra.GRANIAN) == "rakit[standard,granian]"
          assert uv_add_command(
              InstallExtra.STANDARD,
              InstallExtra.UVICORN,
              packages=("aiosqlite",),
          ) == ("uv", "add", "rakit[standard,uvicorn]", "aiosqlite")
          try:
              rakit_requirement("uvicorn")  # type: ignore[arg-type]
          except TypeError:
              pass
          else:
              raise AssertionError("raw extra strings must fail")

          expected = {
              (StarterTemplate.MINIMAL, ServerAdapter.UVICORN): ("rakit[uvicorn]",),
              (StarterTemplate.MINIMAL, ServerAdapter.GRANIAN): ("rakit[granian]",),
              (StarterTemplate.STANDARD, ServerAdapter.UVICORN): ("rakit[standard,uvicorn]", "aiosqlite"),
              (StarterTemplate.STANDARD, ServerAdapter.GRANIAN): ("rakit[standard,granian]", "aiosqlite"),
          }

          with TemporaryDirectory() as raw:
              root = Path(raw)
              for (template, server), dependencies in expected.items():
                  target = root / f"{template.value}-{server.value}"
                  module_root = target / "src" / "demo"
                  config = InitConfig(
                      mode=InitMode.NEW,
                      target=target,
                      template=template,
                      server=server,
                      distribution_name="demo",
                      import_package="demo",
                      module_root=module_root,
                      host_package=None,
                      host_framework=None,
                      install_dependencies=True,
                      dry_run=True,
                  )
                  files = render_scaffold_files(config)
                  pyproject = next(file.content for file in files if file.path.name == "pyproject.toml")
                  for dependency in dependencies:
                      assert f'"{dependency}"' in pyproject, (template, server, pyproject)
                  if template is StarterTemplate.MINIMAL:
                      assert "aiosqlite" not in pyproject

                  existing = InitConfig(
                      mode=InitMode.EXISTING,
                      target=target,
                      template=template,
                      server=server,
                      distribution_name=None,
                      import_package="demo.rakit_admin",
                      module_root=target / "demo" / "rakit_admin",
                      host_package="demo",
                      host_framework=None,
                      install_dependencies=True,
                      dry_run=True,
                  )
                  assert dependency_command_for(existing) == ("uv", "add", *dependencies)

          print("install vocabulary + scaffold: PASS")
          PY
      - name: Verify optional dependency diagnostics
        run: |
          uv run python - <<'PY'
          import importlib
          import sys
          import tempfile
          from pathlib import Path

          from rakit._install import InstallExtra
          from rakit._optional import OptionalDependency, RakitOptionalDependencyError, require_module

          cases = (
              ("rakit_sqlalchemy", "rakit.sqlalchemy", "SQLAlchemy support", 'uv add "rakit[sqlalchemy]"'),
              ("rakit_auth_sqlalchemy", "rakit.auth.sqlalchemy", "SQLAlchemy authentication support", 'uv add "rakit[auth-sqlalchemy]"'),
              ("rakit_storage_local", "rakit.storage.local", "Local storage support", 'uv add "rakit[storage-local]"'),
              ("rakit_server_uvicorn", "rakit.server.uvicorn", "Uvicorn support", 'uv add "rakit[uvicorn]"'),
              ("rakit_server_granian", "rakit.server.granian", "Granian support", 'uv add "rakit[granian]"'),
          )

          for implementation, facade, label, command in cases:
              saved = sys.modules.get(implementation, ...)
              sys.modules[implementation] = None
              sys.modules.pop(facade, None)
              try:
                  importlib.import_module(facade)
              except RakitOptionalDependencyError as exc:
                  message = str(exc)
                  assert label in message, message
                  assert command in message, message
              else:
                  raise AssertionError(f"{facade} did not fail when {implementation} was unavailable")
              finally:
                  sys.modules.pop(facade, None)
                  if saved is ...:
                      sys.modules.pop(implementation, None)
                  else:
                      sys.modules[implementation] = saved

          dependency = OptionalDependency(InstallExtra.SQLALCHEMY, "SQLAlchemy")
          with tempfile.TemporaryDirectory() as raw:
              module_dir = Path(raw)
              module_dir.joinpath("rakit_c3_fake_optional.py").write_text(
                  "import c3_transitive_dependency_that_does_not_exist\n"
              )
              sys.path.insert(0, raw)
              try:
                  require_module("rakit_c3_fake_optional", dependency=dependency)
              except ModuleNotFoundError as exc:
                  assert exc.name == "c3_transitive_dependency_that_does_not_exist"
                  assert not isinstance(exc, RakitOptionalDependencyError)
              else:
                  raise AssertionError("transitive failure was hidden")
              finally:
                  sys.path.remove(raw)
                  sys.modules.pop("rakit_c3_fake_optional", None)

          print("optional diagnostics: PASS")
          PY
      - name: Verify active source has no unpublished alias
        run: |
          ! grep -R "server-uvicorn" \
            packages/rakit/pyproject.toml \
            packages/rakit/src/rakit \
            docs/getting-started
          echo "legacy alias active-surface scan: PASS"

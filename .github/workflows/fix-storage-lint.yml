name: Fix Storage Lint

on:
  push:
    branches:
      - feat/storage-foundation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/storage-foundation
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/rakit-web/src/rakit_web/form_routes.py')
          text = path.read_text()
          anchor = 'from rakit_core.operations import (\n'
          storage_import = 'from rakit_storage import FileStorage\n'
          assert storage_import not in text
          index = text.index('from starlette.datastructures import UploadFile')
          text = text[:index] + storage_import + text[index:]
          path.write_text(text)
          PY
          uv run ruff check packages/rakit-web/src/rakit_web/form_routes.py --fix
          uv run ruff format packages/rakit-web/src/rakit_web/form_routes.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-web/src/rakit_web/form_routes.py
          git rm .github/workflows/fix-storage-lint.yml
          git commit -m "fix(web): complete storage lifecycle imports"
          git push origin HEAD:feat/storage-foundation

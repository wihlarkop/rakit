name: First Generated REST Legacy Test Update

on:
  push:
    branches: [feat/first-generated-rest-mutations]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'ci: update generated REST legacy test expectations' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/first-generated-rest-mutations
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --dev --locked
      - name: Update SQLAlchemy runtime seam expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/rakit-sqlalchemy/tests/test_plugin.py')
          text = path.read_text()

          old = 'from rakit_core.identity import RecordIdentity\n'
          new = 'from rakit_core.generated_runtime import ResourceAdapterRuntime\nfrom rakit_core.identity import RecordIdentity\n'
          assert old in text
          text = text.replace(old, new, 1)

          old = 'from rakit_sqlalchemy.introspection import inspect_model\n'
          new = '''from rakit_sqlalchemy.generated import SQLAlchemyGeneratedResourceExecutorProvider\nfrom rakit_sqlalchemy.introspection import inspect_model\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    datasource = claim(\n        User,\n        ResourceFieldPolicy(list_fields=("id", "name"), detail_fields=("id", "name")),\n    )\n\n    assert isinstance(datasource, SQLAlchemyDataSource)\n'''
          new = '''    runtime = claim(\n        User,\n        ResourceFieldPolicy(list_fields=("id", "name"), detail_fields=("id", "name")),\n    )\n\n    assert isinstance(runtime, ResourceAdapterRuntime)\n    assert isinstance(runtime.data_source, SQLAlchemyDataSource)\n    assert isinstance(\n        runtime.generated_executor_provider,\n        SQLAlchemyGeneratedResourceExecutorProvider,\n    )\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    datasource = plugin._claim(model, policy)\n\n    assert isinstance(datasource, SQLAlchemyDataSource)\n'''
          new = '''    runtime = plugin._claim(model, policy)\n\n    assert isinstance(runtime, ResourceAdapterRuntime)\n    assert isinstance(runtime.data_source, SQLAlchemyDataSource)\n    assert isinstance(\n        runtime.generated_executor_provider,\n        SQLAlchemyGeneratedResourceExecutorProvider,\n    )\n'''
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          uv run ruff format packages/rakit-sqlalchemy/tests/test_plugin.py
          uv run ruff check packages/rakit-sqlalchemy/tests/test_plugin.py
          uv run pytest \
            packages/rakit-core/tests/test_generated_resource_runtime.py \
            packages/rakit-core/tests/test_generated_rest_compilation.py \
            packages/rakit-sqlalchemy/tests/test_plugin.py \
            packages/rakit-web/tests/test_generated_rest_mutation_runtime.py \
            -q
      - name: Commit updated expectations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-sqlalchemy/tests/test_plugin.py
          git commit -m "test: align generated REST runtime expectations"
          git push origin HEAD:feat/first-generated-rest-mutations

name: Core format probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - name: Format Core relationship runtime and print canonical diff
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format packages/rakit-sqlalchemy/src/rakit_sqlalchemy/core_relationship_mutations.py
          git diff -- packages/rakit-sqlalchemy/src/rakit_sqlalchemy/core_relationship_mutations.py

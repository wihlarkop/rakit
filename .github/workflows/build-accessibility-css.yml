name: Build Accessibility CSS

on:
  push:
    branches:
      - feat/accessibility-foundation

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/accessibility-foundation
      - name: Install pinned Tailwind compiler
        run: npm install --no-save --package-lock=false @tailwindcss/cli@4.1.18 tailwindcss@4.1.18
      - name: Build bundled CSS
        run: npm run css:build
      - name: Commit bundle and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-web/src/rakit_web/static/rakit.css
          git rm .github/workflows/build-accessibility-css.yml
          git commit -m "build(web): regenerate accessible Tailwind bundle"
          git push origin HEAD:feat/accessibility-foundation

name: Debug UI-05B empty showcase

on:
  pull_request:

permissions:
  contents: write

jobs:
  add-empty-resource:
    if: github.event.pull_request.head.ref == 'ui-05b-resource-list-experience'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ui-05b-resource-list-experience
      - name: Add deterministic empty resource
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("examples/ui_showcase/main.py")
          text = path.read_text(encoding="utf-8")
          if "class ReturnsAdmin(ResourceAdmin):" not in text:
              marker = "\n\nclass DemoAuthBackend:\n"
              block = '''

class ReturnsAdmin(ResourceAdmin):
    resource_id = "returns"
    path = "/returns"
    label = "Returns"
    singular_label = "Return"
    data_source = _MemoryDataSource((), ("id", "customer", "status"))
    list_fields = ("id", "customer", "status")
    detail_fields = ("id", "customer", "status")
    filter_fields = ("status",)
    search_fields = ("id", "customer")
    sort_fields = ("id", "customer", "status")
'''
              text = text.replace(marker, block + marker, 1)
          old = "    InventoryAdmin,\n    TeamsAdmin,\n):"
          new = "    InventoryAdmin,\n    TeamsAdmin,\n    ReturnsAdmin,\n):"
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit showcase resource when changed
        shell: bash
        run: |
          if git diff --quiet -- examples/ui_showcase/main.py; then
            echo "Empty showcase resource already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/ui_showcase/main.py
          git commit -m "feat(examples): add empty resource list state"
          git push origin HEAD:ui-05b-resource-list-experience

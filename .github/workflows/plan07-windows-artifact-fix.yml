name: Plan 07 Windows artifact smoke fix

on:
  push:
    branches:
      - plan-07-hardening-examples-release

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: plan-07-hardening-examples-release
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - name: Apply Windows CLI resolution regression fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path("scripts/check_artifacts.py")
          text = script.read_text(encoding="utf-8")
          old = '''    python = _venv_python(venv)\n    cli = _venv_rakit(venv)\n    _run(\n'''
          new = '''    python = _venv_python(venv)\n    _run(\n'''
          if old not in text:
              raise SystemExit("pre-install CLI resolution pattern not found")
          text = text.replace(old, new, 1)
          marker = '''    _assert_installed_imports(python, cwd=workspace, repository=root)\n'''
          replacement = '''    cli = _venv_rakit(venv)\n    _assert_installed_imports(python, cwd=workspace, repository=root)\n'''
          if marker not in text:
              raise SystemExit("installed-import marker not found")
          text = text.replace(marker, replacement, 1)
          script.write_text(text, encoding="utf-8")

          tests = Path("tests/release/test_installed_artifacts.py")
          test_text = tests.read_text(encoding="utf-8")
          if "test_clean_install_resolves_cli_after_standard_install" not in test_text:
              test_text += '''\n\ndef test_clean_install_resolves_cli_after_standard_install(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    repository, _checker = _load_checker(monkeypatch)\n    source = (repository / "scripts" / "check_artifacts.py").read_text(encoding="utf-8")\n    install_marker = 'f"rakit[standard]=={VERSION}"'\n    cli_marker = "cli = _venv_rakit(venv)"\n    assert source.index(install_marker) < source.index(cli_marker)\n'''
              tests.write_text(test_text, encoding="utf-8")
          PY
      - run: uv run ruff format scripts/check_artifacts.py tests/release/test_installed_artifacts.py
      - run: uv run ruff check scripts/check_artifacts.py tests/release/test_installed_artifacts.py
      - run: uv run ty check scripts/check_artifacts.py tests/release/test_installed_artifacts.py
      - run: uv run pytest tests/release/test_installed_artifacts.py -q
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_artifacts.py tests/release/test_installed_artifacts.py
          git commit -m "fix(release): resolve installed CLI after package install"
          git push origin HEAD:plan-07-hardening-examples-release

name: UI-05D composition patch

on:
  pull_request:
    branches:
      - ui-05-resource-experience

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-05d-resource-query-configuration
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic composition patch
        run: python .github/ui05d_patch_composition.py
      - name: Format touched Python files
        run: >-
          uv run ruff format
          packages/rakit-core/src/rakit_core/compiler.py
          packages/rakit-web/src/rakit_web/admin.py
          packages/rakit-sqlalchemy/src/rakit_sqlalchemy/datasource.py
      - name: Verify patch anchors are lint-clean
        run: >-
          uv run ruff check
          packages/rakit-core/src/rakit_core/compiler.py
          packages/rakit-web/src/rakit_web/admin.py
          packages/rakit-sqlalchemy/src/rakit_sqlalchemy/datasource.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/rakit-core/src/rakit_core/compiler.py \
            packages/rakit-web/src/rakit_web/admin.py \
            packages/rakit-sqlalchemy/src/rakit_sqlalchemy/datasource.py
          if git diff --cached --quiet; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git commit -m 'feat(query): wire resource query composition'
          git push origin HEAD:ui-05d-resource-query-configuration

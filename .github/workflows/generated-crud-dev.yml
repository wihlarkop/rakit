name: Generated CRUD Development

on:
  push:
    branches: [feat/generated-crud-api-foundation]

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --dev --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: >-
          uv run pytest
          packages/rakit-core/tests/test_generated_api_definitions.py
          packages/rakit-core/tests/test_generated_api_compilation.py
          packages/rakit-core/tests/test_generated_api_input.py
          packages/rakit-core/tests/test_generated_api_query.py
          packages/rakit-core/tests/test_generated_api_operations.py
          packages/rakit-sqlalchemy/tests/test_generated_field_metadata.py
          packages/rakit-web/tests/test_generated_api_registration.py
          -q
      - run: uv run pytest

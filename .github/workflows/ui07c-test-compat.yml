name: UI-07C compatibility test update

on:
  push:
    branches: [ui-07c-contrast-motion-copy]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ui-07c-contrast-motion-copy
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.12'
      - run: python .github/ui07c_test_compat_patch.py
      - run: uv sync --all-packages --dev --locked
      - run: uv run ruff format tests/test_ui_showcase.py packages/rakit-web/tests/test_resource_detail_form_ui_maturity.py
      - run: uv run pytest tests/test_ui_showcase.py packages/rakit-web/tests/test_resource_detail_form_ui_maturity.py packages/rakit-web/tests/test_ui07_contrast_motion_contracts.py -q
      - name: Commit compatibility test updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_ui_showcase.py packages/rakit-web/tests/test_resource_detail_form_ui_maturity.py
          if git diff --cached --quiet; then
            echo 'No compatibility test changes'
            exit 1
          fi
          git commit -m 'test(web): align confirmation copy contracts'
          git push origin HEAD:ui-07c-contrast-motion-copy

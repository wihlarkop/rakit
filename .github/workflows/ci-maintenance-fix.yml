name: Apply CI portability fix

on:
  push:
    branches: [plan-05-relationships-actions-pages-endpoints]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: plan-05-relationships-actions-pages-endpoints
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - name: Apply cross-platform packaging verification fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          tests = Path("tests/examples/test_read_examples.py")
          text = tests.read_text(encoding="utf-8")

          anchor = 'repository = Path(__file__).resolve().parents[2]\n\n\n'
          helper = '''def _venv_python(environment: Path) -> Path:\n    if os.name == "nt":\n        return environment / "Scripts" / "python.exe"\n    return environment / "bin" / "python"\n\n\ndef _venv_site_packages(python: Path) -> Path:\n    result = subprocess.run(\n        [str(python), "-c", "import sysconfig; print(sysconfig.get_paths()['purelib'])"],\n        check=True,\n        capture_output=True,\n        text=True,\n    )\n    return Path(result.stdout.strip())\n\n\n'''
          if helper not in text:
              if anchor not in text:
                  raise SystemExit("repository anchor not found")
              text = text.replace(anchor, anchor + helper, 1)

          windows_python = 'installed_python = installed / "Scripts" / "python.exe"'
          count = text.count(windows_python)
          if count not in {0, 2}:
              raise SystemExit(f"unexpected Windows interpreter occurrences: {count}")
          text = text.replace(windows_python, "installed_python = _venv_python(installed)")

          windows_ini = '    ini_path = installed / "Lib" / "site-packages" / "rakit_auth_sqlalchemy" / "alembic.ini"\n'
          portable_ini = '    ini_path = _venv_site_packages(installed_python) / "rakit_auth_sqlalchemy" / "alembic.ini"\n'
          if windows_ini in text:
              text = text.replace(windows_ini, portable_ini, 1)
          elif portable_ini not in text:
              raise SystemExit("installed alembic.ini path anchor not found")

          tests.write_text(text, encoding="utf-8")

          alembic = Path("packages/rakit-auth-sqlalchemy/src/rakit_auth_sqlalchemy/alembic.ini")
          ini = alembic.read_text(encoding="utf-8")
          separator = "path_separator = os"
          if separator not in ini:
              marker = "prepend_sys_path = .\n"
              if marker not in ini:
                  raise SystemExit("Alembic prepend_sys_path anchor not found")
              ini = ini.replace(marker, marker + separator + "\n", 1)
          alembic.write_text(ini, encoding="utf-8")
          PY
      - run: uv run ruff format tests/examples/test_read_examples.py
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest
      - run: git diff --check
      - name: Commit verified non-workflow changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/examples/test_read_examples.py packages/rakit-auth-sqlalchemy/src/rakit_auth_sqlalchemy/alembic.ini
          git commit -m "fix: make packaging verification cross-platform"
          git push origin HEAD:plan-05-relationships-actions-pages-endpoints

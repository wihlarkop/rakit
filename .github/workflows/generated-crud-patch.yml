name: Generated CRUD Patch

on:
  push:
    branches: [feat/generated-crud-api-foundation]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci: apply generated CRUD compiler patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/generated-crud-api-foundation
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --dev --locked
      - name: Patch compiler
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/rakit-core/src/rakit_core/compiler.py')
          text = path.read_text()

          old = 'from .errors import ErrorCode, RakitError\nfrom .permissions import PermissionRequirement\n'
          new = (
              'from .errors import ErrorCode, RakitError\n'
              'from .generated_api import CompiledResourceApi\n'
              'from .generated_compiler import compile_generated_resource_apis\n'
              'from .permissions import PermissionRequirement\n'
          )
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    action_routes: tuple[tuple[RouteDefinition, CompiledActionDefinition], ...] = ()\n    capability_providers: tuple[CapabilityProvider, ...] = ()\n'''
          new = '''    action_routes: tuple[tuple[RouteDefinition, CompiledActionDefinition], ...] = ()\n    compiled_resource_apis: tuple[CompiledResourceApi, ...] = ()\n    capability_providers: tuple[CapabilityProvider, ...] = ()\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    capability_reports = tuple(\n        require_capabilities(requirement, builder.capability_providers)\n        for requirement in builder.capability_requirements\n    )\n\n    builder._mark_compiled()\n'''
          new = '''    generated_api = compile_generated_resource_apis(\n        builder.resources, builder._resource_data_sources\n    )\n    capability_requirements = (\n        *builder.capability_requirements,\n        *generated_api.requirements,\n    )\n    capability_reports = tuple(\n        require_capabilities(requirement, builder.capability_providers)\n        for requirement in capability_requirements\n    )\n\n    builder._mark_compiled()\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        _action_route_pairs(all_routes, compiled_actions),\n        capability_providers=builder.capability_providers,\n        capability_requirements=builder.capability_requirements,\n        capability_reports=capability_reports,\n'''
          new = '''        _action_route_pairs(all_routes, compiled_actions),\n        compiled_resource_apis=generated_api.resources,\n        capability_providers=builder.capability_providers,\n        capability_requirements=capability_requirements,\n        capability_reports=capability_reports,\n'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          uv run ruff format packages/rakit-core/src/rakit_core/compiler.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-core/src/rakit_core/compiler.py
          git commit -m "feat: wire generated API compilation"
          git push origin HEAD:feat/generated-crud-api-foundation

name: C4 compatibility fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-c4-capability-discovery
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - name: Restore legacy capability error projection
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          path = Path("packages/rakit-core/src/rakit_core/compiler.py")
          text = path.read_text()

          old = '''        missing_ids = tuple(
              requirement.requirement_id for requirement in analysis.missing_requirements
          )
          super().__init__(
'''
          new = '''        missing_ids = tuple(
              requirement.requirement_id for requirement in analysis.missing_requirements
          )
          missing_reports = tuple(report for report in analysis.reports if not report.satisfied)
          first_missing = missing_reports[0]
          super().__init__(
'''
          if text.count(old) != 1:
              raise RuntimeError("Expected exactly one CapabilityConfigurationError prelude")
          text = text.replace(old, new, 1)

          old_details = '''            details={
                  "reason": "missing_capabilities",
                  "available": list(analysis.available.names),
                  "providers": [
                      {
                          "id": provider.provider_id,
                          "capabilities": list(provider.capabilities.names),
                      }
                      for provider in analysis.providers
                  ],
                  "requirements": [
'''
          new_details = '''            details={
                  "reason": "missing_capabilities",
                  "requirement": first_missing.requirement.requirement_id,
                  "required": list(first_missing.requirement.required.names),
                  "available": list(first_missing.available.names),
                  "missing": list(first_missing.missing.names),
                  "providers": list(first_missing.provider_ids),
                  "provider_details": [
                      {
                          "id": provider.provider_id,
                          "capabilities": list(provider.capabilities.names),
                      }
                      for provider in analysis.providers
                  ],
                  "requirements": [
'''
          if text.count(old_details) != 1:
              raise RuntimeError("Expected exactly one CapabilityConfigurationError details block")
          path.write_text(text.replace(old_details, new_details, 1))
          PY
      - name: Source and compatibility verification
        run: |
          uv run ruff format --check packages/rakit-core/src/rakit_core/compiler.py
          uv run ruff check packages/rakit-core/src/rakit_core/compiler.py
          uv run ty check packages/rakit-core/src/rakit_core/compiler.py
          uv run pytest -q \
            packages/rakit-core/tests/test_generated_api_compilation.py \
            packages/rakit-core/tests/test_generated_rest_compilation.py \
            packages/rakit-web/tests/test_generated_rest_partial_schema.py \
            packages/rakit/tests/test_capability_cli.py
      - name: Commit compatibility fix and remove temporary runner
        run: |
          git rm .github/workflows/c4-compat-fix.yml
          git add packages/rakit-core/src/rakit_core/compiler.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve capability error compatibility"
          git push origin HEAD:phase-c4-capability-discovery

name: B2 HTTPStatus cleanup

on:
  push:
    branches: [phase-b2-alpha-hardening]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-b2-alpha-hardening
      - name: Replace explicit numeric status_code literals
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import re
          from pathlib import Path

          root = Path("packages/rakit-web/src/rakit_web")
          names = {
              100: "CONTINUE", 101: "SWITCHING_PROTOCOLS", 102: "PROCESSING", 103: "EARLY_HINTS",
              200: "OK", 201: "CREATED", 202: "ACCEPTED", 203: "NON_AUTHORITATIVE_INFORMATION",
              204: "NO_CONTENT", 205: "RESET_CONTENT", 206: "PARTIAL_CONTENT", 207: "MULTI_STATUS",
              208: "ALREADY_REPORTED", 226: "IM_USED", 300: "MULTIPLE_CHOICES",
              301: "MOVED_PERMANENTLY", 302: "FOUND", 303: "SEE_OTHER", 304: "NOT_MODIFIED",
              305: "USE_PROXY", 307: "TEMPORARY_REDIRECT", 308: "PERMANENT_REDIRECT",
              400: "BAD_REQUEST", 401: "UNAUTHORIZED", 402: "PAYMENT_REQUIRED", 403: "FORBIDDEN",
              404: "NOT_FOUND", 405: "METHOD_NOT_ALLOWED", 406: "NOT_ACCEPTABLE",
              407: "PROXY_AUTHENTICATION_REQUIRED", 408: "REQUEST_TIMEOUT", 409: "CONFLICT",
              410: "GONE", 411: "LENGTH_REQUIRED", 412: "PRECONDITION_FAILED",
              413: "REQUEST_ENTITY_TOO_LARGE", 414: "REQUEST_URI_TOO_LONG",
              415: "UNSUPPORTED_MEDIA_TYPE", 416: "REQUESTED_RANGE_NOT_SATISFIABLE",
              417: "EXPECTATION_FAILED", 418: "IM_A_TEAPOT", 421: "MISDIRECTED_REQUEST",
              422: "UNPROCESSABLE_ENTITY", 423: "LOCKED", 424: "FAILED_DEPENDENCY",
              425: "TOO_EARLY", 426: "UPGRADE_REQUIRED", 428: "PRECONDITION_REQUIRED",
              429: "TOO_MANY_REQUESTS", 431: "REQUEST_HEADER_FIELDS_TOO_LARGE",
              451: "UNAVAILABLE_FOR_LEGAL_REASONS", 500: "INTERNAL_SERVER_ERROR",
              501: "NOT_IMPLEMENTED", 502: "BAD_GATEWAY", 503: "SERVICE_UNAVAILABLE",
              504: "GATEWAY_TIMEOUT", 505: "HTTP_VERSION_NOT_SUPPORTED",
              506: "VARIANT_ALSO_NEGOTIATES", 507: "INSUFFICIENT_STORAGE", 508: "LOOP_DETECTED",
              510: "NOT_EXTENDED", 511: "NETWORK_AUTHENTICATION_REQUIRED",
          }
          pattern = re.compile(r"(\bstatus_code\s*(?:==|!=|<=|>=|=|<|>)\s*)(\d{3})\b")

          def add_import(source: str) -> str:
              if "from http import HTTPStatus" in source:
                  return source
              tree = ast.parse(source)
              insert_after = 0
              index = 0
              body = list(tree.body)
              if body and isinstance(body[0], ast.Expr):
                  value = body[0].value
                  if isinstance(value, ast.Constant) and isinstance(value.value, str):
                      insert_after = body[0].end_lineno or body[0].lineno
                      index = 1
              while index < len(body):
                  node = body[index]
                  if isinstance(node, ast.ImportFrom) and node.module == "__future__":
                      insert_after = node.end_lineno or node.lineno
                      index += 1
                  else:
                      break
              lines = source.splitlines(keepends=True)
              lines.insert(insert_after, "from http import HTTPStatus\n")
              return "".join(lines)

          changed: list[str] = []
          skipped: list[str] = []
          for path in sorted(root.rglob("*.py")):
              source = path.read_text(encoding="utf-8")
              touched = [False]

              def replace(match: re.Match[str]) -> str:
                  code = int(match.group(2))
                  name = names.get(code)
                  if name is None:
                      skipped.append(f"{path}:{code}")
                      return match.group(0)
                  touched[0] = True
                  return f"{match.group(1)}HTTPStatus.{name}"

              updated = pattern.sub(replace, source)
              if touched[0]:
                  updated = add_import(updated)
              if updated != source:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          print("updated HTTP status semantics:")
          print("\n".join(changed) if changed else "none")
          print("unmapped explicit status literals:")
          print("\n".join(skipped) if skipped else "none")
          if not changed:
              raise SystemExit("no explicit numeric status_code literals found")
          PY
      - name: Commit semantic-only cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-web/src/rakit_web
          git commit -m "refactor(web): name HTTP status semantics"
          git push origin HEAD:phase-b2-alpha-hardening

name: Wire Accessibility Helper

on:
  push:
    branches:
      - feat/accessibility-foundation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/accessibility-foundation
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/rakit-web/src/rakit_web/form_routes.py')
          text = path.read_text()
          text = text.replace('import re\n', '', 1)
          anchor = 'from ._paths import mounted_path\n'
          assert anchor in text
          text = text.replace(anchor, 'from ._paths import mounted_path\nfrom .accessibility import safe_dom_token\n', 1)
          old = '''def _field_dom_id(binding: WriteResourceBinding, field_id: str) -> str:
    safe_resource = re.sub(r"[^a-zA-Z0-9_-]", "-", binding._route_resource_id)
    safe_field = re.sub(r"[^a-zA-Z0-9_-]", "-", field_id)
    return f"rakit-{safe_resource}-{safe_field}"
'''
          new = '''def _field_dom_id(binding: WriteResourceBinding, field_id: str) -> str:
    return (
        f"rakit-{safe_dom_token(binding._route_resource_id)}-"
        f"{safe_dom_token(field_id)}"
    )
'''
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY
          uv run ruff format packages/rakit-web/src/rakit_web/form_routes.py packages/rakit-web/src/rakit_web/accessibility.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-web/src/rakit_web/form_routes.py packages/rakit-web/src/rakit_web/accessibility.py
          git rm .github/workflows/use-accessibility-helper.yml
          git commit -m "refactor(web): centralize safe accessibility ids"
          git push origin HEAD:feat/accessibility-foundation

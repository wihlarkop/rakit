name: UI-07D final focused verification

on:
  push:
    branches: [ui-07d-advanced-widget-foundation]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ui-07d-advanced-widget-foundation
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.5
      - name: Run focused verification and capture evidence
        shell: bash
        run: |
          set +e
          uv sync --all-packages --dev --locked > /tmp/sync.log 2>&1
          sync_exit=$?
          if [ "$sync_exit" -eq 0 ]; then
            uv run pytest -q \
              packages/rakit-web/tests/test_field_presentation.py \
              packages/rakit-web/tests/test_advanced_widget_contracts.py \
              packages/rakit-web/tests/test_relationship_autocomplete.py > /tmp/tests.log 2>&1
            tests_exit=$?
            uv run ruff format --check . > /tmp/format.log 2>&1
            format_exit=$?
            uv run ruff check . > /tmp/lint.log 2>&1
            lint_exit=$?
            uv run ty check > /tmp/ty.log 2>&1
            ty_exit=$?
          else
            tests_exit=99; format_exit=99; lint_exit=99; ty_exit=99
            echo 'skipped because uv sync failed' > /tmp/tests.log
            cp /tmp/tests.log /tmp/format.log
            cp /tmp/tests.log /tmp/lint.log
            cp /tmp/tests.log /tmp/ty.log
          fi
          node --check packages/rakit-web/src/rakit_web/static/rakit-widgets.js > /tmp/js.log 2>&1
          js_exit=$?
          bun install --frozen-lockfile > /tmp/bun.log 2>&1
          bun_exit=$?
          if [ "$bun_exit" -eq 0 ]; then
            bun run css:build >> /tmp/bun.log 2>&1
            css_exit=$?
            git diff --exit-code -- packages/rakit-web/src/rakit_web/static/rakit.css >> /tmp/bun.log 2>&1
            css_diff_exit=$?
          else
            css_exit=99; css_diff_exit=99
          fi
          {
            echo "sync=$sync_exit"
            echo "tests=$tests_exit"
            echo "format=$format_exit"
            echo "lint=$lint_exit"
            echo "ty=$ty_exit"
            echo "js=$js_exit"
            echo "bun=$bun_exit"
            echo "css=$css_exit"
            echo "css_diff=$css_diff_exit"
            for name in tests format lint ty js bun; do
              echo
              echo "===== $name ====="
              tail -n 120 "/tmp/$name.log"
            done
          } > .github/ui07d-final-focused-result.txt
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/ui07d-final-focused-result.txt
          git commit -m 'ci: record final UI-07D focused verification'
          git push origin HEAD:ui-07d-advanced-widget-foundation

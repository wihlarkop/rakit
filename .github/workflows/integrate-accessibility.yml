name: Integrate accessibility after storage

on:
  push:
    branches:
      - integrate/accessibility-after-storage

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: bash .github/scripts/integrate-accessibility.sh

name: C3 regression maintenance

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Sync workspace
        run: uv sync --all-packages --dev --locked
      - name: Update C3-aligned regression contracts
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          def replace_one(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected patch source not found in {path}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_one(
              "scripts/check_artifacts.py",
              "installs ``rakit[standard]`` from those local wheels into a clean virtual environment,",
              "installs ``rakit[standard,uvicorn]`` from those local wheels into a clean virtual environment,",
          )
          replace_one(
              "scripts/check_artifacts.py",
              '_install_extra(dist, python, workspace, "standard")',
              '_install_extra(dist, python, workspace, "standard,uvicorn")',
          )
          replace_one(
              "scripts/check_artifacts.py",
              '''    standard = tuple(optional.get("standard", ()))
    required = {
        f"rakit-sqlalchemy=={VERSION}",
        f"rakit-auth-sqlalchemy=={VERSION}",
        f"rakit-storage-local=={VERSION}",
        f"rakit-server-uvicorn=={VERSION}",
    }
    missing = required - set(standard)
    if missing:
        raise RuntimeError(f"rakit[standard] missing official capabilities: {sorted(missing)}")''',
              '''    standard = tuple(optional.get("standard", ()))
    expected = (
        f"rakit-sqlalchemy=={VERSION}",
        f"rakit-auth-sqlalchemy=={VERSION}",
        f"rakit-storage-local=={VERSION}",
    )
    if standard != expected:
        raise RuntimeError(
            "rakit[standard] must be server/driver neutral and contain exactly "
            f"{list(expected)!r}; found {list(standard)!r}"
        )''',
          )

          replace_one(
              "tests/release/test_installed_artifacts.py",
              "def test_standard_extra_contains_release_reference_stack(",
              "def test_standard_extra_is_server_neutral_reference_stack(",
          )
          replace_one(
              "tests/release/test_installed_artifacts.py",
              "def test_clean_install_resolves_cli_after_standard_install(",
              "def test_clean_install_resolves_cli_after_standard_uvicorn_install(",
          )
          replace_one(
              "tests/release/test_installed_artifacts.py",
              '''install_marker = '_install_extra(dist, python, workspace, "standard")' ''',
              '''install_marker = '_install_extra(dist, python, workspace, "standard,uvicorn")' ''',
          )

          replace_one(
              "packages/rakit/tests/test_facade.py",
              '''from rakit import RakitConfig
from rakit._optional import RakitOptionalDependencyError, optional_import, require_module
''',
              '''from rakit import RakitConfig
from rakit._install import InstallExtra
from rakit._optional import (
    OptionalDependency,
    RakitOptionalDependencyError,
    optional_import,
    require_module,
)

_SQLALCHEMY_DEPENDENCY = OptionalDependency(InstallExtra.SQLALCHEMY, "SQLAlchemy")
_UVICORN_DEPENDENCY = OptionalDependency(InstallExtra.UVICORN, "Uvicorn")
''',
          )
          replace_one(
              "packages/rakit/tests/test_facade.py",
              'require_module("missing_rakit_dependency", extra="sqlalchemy")',
              'require_module("missing_rakit_dependency", dependency=_SQLALCHEMY_DEPENDENCY)',
          )
          replace_one(
              "packages/rakit/tests/test_facade.py",
              '''    assert 'uv add "rakit[sqlalchemy]"' in str(caught.value)
''',
              '''    assert "SQLAlchemy support is not installed." in str(caught.value)
    assert 'uv add "rakit[sqlalchemy]"' in str(caught.value)
''',
          )
          replace_one(
              "packages/rakit/tests/test_facade.py",
              'require_module("rakit_test_fake_optional", extra="whatever")',
              'require_module("rakit_test_fake_optional", dependency=_SQLALCHEMY_DEPENDENCY)',
          )
          replace_one(
              "packages/rakit/tests/test_facade.py",
              'optional_import("missing_rakit_dependency", extra="server-uvicorn")',
              'optional_import("missing_rakit_dependency", dependency=_UVICORN_DEPENDENCY)',
          )
          replace_one(
              "packages/rakit/tests/test_facade.py",
              '''    assert 'uv add "rakit[server-uvicorn]"' in str(caught.value)
''',
              '''    assert "Uvicorn support is not installed." in str(caught.value)
    assert 'uv add "rakit[uvicorn]"' in str(caught.value)
''',
          )
          replace_one(
              "packages/rakit/tests/test_facade.py",
              'optional_import("rakit_test_fake_optional_ctx", extra="whatever")',
              'optional_import("rakit_test_fake_optional_ctx", dependency=_SQLALCHEMY_DEPENDENCY)',
          )
          replace_one(
              "packages/rakit/tests/test_facade.py",
              '''    assert 'uv add "rakit[uvicorn]"' in str(caught.value)


def test_auth_sqlalchemy_facade_reexports_real_class()''',
              '''    assert "Uvicorn support is not installed." in str(caught.value)
    assert 'uv add "rakit[uvicorn]"' in str(caught.value)


def test_auth_sqlalchemy_facade_reexports_real_class()''',
          )
          replace_one(
              "packages/rakit/tests/test_facade.py",
              '''    assert 'uv add "rakit[auth-sqlalchemy]"' in str(caught.value)


def test_importing_rakit_does_not_eagerly_import_auth_sqlalchemy()''',
              '''    assert "SQLAlchemy authentication support is not installed." in str(caught.value)
    assert 'uv add "rakit[auth-sqlalchemy]"' in str(caught.value)


def test_importing_rakit_does_not_eagerly_import_auth_sqlalchemy()''',
          )

          replace_one(
              "packages/rakit/tests/test_b2_facades.py",
              '''    assert 'uv add "rakit[granian]"' in str(caught.value)
''',
              '''    assert "Granian support is not installed." in str(caught.value)
    assert 'uv add "rakit[granian]"' in str(caught.value)
''',
          )
          replace_one(
              "packages/rakit/tests/test_b2_facades.py",
              '''    assert 'uv add "rakit[storage-local]"' in str(caught.value)
''',
              '''    assert "Local storage support is not installed." in str(caught.value)
    assert 'uv add "rakit[storage-local]"' in str(caught.value)
''',
          )

          replace_one(
              "packages/rakit/tests/test_init_planner.py",
              '''    assert '"rakit[standard]"' in pyproject
''',
              '''    assert '"rakit[standard,uvicorn]"' in pyproject
''',
          )
          replace_one(
              "packages/rakit/tests/test_init_planner.py",
              '''    assert '"rakit[sqlalchemy,auth-sqlalchemy,storage-local,granian]"' in pyproject
''',
              '''    assert '"rakit[standard,granian]"' in pyproject
''',
          )
          planner = Path("packages/rakit/tests/test_init_planner.py")
          planner.write_text(
              planner.read_text(encoding="utf-8")
              + '''


def test_existing_standard_install_command_uses_bundle_and_explicit_server(
    tmp_path: Path,
) -> None:
    for server, requirement in (
        (ServerAdapter.UVICORN, "rakit[standard,uvicorn]"),
        (ServerAdapter.GRANIAN, "rakit[standard,granian]"),
    ):
        module_root = tmp_path / server.value / "src" / "host_app" / "rakit_admin"
        config = InitConfig(
            mode=InitMode.EXISTING,
            target=tmp_path / server.value,
            distribution_name=None,
            import_package="host_app.rakit_admin",
            module_root=module_root,
            template=StarterTemplate.STANDARD,
            server=server,
            install_dependencies=True,
            dry_run=True,
            host_package="host_app",
            host_framework=None,
        )

        plan = build_scaffold_plan(config)

        assert plan.dependency_action is not None
        assert plan.dependency_action.argv == ("uv", "add", requirement, "aiosqlite")
''',
              encoding="utf-8",
          )
          PY
      - name: Apply canonical formatter
        run: |
          uv run ruff format \
            packages/rakit/src/rakit/scaffold/render.py \
            packages/rakit/tests/test_install_ux.py \
            packages/rakit/tests/test_facade.py \
            packages/rakit/tests/test_b2_facades.py \
            packages/rakit/tests/test_init_planner.py \
            tests/release/test_installed_artifacts.py \
            scripts/check_artifacts.py
      - name: Commit patched regression surface
        run: |
          if git diff --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            packages/rakit/src/rakit/scaffold/render.py \
            packages/rakit/tests/test_install_ux.py \
            packages/rakit/tests/test_facade.py \
            packages/rakit/tests/test_b2_facades.py \
            packages/rakit/tests/test_init_planner.py \
            tests/release/test_installed_artifacts.py \
            scripts/check_artifacts.py
          git commit -m "test: align regressions with C3 install contract"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: First Generated REST Format Typing

on:
  push:
    branches: [feat/first-generated-rest-read]

permissions:
  contents: write

jobs:
  format:
    if: "${{ github.event.head_commit.message == 'ci: format generated REST typing fixes' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/first-generated-rest-read
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --dev --locked
      - run: uv run ruff format packages/rakit-web/src/rakit_web/generated_rest.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-web/src/rakit_web/generated_rest.py
          git commit -m "style: format generated REST typing fixes"
          git push origin HEAD:feat/first-generated-rest-read

name: Schema Adapter Runtime Maintenance

on:
  push:
    branches: [feat/schema-adapter-runtime]

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[schema-runtime-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/schema-adapter-runtime
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked

      - name: Confirm schema-agnostic regression test starts red
        run: |
          set +e
          uv run pytest packages/rakit-web/tests/test_schema_adapter_runtime.py -q
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected schema-adapter runtime test to fail before implementation"
            exit 1
          fi
          echo "Baseline failure confirmed"

      - name: Wire page and endpoint runtimes through SchemaAdapter
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, marker: str) -> None:
              file = Path(path)
              text = file.read_text()
              if marker in text:
                  return
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {marker}")
              file.write_text(text.replace(old, new, 1))

          # Core schema metadata contract.
          schema = Path("packages/rakit-core/src/rakit_core/schema.py")
          text = schema.read_text()
          text = text.replace(
              "@dataclass(frozen=True, slots=True)\nclass SchemaValidationIssue:\n",
              "@dataclass(frozen=True, slots=True)\n"
              "class SchemaField:\n"
              "    name: str\n"
              "    title: str | None = None\n"
              "    description: str | None = None\n\n\n"
              "@dataclass(frozen=True, slots=True)\n"
              "class SchemaValidationIssue:\n",
              1,
          ) if "class SchemaField:" not in text else text
          text = text.replace(
              "    def field_names(self, schema: type[object]) -> tuple[str, ...]: ...\n",
              "    def fields(self, schema: type[object]) -> tuple[SchemaField, ...]: ...\n\n"
              "    def field_names(self, schema: type[object]) -> tuple[str, ...]: ...\n",
              1,
          ) if "    def fields(self, schema: type[object])" not in text else text
          text = text.replace(
              '    "SchemaAdapter",\n',
              '    "SchemaAdapter",\n    "SchemaField",\n',
              1,
          ) if '    "SchemaField",\n' not in text else text
          schema.write_text(text)

          # Public core declarations accept arbitrary schema classes.
          definitions = Path("packages/rakit-core/src/rakit_core/definitions.py")
          text = definitions.read_text()
          text = text.replace("    input_schema: type[BaseModel] | None = None\n", "    input_schema: type[object] | None = None\n")
          text = text.replace("    output_schema: type[BaseModel] | None = None\n", "    output_schema: type[object] | None = None\n")
          definitions.write_text(text)

          endpoints = Path("packages/rakit-core/src/rakit_core/endpoints.py")
          text = endpoints.read_text()
          text = text.replace("\nfrom pydantic import BaseModel\n", "\n")
          text = text.replace("    input_schema: type[BaseModel] | None = None\n", "    input_schema: type[object] | None = None\n")
          text = text.replace("    output_schema: type[BaseModel] | None = None\n", "    output_schema: type[object] | None = None\n")
          text = text.replace("    values: BaseModel | None = None\n", "    values: object | None = None\n")
          endpoints.write_text(text)

          pages = Path("packages/rakit-core/src/rakit_core/pages.py")
          text = pages.read_text()
          text = text.replace("\nfrom pydantic import BaseModel\n", "\n")
          text = text.replace("    values: BaseModel | None = None\n", "    values: object | None = None\n")
          pages.write_text(text)

          # Pydantic remains the default adapter, but now supplies neutral field metadata.
          web_schema = Path("packages/rakit-web/src/rakit_web/schema.py")
          text = web_schema.read_text()
          text = text.replace(
              "from rakit_core.schema import SchemaValidationError, SchemaValidationIssue\n",
              "from rakit_core.schema import SchemaField, SchemaValidationError, SchemaValidationIssue\n",
          )
          old = (
              "    def field_names(self, schema: type[object]) -> tuple[str, ...]:\n"
              "        model = self._model_type(schema)\n"
              "        return tuple(model.model_fields)\n"
          )
          new = (
              "    def fields(self, schema: type[object]) -> tuple[SchemaField, ...]:\n"
              "        model = self._model_type(schema)\n"
              "        return tuple(\n"
              "            SchemaField(\n"
              "                name=name,\n"
              "                title=field.title,\n"
              "                description=field.description,\n"
              "            )\n"
              "            for name, field in model.model_fields.items()\n"
              "        )\n\n"
              "    def field_names(self, schema: type[object]) -> tuple[str, ...]:\n"
              "        return tuple(field.name for field in self.fields(schema))\n"
          )
          if "    def fields(self, schema: type[object])" not in text:
              if old not in text:
                  raise SystemExit("Pydantic field_names anchor not found")
              text = text.replace(old, new, 1)
          web_schema.write_text(text)

          # Admin chooses a schema adapter; Pydantic is only the default.
          admin = Path("packages/rakit-web/src/rakit_web/admin.py")
          text = admin.read_text()
          text = text.replace(
              "from .schema import PYDANTIC_SCHEMA_CAPABILITIES, PydanticSchemaAdapter\n",
              "from .schema import PydanticSchemaAdapter\n",
          )
          text = text.replace(
              "        advanced_action_response_adapter: AdvancedActionResponseAdapter | None = None,\n"
              "    ) -> None:\n",
              "        advanced_action_response_adapter: AdvancedActionResponseAdapter | None = None,\n"
              "        schema_adapter: SchemaAdapter | None = None,\n"
              "    ) -> None:\n",
              1,
          ) if "        schema_adapter: SchemaAdapter | None = None," not in text else text
          old = (
              "        self._builder = ApplicationBuilder(admin_id=admin_id)\n"
              "        self._builder.register_capability_provider(STARLETTE_WEB_CAPABILITIES)\n"
              "        self._builder.register_capability_provider(PYDANTIC_SCHEMA_CAPABILITIES)\n"
              "        schema_adapter: SchemaAdapter = PydanticSchemaAdapter()\n"
              "        self._builder.registry.add_value(\n"
              "            SchemaAdapter, schema_adapter, scope=ServiceScope.APPLICATION\n"
              "        )\n"
          )
          new = (
              "        self._builder = ApplicationBuilder(admin_id=admin_id)\n"
              "        self._builder.register_capability_provider(STARLETTE_WEB_CAPABILITIES)\n"
              "        self._schema_adapter = schema_adapter or PydanticSchemaAdapter()\n"
              "        self._builder.register_capability_provider(self._schema_adapter.provider)\n"
              "        self._builder.registry.add_value(\n"
              "            SchemaAdapter, self._schema_adapter, scope=ServiceScope.APPLICATION\n"
              "        )\n"
          )
          if "        self._schema_adapter = schema_adapter or PydanticSchemaAdapter()" not in text:
              if old not in text:
                  raise SystemExit("Admin schema adapter anchor not found")
              text = text.replace(old, new, 1)
          text = text.replace(
              "                    compiled=self.compiled,\n"
              "                    templates=templates,\n"
              "                    admin_id=self.config.admin_id,\n",
              "                    compiled=self.compiled,\n"
              "                    templates=templates,\n"
              "                    schema_adapter=self._schema_adapter,\n"
              "                    admin_id=self.config.admin_id,\n",
              1,
          ) if "                    schema_adapter=self._schema_adapter," not in text else text
          admin.write_text(text)

          # Public endpoint decorators no longer require BaseModel subclasses.
          endpoint_admin = Path("packages/rakit-web/src/rakit_web/endpoint_admin.py")
          text = endpoint_admin.read_text()
          text = text.replace("\nfrom pydantic import BaseModel\n", "\n")
          text = text.replace("input_schema: type[BaseModel] | None", "input_schema: type[object] | None")
          text = text.replace("output_schema: type[BaseModel] | None", "output_schema: type[object] | None")
          text = text.replace(
              "            routes=pairs,\n"
              "            admin_id=self.config.admin_id,\n",
              "            routes=pairs,\n"
              "            schema_adapter=self._schema_adapter,\n"
              "            admin_id=self.config.admin_id,\n",
              1,
          ) if "            schema_adapter=self._schema_adapter," not in text else text
          endpoint_admin.write_text(text)

          # Endpoint runtime delegates schema semantics to the selected adapter.
          endpoint_routes = Path("packages/rakit-web/src/rakit_web/endpoint_routes.py")
          text = endpoint_routes.read_text()
          text = text.replace("from pydantic import BaseModel, ValidationError\n", "")
          text = text.replace(
              "from rakit_core.permissions import PermissionRequirement\n",
              "from rakit_core.permissions import PermissionRequirement\n"
              "from rakit_core.schema import SchemaAdapter, SchemaValidationError\n",
          )
          text = text.replace(
              "    superuser_bypass: bool\n",
              "    superuser_bypass: bool\n    schema_adapter: SchemaAdapter\n",
              1,
          ) if "    schema_adapter: SchemaAdapter\n" not in text else text
          start = text.index("def _pydantic_issues(")
          end = text.index("\n\ndef _query_input", start)
          replacement = '''def _schema_issues(exc: SchemaValidationError) -> list[dict[str, object]]:\n    return [\n        {\n            "location": list(issue.location),\n            "code": issue.code,\n            "message": issue.message,\n        }\n        for issue in exc.issues\n    ]\n\n\ndef _unknown_issues(\n    schema_adapter: SchemaAdapter,\n    schema: type[object] | None,\n    submitted: Mapping[str, object],\n) -> list[dict[str, object]]:\n    known = set(schema_adapter.field_names(schema)) if schema is not None else set()\n    return [\n        _issue(name, "unknown_field", "Unknown endpoint input field")\n        for name in submitted\n        if name not in known\n    ]\n\n\ndef _validate_values(\n    schema_adapter: SchemaAdapter,\n    schema: type[object] | None,\n    submitted: Mapping[str, object],\n) -> tuple[object | None, list[dict[str, object]]]:\n    unknown = _unknown_issues(schema_adapter, schema, submitted)\n    if unknown:\n        return None, unknown\n    if schema is None:\n        return None, []\n    try:\n        return schema_adapter.validate_input(schema, submitted), []\n    except SchemaValidationError as exc:\n        return None, _schema_issues(exc)\n'''
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              "    def __init__(self, compiled: CompiledEndpointDefinition) -> None:\n"
              "        self.compiled = compiled\n",
              "    def __init__(\n"
              "        self, compiled: CompiledEndpointDefinition, schema_adapter: SchemaAdapter\n"
              "    ) -> None:\n"
              "        self.compiled = compiled\n"
              "        self.schema_adapter = schema_adapter\n",
              1,
          )
          old = '''            if endpoint.output_schema is not None:\n                try:\n                    payload = endpoint.output_schema.model_validate(payload).model_dump(mode="json")\n                except ValidationError as exc:\n                    raise RakitError(\n                        code=ErrorCode.VALIDATION_FAILED,\n                        message="Endpoint output validation failed.",\n                        status_code=500,\n                        details={"issues": _pydantic_issues(exc)},\n                    ) from exc\n'''
          new = '''            if endpoint.output_schema is not None:\n                try:\n                    payload = self.schema_adapter.serialize_output(endpoint.output_schema, payload)\n                except SchemaValidationError as exc:\n                    raise RakitError(\n                        code=ErrorCode.VALIDATION_FAILED,\n                        message="Endpoint output validation failed.",\n                        status_code=500,\n                        details={"issues": _schema_issues(exc)},\n                    ) from exc\n'''
          if old not in text:
              raise SystemExit("endpoint output validation anchor not found")
          text = text.replace(old, new, 1)
          old = '''def _endpoint_fingerprint(endpoint_id: str, values: BaseModel | None) -> str:\n    input_value: object = values.model_dump(mode="json") if values is not None else {}\n'''
          new = '''def _endpoint_fingerprint(\n    endpoint_id: str,\n    schema_adapter: SchemaAdapter,\n    schema: type[object] | None,\n    values: object | None,\n) -> str:\n    input_value: object = (\n        schema_adapter.serialize_output(schema, values)\n        if schema is not None and values is not None\n        else {}\n    )\n'''
          if old not in text:
              raise SystemExit("endpoint fingerprint anchor not found")
          text = text.replace(old, new, 1)
          text = text.replace(
              "            values, validation_issues = _validate_values(endpoint.input_schema, submitted)\n",
              "            values, validation_issues = _validate_values(\n"
              "                binding.schema_adapter, endpoint.input_schema, submitted\n"
              "            )\n",
              1,
          )
          text = text.replace(
              "            handler = _ValidatedEndpointHandler(compiled_endpoint)\n",
              "            handler = _ValidatedEndpointHandler(compiled_endpoint, binding.schema_adapter)\n",
              1,
          )
          text = text.replace(
              "                fingerprint = _endpoint_fingerprint(str(endpoint.endpoint_id), values)\n",
              "                fingerprint = _endpoint_fingerprint(\n"
              "                    str(endpoint.endpoint_id),\n"
              "                    binding.schema_adapter,\n"
              "                    endpoint.input_schema,\n"
              "                    values,\n"
              "                )\n",
              1,
          )
          endpoint_routes.write_text(text)

          # Page composition and runtime use the same selected schema adapter.
          page_admin = Path("packages/rakit-web/src/rakit_web/page_admin.py")
          text = page_admin.read_text()
          text = text.replace(
              "from rakit_core.permissions import PermissionRequirement\n",
              "from rakit_core.permissions import PermissionRequirement\n"
              "from rakit_core.schema import SchemaAdapter\n",
          )
          text = text.replace(
              "    templates: Jinja2Templates,\n"
              "    admin_id: str,\n",
              "    templates: Jinja2Templates,\n"
              "    schema_adapter: SchemaAdapter,\n"
              "    admin_id: str,\n",
              1,
          ) if "    schema_adapter: SchemaAdapter," not in text else text
          text = text.replace(
              "        routes=pairs,\n"
              "        templates=templates,\n",
              "        routes=pairs,\n"
              "        templates=templates,\n"
              "        schema_adapter=schema_adapter,\n",
              1,
          ) if "        schema_adapter=schema_adapter," not in text else text
          page_admin.write_text(text)

          page_routes = Path("packages/rakit-web/src/rakit_web/page_routes.py")
          text = page_routes.read_text()
          text = text.replace("from pydantic import BaseModel, ValidationError\n", "")
          text = text.replace(
              "from rakit_core.transactions import OperationUnitOfWorkFactory, TransactionPolicy\n",
              "from rakit_core.schema import SchemaAdapter, SchemaValidationError\n"
              "from rakit_core.transactions import OperationUnitOfWorkFactory, TransactionPolicy\n",
          )
          text = text.replace(
              "    templates: Jinja2Templates\n",
              "    templates: Jinja2Templates\n    schema_adapter: SchemaAdapter\n",
              1,
          ) if "    schema_adapter: SchemaAdapter\n" not in text else text
          start = text.index("def _field_views(")
          end = text.index("\n\ndef _template_args", start)
          replacement = '''def _field_views(\n    schema_adapter: SchemaAdapter,\n    schema: type[object] | None,\n    submitted: Mapping[str, object],\n    issues: Mapping[str, tuple[str, ...]],\n) -> tuple[dict[str, object], ...]:\n    if schema is None:\n        return ()\n    return tuple(\n        {\n            "id": f"rakit-page-{field.name}",\n            "name": field.name,\n            "label": field.title or field.name.replace("_", " ").title(),\n            "description": field.description,\n            "value": submitted.get(field.name, ""),\n            "issues": issues.get(field.name, ()),\n        }\n        for field in schema_adapter.fields(schema)\n    )\n\n\ndef _validation_issues(exc: SchemaValidationError) -> dict[str, tuple[str, ...]]:\n    issues: dict[str, tuple[str, ...]] = {}\n    for issue in exc.issues:\n        field = issue.location[0] if issue.location else "__root__"\n        issues[field] = (*issues.get(field, ()), issue.message)\n    return issues\n\n\ndef _unknown_input_issues(\n    schema_adapter: SchemaAdapter,\n    schema: type[object] | None,\n    submitted: Mapping[str, object],\n) -> dict[str, tuple[str, ...]]:\n    known = set(schema_adapter.field_names(schema)) if schema is not None else set()\n    return {name: ("Unknown page input field",) for name in submitted if name not in known}\n'''
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              '        "fields": _field_views(page.input_schema, safe_submitted, safe_issues),\n',
              '        "fields": _field_views(\n'
              '            binding.schema_adapter, page.input_schema, safe_submitted, safe_issues\n'
              '        ),\n',
              1,
          )
          old = '''def _model_values(\n    schema: type[BaseModel] | None, submitted: Mapping[str, object]\n) -> BaseModel | None:\n    if schema is None:\n        return None\n    return schema.model_validate(dict(submitted))\n'''
          new = '''def _model_values(\n    schema_adapter: SchemaAdapter,\n    schema: type[object] | None,\n    submitted: Mapping[str, object],\n) -> object | None:\n    if schema is None:\n        return None\n    return schema_adapter.validate_input(schema, submitted)\n'''
          if old not in text:
              raise SystemExit("page model values anchor not found")
          text = text.replace(old, new, 1)
          text = text.replace(
              "            unknown_issues = _unknown_input_issues(page.input_schema, submitted)\n",
              "            unknown_issues = _unknown_input_issues(\n"
              "                binding.schema_adapter, page.input_schema, submitted\n"
              "            )\n",
          )
          text = text.replace(
              "                values = _model_values(page.input_schema, submitted)\n"
              "            except ValidationError as exc:\n",
              "                values = _model_values(\n"
              "                    binding.schema_adapter, page.input_schema, submitted\n"
              "                )\n"
              "            except SchemaValidationError as exc:\n",
          )
          page_routes.write_text(text)
          PY

      - run: uv run ruff format .
      - run: uv run ruff check --fix .
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - name: Focused schema runtime tests
        run: >-
          uv run pytest
          packages/rakit-web/tests/test_schema_adapter.py
          packages/rakit-web/tests/test_schema_adapter_runtime.py
          packages/rakit-web/tests/test_endpoints.py
          -q
      - run: uv run pytest -q

      - name: Commit implementation and formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages
          git commit -m "refactor(web): route typed schemas through adapters [schema-runtime-ci]"
          git push origin HEAD:feat/schema-adapter-runtime

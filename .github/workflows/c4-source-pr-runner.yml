name: C4 source PR runner

on:
  pull_request:

permissions:
  contents: write

jobs:
  source-first:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-c4-capability-discovery
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync baseline tooling
        run: uv sync --all-packages --dev --locked
      - name: Apply source when not committed yet
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f packages/rakit-core/src/rakit_core/integrations.py ]]; then
            uv run python scripts/c4_apply_source.py
            uv lock
          fi
          uv sync --all-packages --dev --locked
      - name: Format and lint C4 source
        shell: bash
        run: |
          set -euo pipefail
          files=(
            packages/rakit-core/src/rakit_core/__init__.py
            packages/rakit-core/src/rakit_core/capabilities.py
            packages/rakit-core/src/rakit_core/integrations.py
            packages/rakit-core/src/rakit_core/compiler.py
            packages/rakit-web/src/rakit_web/capabilities.py
            packages/rakit-web/src/rakit_web/discovery.py
            packages/rakit-web/src/rakit_web/schema.py
            packages/rakit-web/src/rakit_web/admin.py
            packages/rakit-sqlalchemy/src/rakit_sqlalchemy/discovery.py
            packages/rakit-sqlalchemy/src/rakit_sqlalchemy/plugin.py
            packages/rakit-auth-sqlalchemy/src/rakit_auth_sqlalchemy/discovery.py
            packages/rakit-auth-sqlalchemy/src/rakit_auth_sqlalchemy/backend.py
            packages/rakit-auth-sqlalchemy/src/rakit_auth_sqlalchemy/sessions.py
            packages/rakit-storage-local/src/rakit_storage_local/discovery.py
            packages/rakit-storage-local/src/rakit_storage_local/plugin.py
            packages/rakit-storage-local/src/rakit_storage_local/__init__.py
            packages/rakit-server-uvicorn/src/rakit_server_uvicorn/capabilities.py
            packages/rakit-server-uvicorn/src/rakit_server_uvicorn/discovery.py
            packages/rakit-server-uvicorn/src/rakit_server_uvicorn/server.py
            packages/rakit-server-uvicorn/src/rakit_server_uvicorn/__init__.py
            packages/rakit-server-granian/src/rakit_server_granian/capabilities.py
            packages/rakit-server-granian/src/rakit_server_granian/discovery.py
            packages/rakit-server-granian/src/rakit_server_granian/server.py
            packages/rakit-server-granian/src/rakit_server_granian/__init__.py
            packages/rakit/src/rakit/_integration_discovery.py
            packages/rakit/src/rakit/_capability_inspection.py
            packages/rakit/src/rakit/cli.py
          )
          uv run ruff format "${files[@]}"
          uv run ruff check "${files[@]}"
      - name: Plain Python capability smoke
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from tempfile import TemporaryDirectory

          from rakit._integration_discovery import (
              InstalledIntegrationDiscoveryError,
              discover_installed_integrations,
          )
          from rakit_auth_sqlalchemy.plugin import SQLAlchemyAuthPlugin
          from rakit_core.capabilities import CapabilityRequirement, analyze_capabilities
          from rakit_core.compiler import (
              ApplicationBuilder,
              CapabilityConfigurationError,
              compile_application,
          )
          from rakit_core.integrations import ConfiguredIntegration
          from rakit_sqlalchemy import SQLAlchemyPlugin
          from rakit_storage_local import LocalStorage, LocalStoragePlugin
          from rakit_web.admin import Admin
          from sqlalchemy.ext.asyncio import async_sessionmaker, create_async_engine

          analysis = analyze_capabilities(
              (
                  CapabilityRequirement.of("example.missing-b", "missing.b"),
                  CapabilityRequirement.of("example.missing-a", "missing.a"),
              ),
              (),
          )
          assert not analysis.valid
          assert tuple(item.requirement_id for item in analysis.missing_requirements) == (
              "example.missing-a",
              "example.missing-b",
          )

          builder = ApplicationBuilder()
          builder.register_configured_integration(
              ConfiguredIntegration("example.integration", "example", "Example")
          )
          builder.require_capabilities(CapabilityRequirement.of("missing.b", "cap.b"))
          builder.require_capabilities(CapabilityRequirement.of("missing.a", "cap.a"))
          try:
              compile_application(builder)
          except CapabilityConfigurationError as exc:
              assert exc.details["missing_requirements"] == ["missing.a", "missing.b"]
              assert exc.configured_integrations[0].integration_id == "example.integration"
          else:
              raise AssertionError("Expected aggregate capability failure")

          admin = Admin(title="C4 smoke", debug=True)
          assert {item.integration_id for item in admin.builder.configured_integrations} == {
              "web.starlette",
              "schema.pydantic",
          }
          compiled = admin.compile()
          assert compiled.capability_analysis is not None
          assert compiled.capability_analysis.valid

          engine = create_async_engine("sqlite+aiosqlite:///:memory:")
          sessions = async_sessionmaker(engine, expire_on_commit=False)
          auth = SQLAlchemyAuthPlugin(sessions)
          auth_admin = Admin(
              title="C4 auth smoke",
              debug=True,
              auth_backend=auth.auth_backend,
              session_store=auth.session_store,
          )
          assert "auth.sqlalchemy" in {
              item.integration_id for item in auth_admin.builder.configured_integrations
          }

          persistence_admin = Admin(title="C4 persistence smoke", debug=True)
          persistence_admin.install(SQLAlchemyPlugin(session_factory=sessions))
          assert "persistence.sqlalchemy" in {
              item.integration_id for item in persistence_admin.builder.configured_integrations
          }

          with TemporaryDirectory() as root:
              storage_admin = Admin(title="C4 storage smoke", debug=True)
              storage_admin.install(
                  LocalStoragePlugin(
                      storages=(LocalStorage(storage_id="default", root=root),)
                  )
              )
              assert "storage.local" in {
                  item.integration_id for item in storage_admin.builder.configured_integrations
              }

          installed = discover_installed_integrations()
          assert {item.integration_id for item in installed} == {
              "web.starlette",
              "schema.pydantic",
              "persistence.sqlalchemy",
              "auth.sqlalchemy",
              "storage.local",
              "server.uvicorn",
              "server.granian",
          }
          PY
          uv run python -c 'import sys; import rakit_server_uvicorn.discovery; assert "uvicorn" not in sys.modules'
          uv run python -c 'import sys; import rakit_server_granian.discovery; assert "granian" not in sys.modules'
      - name: Strict installed discovery smoke
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from importlib.metadata import EntryPoint
          from rakit._integration_discovery import (
              InstalledIntegrationDiscoveryError,
              discover_installed_integrations,
          )

          wrong_type = EntryPoint(
              name="bad.type",
              value="builtins:object",
              group="rakit.integrations",
          )
          try:
              discover_installed_integrations(candidates=(wrong_type,))
          except InstalledIntegrationDiscoveryError:
              pass
          else:
              raise AssertionError("wrong descriptor type must fail")

          mismatch = EntryPoint(
              name="wrong.name",
              value="rakit_web.discovery:STARLETTE_INTEGRATION",
              group="rakit.integrations",
          )
          try:
              discover_installed_integrations(candidates=(mismatch,))
          except InstalledIntegrationDiscoveryError:
              pass
          else:
              raise AssertionError("entry-point name mismatch must fail")

          duplicate = EntryPoint(
              name="web.starlette",
              value="rakit_web.discovery:STARLETTE_INTEGRATION",
              group="rakit.integrations",
          )
          try:
              discover_installed_integrations(candidates=(duplicate, duplicate))
          except InstalledIntegrationDiscoveryError:
              pass
          else:
              raise AssertionError("duplicate integration id must fail")
          PY
      - name: Real CLI source smoke
        shell: bash
        run: |
          set -euo pipefail
          cat > c4_smoke_target.py <<'PY'
          from rakit_web.admin import Admin
          from rakit_core.capabilities import CapabilityRequirement
          from rakit_core.compiler import ApplicationBuilder, compile_application

          valid = Admin(title="C4 CLI smoke", debug=True)

          class InvalidTarget:
              def compile(self):
                  builder = ApplicationBuilder()
                  builder.require_capabilities(
                      CapabilityRequirement.of("smoke.missing-b", "smoke.cap-b")
                  )
                  builder.require_capabilities(
                      CapabilityRequirement.of("smoke.missing-a", "smoke.cap-a")
                  )
                  return compile_application(builder)

          invalid = InvalidTarget()
          PY
          uv run rakit capabilities c4_smoke_target:valid > /tmp/c4-valid.txt
          uv run rakit capabilities c4_smoke_target:valid --json > /tmp/c4-valid.json
          uv run rakit capabilities --installed --json > /tmp/c4-installed.json
          uv run rakit capabilities c4_smoke_target:valid --installed --json > /tmp/c4-combined.json
          uv run rakit capabilities c4_smoke_target:invalid > /tmp/c4-invalid.txt
          uv run rakit capabilities c4_smoke_target:invalid --json > /tmp/c4-invalid.json
          if uv run rakit check c4_smoke_target:invalid > /tmp/c4-check-invalid.txt 2>&1; then
            echo "rakit check unexpectedly succeeded" >&2
            exit 1
          fi
          uv run python - <<'PY'
          import json
          from pathlib import Path

          valid = json.loads(Path("/tmp/c4-valid.json").read_text())
          invalid = json.loads(Path("/tmp/c4-invalid.json").read_text())
          installed = json.loads(Path("/tmp/c4-installed.json").read_text())
          combined = json.loads(Path("/tmp/c4-combined.json").read_text())
          assert valid["schema_version"] == 1 and valid["valid"] is True
          assert invalid["schema_version"] == 1 and invalid["valid"] is False
          assert [
              item["id"]
              for item in invalid["configured"]["requirements"]
              if item["status"] == "missing"
          ] == ["smoke.missing-a", "smoke.missing-b"]
          assert installed["target"] is None
          assert installed["valid"] is None
          assert installed["configured"] is None
          assert len(installed["installed"]) == 7
          assert combined["configured"] is not None
          assert len(combined["installed"]) == 7
          check_output = Path("/tmp/c4-check-invalid.txt").read_text()
          assert "smoke.missing-a" in check_output
          assert "smoke.missing-b" in check_output
          assert "Status: invalid" in Path("/tmp/c4-invalid.txt").read_text()
          PY
          rm -f c4_smoke_target.py
          rm -rf __pycache__
      - name: Static source verification
        run: uv run ty check
      - name: Commit verified source if newly applied
        shell: bash
        run: |
          set -euo pipefail
          git add \
            packages/rakit-core/src \
            packages/rakit-web/src packages/rakit-web/pyproject.toml \
            packages/rakit-sqlalchemy/src packages/rakit-sqlalchemy/pyproject.toml \
            packages/rakit-auth-sqlalchemy/src packages/rakit-auth-sqlalchemy/pyproject.toml \
            packages/rakit-storage-local/src packages/rakit-storage-local/pyproject.toml \
            packages/rakit-server-uvicorn/src packages/rakit-server-uvicorn/pyproject.toml \
            packages/rakit-server-granian/src packages/rakit-server-granian/pyproject.toml \
            packages/rakit/src/rakit/_integration_discovery.py \
            packages/rakit/src/rakit/_capability_inspection.py \
            packages/rakit/src/rakit/cli.py \
            uv.lock
          if git diff --cached --quiet; then
            echo "Committed source already matches smoke-tested source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: implement C4 capability discovery source"
          git push origin HEAD:phase-c4-capability-discovery

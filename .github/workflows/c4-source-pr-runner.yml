name: C4 source PR runner

on:
  pull_request:

permissions:
  contents: write

jobs:
  run-source-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-c4-capability-discovery
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync tooling needed to execute harness
        run: uv sync --all-packages --dev --locked
      - name: Execute source-first harness steps
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from pathlib import Path
          import subprocess

          text = Path('.github/workflows/c4-source-implementation.yml').read_text()
          wanted = (
              'Apply C4 source changes',
              'Plain Python source smoke',
              'Real CLI source smoke',
              'Static source verification',
              'Commit verified source',
          )

          def extract_run(name: str) -> str:
              marker = f'      - name: {name}\n'
              start = text.index(marker) + len(marker)
              run_marker = '        run: |\n'
              start = text.index(run_marker, start) + len(run_marker)
              next_step = text.find('\n      - name:', start)
              if next_step == -1:
                  next_step = len(text)
              raw = text[start:next_step]
              normalized: list[str] = []
              in_source_literal = False
              for line in raw.splitlines():
                  if in_source_literal:
                      normalized.append(line)
                  else:
                      normalized.append(
                          line[10:] if line.startswith('          ') else line
                      )
                  if line.count("'''") % 2 == 1:
                      in_source_literal = not in_source_literal
              if in_source_literal:
                  raise RuntimeError(f'Unclosed source literal while extracting {name}')
              script = '\n'.join(normalized) + '\n'
              if name == 'Apply C4 source changes':
                  script = script.replace(
                      r'    return "\\n".join(lines)',
                      r'    return "\\\\n".join(lines)',
                  )
              return script

          for name in wanted:
              print(f'::group::{name}', flush=True)
              subprocess.run(
                  ['bash', '-euo', 'pipefail', '-c', extract_run(name)],
                  check=True,
              )
              print('::endgroup::', flush=True)
          PY

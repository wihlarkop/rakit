name: C4 source PR runner

on:
  pull_request:

permissions:
  contents: write

jobs:
  run-source-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-c4-capability-discovery
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync tooling needed to read harness
        run: uv sync --all-packages --dev --locked
      - name: Execute source-first harness steps
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = yaml.safe_load(
              Path('.github/workflows/c4-source-implementation.yml').read_text()
          )
          steps = workflow['jobs']['implement-and-smoke']['steps']
          wanted = {
              'Apply C4 source changes',
              'Plain Python source smoke',
              'Real CLI source smoke',
              'Static source verification',
              'Commit verified source',
          }
          for step in steps:
              name = step.get('name')
              if name not in wanted:
                  continue
              print(f'::group::{name}', flush=True)
              subprocess.run(
                  ['bash', '-euo', 'pipefail', '-c', step['run']],
                  check=True,
              )
              print('::endgroup::', flush=True)
          PY

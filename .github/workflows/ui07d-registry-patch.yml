name: UI-07D registry integration

on:
  push:
    branches: [ui-07d-advanced-widget-foundation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ui-07d-advanced-widget-foundation
      - name: Apply registry patch
        run: python .github/ui07d_registry_patch.py
      - name: Validate Python syntax
        run: python -m compileall -q packages/rakit-web/src packages/rakit/src
      - name: Commit registry integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/rakit-web docs/guides/presentations.md
          if git diff --cached --quiet; then
            echo 'No registry changes to commit'
          else
            git commit -m 'feat(web): integrate admin presentation registry'
            git push origin HEAD:ui-07d-advanced-widget-foundation
          fi

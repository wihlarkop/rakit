name: Format diagnostic

on:
  pull_request:

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - name: Show Ruff formatting diff
        run: |
          uv run ruff format examples/dashboard/main.py
          git diff -- examples/dashboard/main.py
          exit 1

name: Task7 Format Debug

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --dev --locked
      - run: uv run ruff format packages/rakit-core/src/rakit_core/endpoints.py packages/rakit-web/src/rakit_web/endpoint_admin.py packages/rakit-web/src/rakit_web/endpoint_routes.py
      - name: Commit formatter output when needed
        shell: bash
        run: |
          if git diff --quiet -- packages/rakit-core/src/rakit_core/endpoints.py packages/rakit-web/src/rakit_web/endpoint_admin.py packages/rakit-web/src/rakit_web/endpoint_routes.py; then
            echo "No formatter changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-core/src/rakit_core/endpoints.py packages/rakit-web/src/rakit_web/endpoint_admin.py packages/rakit-web/src/rakit_web/endpoint_routes.py
          git commit -m "style: format task7 endpoint runtime"
          git push origin HEAD:${{ github.head_ref }}

name: UI foundation format diagnostic

on:
  push:
    branches:
      - ui-03-design-foundation-theme-icons

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --dev --locked
      - run: uv run ruff format packages/rakit-web/tests/test_ui_foundation.py
      - name: Commit formatted test
        run: |
          git add packages/rakit-web/tests/test_ui_foundation.py
          if git diff --cached --quiet; then
            echo 'Test already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(tests): apply Ruff formatting'
          git push origin HEAD:ui-03-design-foundation-theme-icons

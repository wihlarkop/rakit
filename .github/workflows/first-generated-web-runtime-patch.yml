name: First Generated REST Web Runtime Patch

on:
  push:
    branches: [feat/first-generated-rest-read]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'ci: apply generated REST web runtime patch' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/first-generated-rest-read
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --dev --locked
      - name: Patch generated REST auth and Admin wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          # API-specific auth response + exact generated route requirements.
          path = Path('packages/rakit-web/src/rakit_web/security/authentication.py')
          text = path.read_text()
          text = text.replace(
              'from starlette.responses import PlainTextResponse, RedirectResponse\n',
              'from starlette.responses import JSONResponse, PlainTextResponse, RedirectResponse\n',
              1,
          )
          marker = '\n\nclass AuthorizationMiddleware:\n'
          helper = '''\n\ndef _is_generated_api_path(path: str) -> bool:\n    return path == "/api" or path.startswith("/api/")\n\n\ndef _api_auth_response(request: Request, *, status_code: int, code: str, message: str) -> JSONResponse:\n    request_id = request.scope.get("state", {}).get("request_id", "")\n    return JSONResponse(\n        {\n            "error": {"code": code, "message": message},\n            "request_id": request_id if isinstance(request_id, str) else "",\n        },\n        status_code=status_code,\n        headers={"Cache-Control": "no-store"},\n    )\n'''
          assert marker in text
          text = text.replace(marker, helper + marker, 1)

          old = '''        request = Request(scope, receive=receive)\n        requirement = self._requirement_for(admin_relative_path(request), request.method)\n        if requirement is None:\n'''
          new = '''        request = Request(scope, receive=receive)\n        relative_path = admin_relative_path(request)\n        requirement = self._requirement_for(relative_path, request.method)\n        api_request = _is_generated_api_path(relative_path)\n        if requirement is None:\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        if not principal.authenticated:\n            # An unauthenticated *browser* request is redirected to login\n            # rather than 403'd, so a user landing on any admin URL gets a\n            # usable login page. The target is always this admin's own\n            # mounted login path -- never an attacker-supplied value -- so\n            # it can't be turned into an open redirect.\n            await RedirectResponse(\n                url=mounted_path(request, LOGIN_PATH),\n                status_code=303,\n                headers={"Cache-Control": "no-store"},\n            )(scope, receive, send)\n            return\n\n        if not requirement.matches(principal, superuser_bypass=self._superuser_bypass):\n            await PlainTextResponse(\n                "Forbidden", status_code=403, headers={"Cache-Control": "no-store"}\n            )(scope, receive, send)\n            return\n'''
          new = '''        if not principal.authenticated:\n            if api_request:\n                await _api_auth_response(\n                    request,\n                    status_code=401,\n                    code="auth.unauthenticated",\n                    message="Authentication is required.",\n                )(scope, receive, send)\n                return\n            # Browser requests retain the existing login redirect behavior.\n            await RedirectResponse(\n                url=mounted_path(request, LOGIN_PATH),\n                status_code=303,\n                headers={"Cache-Control": "no-store"},\n            )(scope, receive, send)\n            return\n\n        if not requirement.matches(principal, superuser_bypass=self._superuser_bypass):\n            if api_request:\n                await _api_auth_response(\n                    request,\n                    status_code=403,\n                    code="auth.forbidden",\n                    message="Permission denied.",\n                )(scope, receive, send)\n                return\n            await PlainTextResponse(\n                "Forbidden", status_code=403, headers={"Cache-Control": "no-store"}\n            )(scope, receive, send)\n            return\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    writable_resources: frozenset[str] = frozenset(),\n    action_requirements: Mapping[str, PermissionRequirement] | None = None,\n) -> Callable[..., PermissionRequirement | None]:\n'''
          new = '''    writable_resources: frozenset[str] = frozenset(),\n    action_requirements: Mapping[str, PermissionRequirement] | None = None,\n    generated_api_requirements: Mapping[\n        tuple[str, str], PermissionRequirement\n    ] | None = None,\n) -> Callable[..., PermissionRequirement | None]:\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    action_patterns = [\n        (pattern.strip("/").split("/"), requirement)\n        for pattern, requirement in (action_requirements or {}).items()\n    ]\n    action_patterns.sort(key=lambda item: len(item[0]), reverse=True)\n'''
          new = '''    action_patterns = [\n        (pattern.strip("/").split("/"), requirement)\n        for pattern, requirement in (action_requirements or {}).items()\n    ]\n    action_patterns.sort(key=lambda item: len(item[0]), reverse=True)\n    generated_api_patterns = [\n        (method, pattern.strip("/").split("/"), requirement)\n        for (method, pattern), requirement in (generated_api_requirements or {}).items()\n    ]\n    generated_api_patterns.sort(key=lambda item: len(item[1]), reverse=True)\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        segments = path.strip("/").split("/")\n        for pattern_segments, requirement in action_patterns:\n'''
          new = '''        segments = path.strip("/").split("/")\n        for expected_method, pattern_segments, requirement in generated_api_patterns:\n            if expected_method == method and len(pattern_segments) == len(segments) and all(\n                pattern_segment == segment or pattern_segment == "{identity}"\n                for pattern_segment, segment in zip(pattern_segments, segments, strict=True)\n            ):\n                return requirement\n        for pattern_segments, requirement in action_patterns:\n'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          # Materialize generated read routes and feed their permissions to middleware.
          path = Path('packages/rakit-web/src/rakit_web/admin.py')
          text = path.read_text()
          old = 'from .form_routes import WriteResourceBinding, build_write_routes\n'
          new = '''from .form_routes import WriteResourceBinding, build_write_routes\nfrom .generated_rest_runtime import (\n    GeneratedRestBinding,\n    build_generated_rest_routes,\n    generated_rest_requirement_map,\n)\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        write_routes: list[Route] = []\n        action_routes: list[Route] = []\n        page_routes: list[Route] = []\n'''
          new = '''        generated_rest_routes: list[Route] = []\n        api_by_resource = {api.resource_id: api for api in self.compiled.compiled_resource_apis}\n        for resource_id, api in api_by_resource.items():\n            generated_rest_routes.extend(\n                build_generated_rest_routes(\n                    GeneratedRestBinding(\n                        api=api,\n                        definition=self._resource_definitions[resource_id],\n                        service=self._resource_services[resource_id],\n                        schema_adapter=self._schema_adapter,\n                        admin_id=self.config.admin_id,\n                        auth_enabled=(\n                            self._auth_backend is not None and self._session_store is not None\n                        ),\n                        superuser_bypass=self._superuser_bypass,\n                    )\n                )\n            )\n\n        write_routes: list[Route] = []\n        action_routes: list[Route] = []\n        page_routes: list[Route] = []\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''            action_requirements=exact_requirements,\n        )\n'''
          new = '''            action_requirements=exact_requirements,\n            generated_api_requirements=generated_rest_requirement_map(\n                self.compiled.compiled_resource_apis,\n                admin_id=self.config.admin_id,\n            ),\n        )\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        for route in resource_routes:\n            app.routes.append(route)\n        for route in page_routes:\n'''
          new = '''        for route in resource_routes:\n            app.routes.append(route)\n        for route in generated_rest_routes:\n            app.routes.append(route)\n        for route in page_routes:\n'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          uv run ruff format \
            packages/rakit-web/src/rakit_web/security/authentication.py \
            packages/rakit-web/src/rakit_web/admin.py
          uv run ruff check \
            packages/rakit-web/src/rakit_web/security/authentication.py \
            packages/rakit-web/src/rakit_web/admin.py
      - name: Commit runtime wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-web/src/rakit_web/security/authentication.py packages/rakit-web/src/rakit_web/admin.py
          git commit -m "feat(web): wire generated REST read routes"
          git push origin HEAD:feat/first-generated-rest-read

name: First Generated REST Review Contracts

on:
  push:
    branches: [feat/first-generated-rest-mutations]

permissions:
  contents: write

jobs:
  tests:
    if: "${{ github.event.head_commit.message == 'ci: verify generated REST review contracts' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/first-generated-rest-mutations
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --dev --locked
      - run: >-
          uv run ruff format
          packages/rakit-web/tests/test_generated_rest_partial_schema.py
          packages/rakit-web/tests/test_generated_rest_mount_mutation.py
      - run: >-
          uv run pytest
          packages/rakit-web/tests/test_generated_rest_partial_schema.py
          packages/rakit-web/tests/test_generated_rest_mount_mutation.py
          -q
      - name: Commit formatting only
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-web/tests/test_generated_rest_partial_schema.py packages/rakit-web/tests/test_generated_rest_mount_mutation.py
          git diff --cached --quiet && exit 0
          git commit -m "style: format generated REST review tests"
          git push origin HEAD:feat/first-generated-rest-mutations

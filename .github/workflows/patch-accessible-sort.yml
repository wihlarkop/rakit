name: Patch Accessible Sort

on:
  push:
    branches:
      - feat/accessibility-foundation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/accessibility-foundation
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - run: python .github/scripts/patch_accessible_sort.py
      - run: uv run ruff format packages/rakit-web/src/rakit_web/resource_routes.py packages/rakit-web/tests/test_query_ui.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-web/src/rakit_web/resource_routes.py packages/rakit-web/tests/test_query_ui.py
          git rm .github/scripts/patch_accessible_sort.py .github/workflows/patch-accessible-sort.yml
          git commit -m "feat(web): use semantic sortable table controls"
          git push origin HEAD:feat/accessibility-foundation

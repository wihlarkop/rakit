name: UI05E temporary finalize

on:
  push:
    branches: [ui-05e-filter-rail-responsive-filters]

permissions:
  contents: write

jobs:
  migrate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ui-05e-filter-rail-responsive-filters
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - name: Migrate intended UI assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/rakit-web/tests/test_resource_list_ui_maturity.py")
          text = path.read_text(encoding="utf-8")
          old = '''    assert "data-rakit-filter-panel open" in response.text\n    assert "Filters 1" in response.text'''
          new = '''    assert 'data-rakit-filter-ui="orders"' in response.text\n    assert "data-rakit-filter-rail" in response.text\n    assert 'data-rakit-filter-group="status"' in response.text\n    assert "data-rakit-filter-panel" not in response.text'''
          if old in text:
              text = text.replace(old, new, 1)
          elif "data-rakit-filter-panel open" in text:
              raise SystemExit("Resource list expectation marker changed unexpectedly")
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_ui_showcase.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace('assert ">Paid</a>" in resources["orders"].text', 'assert ">Paid</span>" in resources["orders"].text')
          text = text.replace('assert ">Pending review</a>" in resources["orders"].text', 'assert ">Pending review</span>" in resources["orders"].text')
          text = text.replace('assert ">Needs attention</a>" in resources["inventory"].text', 'assert ">Needs attention</span>" in resources["inventory"].text')
          marker = '''    assert 'data-rakit-filter-group="stock_level"' in resources["inventory"].text\n    assert ">Needs attention</span>" in resources["inventory"].text'''
          addition = '''    assert 'data-rakit-filter-group="stock_level"' in resources["inventory"].text\n    assert ">Needs attention</span>" in resources["inventory"].text\n\n    products = resources["products"].text\n    for filter_id in ("category", "status", "name", "sku", "price"):\n        assert f'data-rakit-filter-group="{filter_id}"' in products\n    assert "Show 5 more" in products\n    assert "Ergonomic workspace accessories" in products\n    assert "data-rakit-filter-rail" in products\n    assert "data-rakit-filter-mobile-fallback" in products\n    assert "data-rakit-filter-drawer" in products'''
          if marker in text and "Show 5 more" not in text:
              text = text.replace(marker, addition, 1)
          path.write_text(text, encoding="utf-8")

          path = Path("packages/rakit/tests/test_query_configuration_facade.py")
          text = path.read_text(encoding="utf-8")
          old_import = '''        FilterChoice,\n        FilterSelection,'''
          new_import = '''        FilterChoice,\n        FilterGroupPresentation,\n        FilterPanelPresentation,\n        FilterSelection,'''
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          old_import = '''        ResourcePaginationPolicy,\n        TextFilter,'''
          new_import = '''        ResourcePaginationPolicy,\n        ResourceWebPresentation,\n        TextFilter,'''
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          marker = '''    from rakit_core.pagination import (\n        ResourcePaginationPolicy as RealResourcePaginationPolicy,\n    )\n'''
          addition = marker + '''    from rakit_web.resource_presentation import (\n        FilterGroupPresentation as RealFilterGroupPresentation,\n        FilterPanelPresentation as RealFilterPanelPresentation,\n        ResourceWebPresentation as RealResourceWebPresentation,\n    )\n'''
          if marker in text and "RealFilterGroupPresentation" not in text:
              text = text.replace(marker, addition, 1)
          marker = '''    assert FilterChoice is RealFilterChoice\n    assert FilterSelection is RealFilterSelection'''
          addition = '''    assert FilterChoice is RealFilterChoice\n    assert FilterGroupPresentation is RealFilterGroupPresentation\n    assert FilterPanelPresentation is RealFilterPanelPresentation\n    assert FilterSelection is RealFilterSelection'''
          if marker in text:
              text = text.replace(marker, addition, 1)
          marker = '''    assert ResourcePaginationPolicy is RealResourcePaginationPolicy\n    assert TextFilter is RealTextFilter'''
          addition = '''    assert ResourcePaginationPolicy is RealResourcePaginationPolicy\n    assert ResourceWebPresentation is RealResourceWebPresentation\n    assert TextFilter is RealTextFilter'''
          if marker in text:
              text = text.replace(marker, addition, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Format changed tests
        run: |
          uv run ruff format \
            packages/rakit-web/tests/test_resource_filter_presentation.py \
            packages/rakit-web/tests/test_resource_list_ui_maturity.py \
            packages/rakit/tests/test_query_configuration_facade.py \
            tests/test_ui_showcase.py
      - name: Run focused UI-05E regression suite
        run: |
          uv run pytest \
            packages/rakit-web/tests/test_resource_filter_presentation.py \
            packages/rakit-web/tests/test_resource_list_ui_maturity.py \
            packages/rakit/tests/test_query_configuration_facade.py \
            tests/test_ui_showcase.py \
            -q
      - name: Commit test migration
        shell: bash
        run: |
          set -euo pipefail
          git add \
            packages/rakit-web/tests/test_resource_filter_presentation.py \
            packages/rakit-web/tests/test_resource_list_ui_maturity.py \
            packages/rakit/tests/test_query_configuration_facade.py \
            tests/test_ui_showcase.py
          if git diff --cached --quiet; then
            echo "No test migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(web): cover responsive filter presentation"
          git push origin HEAD:ui-05e-filter-rail-responsive-filters

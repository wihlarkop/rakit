name: D3.4 Piccolo artifact inventory fix

on:
  push:
    branches: [phase-d3-4-piccolo]

permissions:
  contents: write

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-d3-4-piccolo
      - name: Add Piccolo to official distribution inventory
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/examples/test_read_examples.py")
          text = path.read_text()
          old_name = "test_all_packages_builds_exactly_the_fourteen_official_distributions"
          new_name = "test_all_packages_builds_exactly_the_fifteen_official_distributions"
          if old_name not in text:
              raise SystemExit("expected distribution test name not found")
          text = text.replace(old_name, new_name, 1)
          anchor = '        "rakit_peewee",\n'
          if '        "rakit_piccolo",\n' not in text:
              if anchor not in text:
                  raise SystemExit("expected Peewee inventory anchor not found")
              text = text.replace(anchor, anchor + '        "rakit_piccolo",\n', 1)
          path.write_text(text)
          PY
      - name: Commit inventory update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/examples/test_read_examples.py
          git commit -m "test(packaging): include Piccolo distribution"
          git push origin HEAD:phase-d3-4-piccolo

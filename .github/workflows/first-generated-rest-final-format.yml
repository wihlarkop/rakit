name: First Generated REST Mutation Format

on:
  push:
    branches: [feat/first-generated-rest-mutations]

permissions:
  contents: write

jobs:
  format:
    if: "${{ github.event.head_commit.message == 'ci: format generated REST mutation files' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/first-generated-rest-mutations
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --dev --locked
      - run: >-
          uv run ruff format
          packages/rakit-core/tests/test_generated_rest_mutation_compilation.py
          packages/rakit-sqlalchemy/src/rakit_sqlalchemy/generated.py
          packages/rakit-sqlalchemy/tests/test_generated_resource_executor.py
          packages/rakit-web/tests/test_generated_rest_concurrency_runtime.py
          packages/rakit-web/tests/test_generated_rest_mutation_runtime.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/rakit-core/tests/test_generated_rest_mutation_compilation.py \
            packages/rakit-sqlalchemy/src/rakit_sqlalchemy/generated.py \
            packages/rakit-sqlalchemy/tests/test_generated_resource_executor.py \
            packages/rakit-web/tests/test_generated_rest_concurrency_runtime.py \
            packages/rakit-web/tests/test_generated_rest_mutation_runtime.py
          git commit -m "style: format generated REST mutation files"
          git push origin HEAD:feat/first-generated-rest-mutations

name: UI-07A PR builder

on:
  pull_request:
    branches: [ui-07-responsive-a11y-hardening]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.head_ref == 'ui-07a-responsive-overflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - name: Apply source hardening
        run: python .github/ui07a_patch.py
      - name: Install maintainer assets
        run: bun install --frozen-lockfile
      - name: Build committed CSS
        run: bun run css:build
      - name: Verify source constraints
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'calc(100vw_-_3rem)' packages/rakit-web/src/rakit_web/templates/components/admin_mobile_navigation.html
          grep -F 'calc(100vw_-_1rem)' packages/rakit-web/src/rakit_web/templates/resources/_table.html
          grep -F 'calc(100%_-_2rem)' packages/rakit-web/src/rakit_web/assets/rakit.css
          grep -F '[overflow-wrap:anywhere]' packages/rakit-web/src/rakit_web/templates/resources/detail.html
          git diff --check
      - name: Commit product source and generated CSS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/rakit-web/src/rakit_web
          if git diff --cached --quiet; then
            echo 'No product changes to commit'
            exit 1
          fi
          git commit -m 'fix(web): harden responsive layouts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

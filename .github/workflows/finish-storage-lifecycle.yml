name: Finish Storage Lifecycle

on:
  push:
    branches:
      - feat/storage-foundation

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/storage-foundation
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - run: python .github/scripts/finish_storage_lifecycle.py
      - run: uv run ruff format packages/rakit-web/src/rakit_web/form_routes.py packages/rakit-web/src/rakit_web/admin.py packages/rakit-web/tests/test_files.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-web/src/rakit_web/form_routes.py packages/rakit-web/src/rakit_web/admin.py packages/rakit-web/tests/test_files.py
          git rm .github/scripts/finish_storage_lifecycle.py .github/workflows/finish-storage-lifecycle.yml
          git commit -m "feat(web): complete file storage lifecycle"
          git push origin HEAD:feat/storage-foundation

name: UI CSS build diagnostic

on:
  push:
    branches:
      - ui-02-app-shell-navigation

permissions:
  contents: write

jobs:
  build-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --package-lock=false @tailwindcss/cli@4.1.18 tailwindcss@4.1.18
      - run: npm run css:build
      - name: Commit rebuilt CSS
        run: |
          git add packages/rakit-web/src/rakit_web/static/rakit.css
          if git diff --cached --quiet; then
            echo 'Generated CSS already matches source.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(web): rebuild Tailwind asset'
          git push origin HEAD:ui-02-app-shell-navigation

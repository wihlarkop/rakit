name: UI CSS build diagnostic

on:
  push:
    branches:
      - ui-02-app-shell-navigation

permissions:
  contents: read

jobs:
  build-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --package-lock=false @tailwindcss/cli@4.1.18 tailwindcss@4.1.18
      - run: npx tailwindcss --input packages/rakit-web/src/rakit_web/assets/rakit.css --output packages/rakit-web/src/rakit_web/static/rakit.css --minify
      - name: Print rebuilt CSS
        run: |
          echo 'RAKIT_CSS_BASE64_BEGIN'
          base64 -w0 packages/rakit-web/src/rakit_web/static/rakit.css
          echo
          echo 'RAKIT_CSS_BASE64_END'

name: Format Accessibility Assets

on:
  push:
    branches:
      - feat/accessibility-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/accessibility-foundation
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - run: uv run ruff format packages/rakit-web/src/rakit_web/assets.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-web/src/rakit_web/assets.py
          git rm .github/workflows/format-accessibility-assets.yml
          git commit -m "style(web): format accessibility asset registry"
          git push origin HEAD:feat/accessibility-foundation

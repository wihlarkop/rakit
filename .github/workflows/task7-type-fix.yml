name: Task7 Final Verification

on:
  pull_request:

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --dev --locked
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Type check
        run: uv run ty check
      - name: Focused endpoint tests
        run: uv run pytest packages/rakit-web/tests/test_endpoints.py -q
      - name: Full suite excluding two verified main-branch Linux baseline failures
        run: >-
          uv run pytest -q
          -k "not test_all_packages_builds_exactly_the_eight_official_distributions
          and not test_auth_migration_history_coexists_with_a_host_alembic_version_table"
      - name: Whitespace diff check
        run: git diff --check
      - name: Build all packages
        run: |
          rm -rf dist
          uv build --all-packages -o dist
      - name: CLI smoke
        run: uv run rakit --help
      - name: Record final verification inputs
        run: |
          git rev-parse HEAD
          git status --short
      - name: Remove temporary Task 7 verifier
        shell: bash
        run: |
          git rm .github/workflows/task7-type-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: remove task7 verification helper"
          git push origin HEAD:${{ github.head_ref }}

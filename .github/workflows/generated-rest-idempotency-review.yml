name: Generated REST Idempotency Review

on:
  push:
    branches: [feat/first-generated-rest-mutations]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'ci: harden post-commit idempotency safety' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/first-generated-rest-mutations
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --dev --locked
      - name: Patch post-commit reservation handling and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('packages/rakit-web/src/rakit_web/generated_rest_runtime.py')
          text = runtime.read_text()
          old = '''    reservation: IdempotencyReservation | None = None\n    try:\n'''
          new = '''    reservation: IdempotencyReservation | None = None\n    mutation_committed = False\n    try:\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        result, operation_id = await _run_mutation(\n            binding,\n            request,\n            generated_request,\n            authorization,\n            idempotency_fingerprint=fingerprint,\n        )\n        response = _mutation_response(binding, request, operation, result)\n'''
          new = '''        result, operation_id = await _run_mutation(\n            binding,\n            request,\n            generated_request,\n            authorization,\n            idempotency_fingerprint=fingerprint,\n        )\n        # `IdempotencyStore.release()` is only valid before commit. Once the\n        # canonical operation returns, the root UoW has committed, so a later\n        # response/receipt failure must keep the durable claim closed to retry.\n        mutation_committed = True\n        response = _mutation_response(binding, request, operation, result)\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    except RakitError as exc:\n        if reservation is not None and binding.idempotency_store is not None:\n            await binding.idempotency_store.release(reservation)\n        return generated_error_response(request, exc)\n    except Exception:\n        if reservation is not None and binding.idempotency_store is not None:\n            await binding.idempotency_store.release(reservation)\n        return _unexpected_error_response(request)\n'''
          new = '''    except RakitError as exc:\n        if (\n            reservation is not None\n            and not mutation_committed\n            and binding.idempotency_store is not None\n        ):\n            await binding.idempotency_store.release(reservation)\n        return generated_error_response(request, exc)\n    except Exception:\n        if (\n            reservation is not None\n            and not mutation_committed\n            and binding.idempotency_store is not None\n        ):\n            await binding.idempotency_store.release(reservation)\n        return _unexpected_error_response(request)\n'''
          assert old in text
          runtime.write_text(text)

          tests = Path('packages/rakit-web/tests/test_generated_rest_mutation_runtime.py')
          test_text = tests.read_text()
          addition = '''\n\nclass FailingCompleteIdempotencyStore(MemoryIdempotencyStore):\n    def __init__(self) -> None:\n        super().__init__()\n        self.release_calls = 0\n\n    async def complete(self, reservation, receipt: OperationReceipt) -> None:\n        raise RuntimeError("receipt store unavailable")\n\n    async def release(self, reservation) -> None:\n        self.release_calls += 1\n        await super().release(reservation)\n\n\n@pytest.mark.anyio\nasync def test_post_commit_receipt_failure_does_not_release_idempotency_claim() -> None:\n    executor = Executor()\n    store = FailingCompleteIdempotencyStore()\n    transport = httpx.ASGITransport(app=_app(executor, store))\n    headers = {"Idempotency-Key": "commit-safe"}\n\n    async with httpx.AsyncClient(transport=transport, base_url="http://localhost") as client:\n        first = await client.post(\n            "/api/users",\n            json={"email": "committed@example.com"},\n            headers=headers,\n        )\n        retry = await client.post(\n            "/api/users",\n            json={"email": "committed@example.com"},\n            headers=headers,\n        )\n\n    assert first.status_code == 500\n    assert retry.status_code == 409\n    assert len(executor.calls) == 1\n    assert store.release_calls == 0\n'''
          assert 'test_post_commit_receipt_failure_does_not_release_idempotency_claim' not in test_text
          tests.write_text(test_text + addition)
          PY
          uv run ruff format packages/rakit-web/src/rakit_web/generated_rest_runtime.py packages/rakit-web/tests/test_generated_rest_mutation_runtime.py
          uv run ruff check packages/rakit-web/src/rakit_web/generated_rest_runtime.py packages/rakit-web/tests/test_generated_rest_mutation_runtime.py
          uv run ty check
          uv run pytest packages/rakit-web/tests/test_generated_rest_mutation_runtime.py -q
      - name: Commit review hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-web/src/rakit_web/generated_rest_runtime.py packages/rakit-web/tests/test_generated_rest_mutation_runtime.py
          git commit -m "fix(web): keep post-commit idempotency claims closed"
          git push origin HEAD:feat/first-generated-rest-mutations

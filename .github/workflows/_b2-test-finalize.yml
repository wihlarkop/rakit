name: B2 test finalize

on:
  pull_request:
  push:
    branches: [phase-b2-alpha-hardening]

permissions:
  contents: write

jobs:
  finalize-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-b2-alpha-hardening
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - name: Update intentional Uvicorn install-hint contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/rakit/tests/test_facade.py")
          source = path.read_text(encoding="utf-8")
          marker = "def test_server_uvicorn_facade_raises_friendly_error_when_missing"
          old = 'assert \'uv add "rakit[server-uvicorn]"\' in str(caught.value)'
          new = 'assert \'uv add "rakit[uvicorn]"\' in str(caught.value)'
          if marker not in source:
              raise SystemExit("Uvicorn facade test marker not found")
          before, after = source.split(marker, 1)
          if old not in after:
              raise SystemExit("stale Uvicorn facade assertion not found after marker")
          after = after.replace(old, new, 1)
          path.write_text(before + marker + after, encoding="utf-8")
          PY
      - name: Finalize B2 formatting and lint
        run: |
          uv run ruff format \
            scripts/check_artifacts.py \
            packages/rakit-web/src/rakit_web \
            packages/rakit-auth-sqlalchemy/src/rakit_auth_sqlalchemy \
            packages/rakit/tests \
            packages/rakit-web/tests \
            packages/rakit-auth-sqlalchemy/tests \
            tests/release
          uv run ruff check --fix \
            scripts/check_artifacts.py \
            packages/rakit-web/src/rakit_web \
            packages/rakit-auth-sqlalchemy/src/rakit_auth_sqlalchemy \
            packages/rakit/tests \
            packages/rakit-web/tests \
            packages/rakit-auth-sqlalchemy/tests \
            tests/release
          uv run ruff format \
            scripts/check_artifacts.py \
            packages/rakit-web/src/rakit_web \
            packages/rakit-auth-sqlalchemy/src/rakit_auth_sqlalchemy \
            packages/rakit/tests \
            packages/rakit-web/tests \
            packages/rakit-auth-sqlalchemy/tests \
            tests/release
      - name: Run focused B2 regressions
        run: |
          uv run pytest -q \
            packages/rakit/tests/test_b2_facades.py \
            packages/rakit/tests/test_facade.py \
            packages/rakit-web/tests/test_assets.py \
            packages/rakit-web/tests/test_http_status_semantics.py \
            packages/rakit-auth-sqlalchemy/tests/test_persistence_namespace.py \
            tests/release/test_installed_artifacts.py
      - name: Commit finalized B2 code and tests
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo "B2 code and tests already finalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/check_artifacts.py \
            packages/rakit-web/src/rakit_web \
            packages/rakit-auth-sqlalchemy/src/rakit_auth_sqlalchemy \
            packages/rakit/tests \
            packages/rakit-web/tests \
            packages/rakit-auth-sqlalchemy/tests \
            tests/release
          git commit -m "test: finalize B2 hardening regressions"
          git push origin HEAD:phase-b2-alpha-hardening

# Temporary: remove after focused B2 regressions land.

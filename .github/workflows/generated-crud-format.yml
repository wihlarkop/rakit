name: Generated CRUD Format

on:
  push:
    branches: [feat/generated-crud-api-foundation]

permissions:
  contents: write

jobs:
  format:
    if: "${{ github.event.head_commit.message == 'ci: format generated CRUD type fixes' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/generated-crud-api-foundation
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --dev --locked
      - run: uv run ruff format .
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format generated CRUD type fixes"
          git push origin HEAD:feat/generated-crud-api-foundation

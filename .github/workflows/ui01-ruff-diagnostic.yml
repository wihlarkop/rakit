name: UI01 Ruff diagnostic

on:
  push:
    branches:
      - ui-01-showcase-baseline

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --dev --locked
      - name: Show exact Ruff formatting diff
        run: |
          uv run ruff format examples/ui_showcase/main.py
          git diff --check
          git diff -- examples/ui_showcase/main.py

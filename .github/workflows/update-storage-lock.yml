name: Sync Storage Lock

on:
  push:
    branches:
      - feat/storage-foundation

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/storage-foundation
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Update workspace lock
        run: uv lock
      - name: Commit lock and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git rm .github/workflows/update-storage-lock.yml
          git commit -m "build(storage): sync workspace lock"
          git push origin HEAD:feat/storage-foundation

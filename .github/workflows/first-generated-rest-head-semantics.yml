name: First Generated REST HEAD Semantics

on:
  push:
    branches: [feat/first-generated-rest-read]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'ci: align generated REST HEAD semantics' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/first-generated-rest-read
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --dev --locked
      - name: Align compiler and permissions with Starlette HEAD behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/rakit-core/src/rakit_core/compiler.py')
          text = path.read_text()
          text = text.replace(
              'GeneratedCrudOperation.LIST: ("list", ("GET",), False),\n'
              '        GeneratedCrudOperation.DETAIL: ("detail", ("GET",), True),',
              'GeneratedCrudOperation.LIST: ("list", ("GET", "HEAD"), False),\n'
              '        GeneratedCrudOperation.DETAIL: ("detail", ("GET", "HEAD"), True),',
              1,
          )
          path.write_text(text)

          path = Path('packages/rakit-web/src/rakit_web/generated_rest_runtime.py')
          text = path.read_text()
          old = '''        if GeneratedCrudOperation.LIST in api.operations:\n            requirements[("GET", base)] = read\n        if GeneratedCrudOperation.DETAIL in api.operations:\n            requirements[("GET", f"{base}/{{identity}}")] = read\n'''
          new = '''        if GeneratedCrudOperation.LIST in api.operations:\n            requirements[("GET", base)] = read\n            requirements[("HEAD", base)] = read\n        if GeneratedCrudOperation.DETAIL in api.operations:\n            detail_path = f"{base}/{{identity}}"\n            requirements[("GET", detail_path)] = read\n            requirements[("HEAD", detail_path)] = read\n'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('packages/rakit-core/tests/test_generated_rest_compilation.py')
          text = path.read_text()
          text = text.replace(
              '("generated-api:users:list", ("GET",), "/api/users", True),\n'
              '        ("generated-api:users:detail", ("GET",), "/api/users/{identity}", True),',
              '("generated-api:users:list", ("GET", "HEAD"), "/api/users", True),\n'
              '        (\n'
              '            "generated-api:users:detail",\n'
              '            ("GET", "HEAD"),\n'
              '            "/api/users/{identity}",\n'
              '            True,\n'
              '        ),',
              1,
          )
          text = text.replace(
              '("generated-api:users:list", ("GET",), "/api/users"),\n'
              '        ("generated-api:users:detail", ("GET",), "/api/users/{identity}"),',
              '("generated-api:users:list", ("GET", "HEAD"), "/api/users"),\n'
              '        ("generated-api:users:detail", ("GET", "HEAD"), "/api/users/{identity}"),',
              1,
          )
          path.write_text(text)
          PY
          uv run ruff format packages/rakit-core/src/rakit_core/compiler.py packages/rakit-core/tests/test_generated_rest_compilation.py packages/rakit-web/src/rakit_web/generated_rest_runtime.py
          uv run ruff check packages/rakit-core/src/rakit_core/compiler.py packages/rakit-core/tests/test_generated_rest_compilation.py packages/rakit-web/src/rakit_web/generated_rest_runtime.py
          uv run ty check
          uv run pytest packages/rakit-core/tests/test_generated_rest_compilation.py packages/rakit-web/tests/test_generated_rest_read_runtime.py packages/rakit-web/tests/test_auth_enforcement.py -q
          uv run pytest
      - name: Commit HEAD semantics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-core/src/rakit_core/compiler.py packages/rakit-core/tests/test_generated_rest_compilation.py packages/rakit-web/src/rakit_web/generated_rest_runtime.py
          git commit -m "fix: align generated REST HEAD semantics"
          git push origin HEAD:feat/first-generated-rest-read

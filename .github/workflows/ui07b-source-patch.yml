name: UI-07B source patch

on:
  push:
    branches: [ui-07b-keyboard-focus-semantics]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ui-07b-keyboard-focus-semantics
          fetch-depth: 0
      - name: Apply keyboard/focus/semantic hardening
        run: python .github/ui07b_patch.py
      - name: Verify JavaScript syntax and diff
        shell: bash
        run: |
          set -euo pipefail
          node --check packages/rakit-web/src/rakit_web/static/rakit-shell.js
          node --check packages/rakit-web/src/rakit_web/static/rakit-ui.js
          git diff --check
      - name: Commit product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/rakit-web/src/rakit_web
          if git diff --cached --quiet; then
            echo 'No product source changes'
            exit 1
          fi
          git commit -m 'fix(web): harden keyboard focus and semantics'
          git push origin HEAD:ui-07b-keyboard-focus-semantics

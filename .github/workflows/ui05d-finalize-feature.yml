name: UI-05D final cleanup prep

on:
  pull_request:
    branches:
      - ui-05-resource-experience

permissions:
  contents: write

jobs:
  cleanup-prep:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-05d-resource-query-configuration
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync workspace
        run: uv sync --all-packages --dev --locked
      - name: Normalize remaining real example
        run: |
          uv run ruff format examples/custom_datasource/main.py
          uv run ruff check --fix examples/custom_datasource/main.py
          uv run ruff format examples/custom_datasource/main.py
          uv run ruff check examples/custom_datasource/main.py
      - name: Check patch whitespace
        run: git diff --check origin/ui-05-resource-experience...HEAD
      - name: Commit remaining real formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/custom_datasource/main.py
          if ! git diff --cached --quiet; then
            git commit -m 'style(examples): format custom datasource query support'
            git push origin HEAD:ui-05d-resource-query-configuration
          fi

name: UI-05D diagnostics

on:
  pull_request:
    branches:
      - ui-05-resource-experience

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync workspace
        run: uv sync --all-packages --dev --locked
      - name: Capture full type-check diagnostics
        run: |
          set -o pipefail
          uv run ty check 2>&1 | tee .github/ui05d-ty.log
      - name: Upload type-check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui05d-ty-diagnostics
          path: .github/ui05d-ty.log
          if-no-files-found: ignore

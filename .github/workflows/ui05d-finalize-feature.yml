name: UI-05D focused verification

on:
  pull_request:
    branches:
      - ui-05-resource-experience

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync workspace
        run: uv sync --all-packages --dev --locked
      - name: Capture static verification
        continue-on-error: true
        run: |
          set -o pipefail
          status=0
          {
            echo '=== ruff ==='
            uv run ruff check . || status=1
            echo '=== ty ==='
            uv run ty check || status=1
            exit "$status"
          } 2>&1 | tee .github/ui05d-static.log
      - name: Upload static diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui05d-static-diagnostics
          path: .github/ui05d-static.log
          if-no-files-found: ignore
      - name: Run focused regression suites
        run: |
          set -o pipefail
          status=0
          {
            echo '=== rakit-core query suites ==='
            uv run pytest \
              packages/rakit-core/tests/test_query.py \
              packages/rakit-core/tests/test_generated_api_query.py \
              packages/rakit-core/tests/testing/test_datasource_contract.py \
              -q || status=1
            echo '=== rakit-sqlalchemy query suites ==='
            uv run pytest \
              packages/rakit-sqlalchemy/tests/test_datasource.py \
              packages/rakit-sqlalchemy/tests/test_query_translation.py \
              -q || status=1
            echo '=== rakit-web query suites ==='
            uv run pytest \
              packages/rakit-web/tests/test_query_ui.py \
              packages/rakit-web/tests/test_resource_list_ui_maturity.py \
              packages/rakit-web/tests/test_generated_rest_contracts.py \
              packages/rakit-web/tests/test_bulk_list_ui.py \
              packages/rakit-web/tests/test_relationship_ui.py \
              packages/rakit-web/tests/test_resource_detail_form_ui_maturity.py \
              -q || status=1
            echo '=== release-level security regression ==='
            uv run pytest tests/integration/test_security_regressions.py -q || status=1
            exit "$status"
          } 2>&1 | tee .github/ui05d-pytest.log
      - name: Upload focused pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui05d-pytest-diagnostics
          path: .github/ui05d-pytest.log
          if-no-files-found: ignore

name: Debug UI-05B feature finalize

on:
  push:
    branches:
      - ui-05b-resource-list-experience

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ui-05b-resource-list-experience
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: uv sync --all-packages --dev --locked
      - run: bun install --frozen-lockfile
      - name: Add deterministic empty resource
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path("examples/ui_showcase/main.py")
          text = main.read_text(encoding="utf-8")
          if "class ReturnsAdmin(ResourceAdmin):" not in text:
              anchor = "\n\nclass DemoAuthBackend:\n"
              assert text.count(anchor) == 1
              returns_admin = '''

class ReturnsAdmin(ResourceAdmin):
    resource_id = "returns"
    path = "/returns"
    label = "Returns"
    singular_label = "Return"
    data_source = _MemoryDataSource((), ("id", "customer", "status"))
    list_fields = ("id", "customer", "status")
    detail_fields = ("id", "customer", "status")
    filter_fields = ("status",)
    search_fields = ("id", "customer")
    sort_fields = ("id", "customer", "status")
'''
              text = text.replace(anchor, returns_admin + anchor)
          registration = '''    InventoryAdmin,
    TeamsAdmin,
):'''
          if registration in text:
              text = text.replace(
                  registration,
                  '''    InventoryAdmin,
    TeamsAdmin,
    ReturnsAdmin,
):''',
              )
          main.write_text(text, encoding="utf-8")
          PY
          uv run ruff check --fix examples/ui_showcase/main.py
          uv run ruff format examples/ui_showcase/main.py
      - run: bun run css:build
      - name: Commit finalized feature surface
        shell: bash
        run: |
          if git diff --quiet -- \
            examples/ui_showcase/main.py \
            packages/rakit-web/src/rakit_web/static/rakit.css; then
            echo "Feature surface already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            examples/ui_showcase/main.py \
            packages/rakit-web/src/rakit_web/static/rakit.css
          git commit -m "build(web): finalize UI-05B resource list feature"
          git push origin HEAD:ui-05b-resource-list-experience

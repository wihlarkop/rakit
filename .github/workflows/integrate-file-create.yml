name: Integrate File Upload Create

on:
  push:
    branches:
      - feat/storage-foundation

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/storage-foundation
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Integrate file upload create lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/rakit-web/src/rakit_web/form_routes.py')
          text = path.read_text()

          old = 'from rakit_core.events import EventPublisher\nfrom rakit_core.forms import ('
          new = 'from rakit_core.events import EventPublisher\nfrom rakit_core.fields import FileField\nfrom rakit_core.forms import ('
          assert old in text
          text = text.replace(old, new, 1)

          old = 'from starlette.exceptions import HTTPException\nfrom starlette.requests import Request\n'
          new = 'from starlette.datastructures import UploadFile\nfrom starlette.exceptions import HTTPException\nfrom starlette.requests import Request\n'
          assert old in text
          text = text.replace(old, new, 1)

          old = 'from ._paths import mounted_path\nfrom .relationship_routes import ('
          new = '''from ._paths import mounted_path
from .file_uploads import (
    FilePreparation,
    canonical_submission_values,
    compensate_uploads,
    file_accept,
    file_fields,
    has_file_fields,
    prepare_file_submission,
    submission_for_display,
)
from .relationship_routes import ('''
          assert old in text
          text = text.replace(old, new, 1)

          start = text.index('async def _parse_form(')
          end = text.index('\n\ndef _record_values', start)
          replacement = '''async def _parse_form(
    request: Request, binding: WriteResourceBinding
) -> tuple[dict[str, object], dict[str, str]] | None:
    file_ids = {field.field_id for field in file_fields(binding.form_schema)}
    try:
        form = await request.form(
            max_files=len(file_ids),
            max_fields=len(binding.form_schema.fields)
            + (1_000 if binding.relationship_form else 4),
        )
    except HTTPException:
        return None
    items = form.multi_items()
    names = [name for name, _ in items]
    if len(names) != len(set(names)):
        return None
    reserved = {"csrf_token", "submission_token", "concurrency_token", "delete_token"}
    values: dict[str, object] = {}
    tokens: dict[str, str] = {}
    for name, value in items:
        if name in reserved:
            if not isinstance(value, str):
                return None
            tokens[name] = value
            continue
        if isinstance(value, UploadFile):
            if name not in file_ids:
                return None
            values[name] = value
            continue
        if not isinstance(value, str):
            return None
        values[name] = value
    try:
        split_relationship_submission(binding.relationship_form, values)
    except ValueError:
        return None
    return values, tokens
'''
          text = text[:start] + replacement + text[end:]

          old = '''            "value": (submitted or {}).get(field.field_id, ""),
            "issues": issue_map.get(field.field_id, ()),
'''
          new = '''            "value": (submitted or {}).get(field.field_id, ""),
            "issues": issue_map.get(field.field_id, ()),
            "is_file": isinstance(field, FileField),
            "accept": file_accept(field) if isinstance(field, FileField) else "",
            "required": field.required,
'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''            "concurrency_token": concurrency_token,
            "codec": binding.relationship_form.codec
'''
          new = '''            "concurrency_token": concurrency_token,
            "has_file_fields": has_file_fields(binding.form_schema),
            "codec": binding.relationship_form.codec
'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '        "values": dict(sorted(submitted.items())),\n'
          new = '        "values": dict(sorted(canonical_submission_values(submitted).items())),\n'
          assert old in text
          text = text.replace(old, new, 1)

          marker = '\n\ndef build_write_routes(binding: WriteResourceBinding) -> list[Route]:\n'
          assert marker in text
          helpers = '''

@asynccontextmanager
async def _file_services(binding: WriteResourceBinding) -> AsyncIterator[ServiceResolver]:
    if binding.operation_scope is None:
        raise RakitError(
            code=ErrorCode.CONFIG_INVALID,
            message="File fields require an operation service scope.",
            status_code=500,
        )
    async with binding.operation_scope() as services:
        yield services


async def _prepare_bound_files(
    binding: WriteResourceBinding,
    submitted: Mapping[str, object],
    *,
    previous_record: object | None = None,
) -> FilePreparation:
    if not has_file_fields(binding.form_schema):
        return FilePreparation(values=dict(submitted), uploads=(), issues=())
    async with _file_services(binding) as services:
        return await prepare_file_submission(
            binding.form_schema,
            submitted,
            services=services,
            previous_record=previous_record,
        )


async def _compensate_bound_files(
    binding: WriteResourceBinding,
    preparation: FilePreparation,
) -> None:
    if not preparation.uploads:
        return
    async with _file_services(binding) as services:
        await compensate_uploads(preparation.uploads, services=services)
'''
          text = text.replace(marker, helpers + marker, 1)

          start = text.index('    async def create_post(request: Request) -> Response:')
          end = text.index('\n    routes = [', start)
          replacement = '''    async def create_post(request: Request) -> Response:
        if not await binding.authorize(request):
            return _error(403, "Forbidden")
        authorization = await _authorization(binding, request, "create", None)
        if authorization is None:
            return _error(403, "Forbidden")
        if not await binding.verify_csrf(request):
            return _error(403, "Invalid CSRF token")
        if not await binding.verify_submission_token(request):
            return _error(409, "Invalid submission token")
        parsed = await _parse_form(request, binding)
        if parsed is None:
            return _error(400, "Invalid form")
        submitted, tokens = parsed
        display_submitted = submission_for_display(submitted)
        preparation = FilePreparation(values=dict(submitted), uploads=(), issues=())
        reservation: IdempotencyReservation | None = None
        try:
            scalar_submitted, _ = split_relationship_submission(
                binding.relationship_form, submitted
            )
            preparation = await _prepare_bound_files(binding, scalar_submitted)
            if preparation.issues:
                await _compensate_bound_files(binding, preparation)
                return await _form_response(
                    binding,
                    request,
                    title=f"New {binding.label}",
                    action_path=binding.create_path,
                    submitted=display_submitted,
                    issues=preparation.issues,
                    status_code=422,
                )
            state = binding.form_schema.parse(preparation.values)
            normalized = dict(state.normalized)
            changes = (
                await build_relationship_changes(
                    binding.relationship_form, submitted, parent_identity=None
                )
                if binding.relationship_form is not None
                else ()
            )
            if binding.relationship_form is not None:
                graph_service = cast(GraphMutationService, binding.mutation_service)
                if not callable(getattr(graph_service, "create_graph", None)):
                    raise RakitError(
                        code=ErrorCode.CONFIG_INVALID,
                        message="Relationship forms require graph mutation support.",
                        status_code=500,
                    )
                graph_authorizations = await _graph_authorizations(
                    binding, request, authorization, None, changes
                )
                await _execute_with_deadline(
                    binding,
                    request,
                    graph_service.create_graph(
                        state,
                        relationship_changes=changes,
                        authorizations=graph_authorizations,
                        idempotency_token=tokens.get("submission_token"),
                    ),
                    authorization,
                )
            else:
                reservation, replay = await _claim_submission(
                    binding, request, submitted=normalized, tokens=tokens, operation="create"
                )
                if replay is not None:
                    await _compensate_bound_files(binding, preparation)
                    return replay
                await _execute_with_deadline(
                    binding,
                    request,
                    binding.mutation_service.create(state, authorization=authorization),
                    authorization,
                )
                if reservation is not None and binding.idempotency_store is not None:
                    await binding.idempotency_store.complete(
                        reservation,
                        OperationReceipt(
                            operation_id=str(uuid.uuid4()),
                            status="succeeded",
                            result_kind="redirect",
                            redirect_route=binding.path,
                        ),
                    )
        except FormValidationError as exc:
            await _compensate_bound_files(binding, preparation)
            return await _form_response(
                binding,
                request,
                title=f"New {binding.label}",
                action_path=binding.create_path,
                submitted=display_submitted,
                issues=exc.state.issues,
                status_code=422,
            )
        except RakitError as exc:
            await _compensate_bound_files(binding, preparation)
            if reservation is not None and binding.idempotency_store is not None:
                await binding.idempotency_store.release(reservation)
            if binding.relationship_form is not None:
                return await _form_response(
                    binding,
                    request,
                    title=f"New {binding.label}",
                    action_path=binding.create_path,
                    submitted=display_submitted,
                    issues=()
                    if _relationship_error_issues(exc)
                    else (FormIssue(None, exc.message),),
                    relationship_issues=_relationship_error_issues(exc),
                    status_code=exc.status_code,
                )
            return _error(exc.status_code, "Invalid form")
        except ValueError:
            await _compensate_bound_files(binding, preparation)
            if reservation is not None and binding.idempotency_store is not None:
                await binding.idempotency_store.release(reservation)
            return _error(400, "Invalid form")
        return mutation_success(
            request,
            location=mounted_path(request, binding.path),
            refresh_targets=binding.htmx_refresh_targets,
            message=binding.success_message,
        )
'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)

          template = Path('packages/rakit-web/src/rakit_web/templates/forms/form.html')
          text = template.read_text()
          old = '''        <input class="rakit-input" id="{{ field.id }}" name="{{ field.name }}" value="{{ field.value }}"{% if descriptions %} aria-describedby="{{ descriptions | join(' ') }}"{% endif %}{% if field.issues %} aria-invalid="true"{% endif %} />'''
          new = '''        {% if field.is_file %}
        <input class="rakit-input" type="file" id="{{ field.id }}" name="{{ field.name }}"{% if field.accept %} accept="{{ field.accept }}"{% endif %}{% if field.required %} required{% endif %}{% if descriptions %} aria-describedby="{{ descriptions | join(' ') }}"{% endif %}{% if field.issues %} aria-invalid="true"{% endif %} />
        {% else %}
        <input class="rakit-input" id="{{ field.id }}" name="{{ field.name }}" value="{{ field.value }}"{% if descriptions %} aria-describedby="{{ descriptions | join(' ') }}"{% endif %}{% if field.issues %} aria-invalid="true"{% endif %} />
        {% endif %}'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''<form class="space-y-5" method="post" action="{{ action_url }}" novalidate{% if first_invalid_id %} data-rakit-first-invalid="{{ first_invalid_id }}"{% endif %}>'''
          new = '''<form class="space-y-5" method="post" action="{{ action_url }}"{% if has_file_fields %} enctype="multipart/form-data"{% endif %} novalidate{% if first_invalid_id %} data-rakit-first-invalid="{{ first_invalid_id }}"{% endif %}>'''
          assert old in text
          text = text.replace(old, new, 1)
          template.write_text(text)

          pyproject = Path('packages/rakit-web/pyproject.toml')
          text = pyproject.read_text()
          old = '    "rakit-core==0.1.0a1",\n'
          new = '    "rakit-core==0.1.0a1",\n    "rakit-storage==0.1.0a1",\n'
          assert old in text
          text = text.replace(old, new, 1)
          old = 'rakit-core = { workspace = true }\n'
          new = 'rakit-core = { workspace = true }\nrakit-storage = { workspace = true }\n'
          assert old in text
          text = text.replace(old, new, 1)
          pyproject.write_text(text)
          PY
      - name: Sync lock and format
        run: |
          uv lock
          uv run ruff format packages/rakit-web/src/rakit_web/form_routes.py packages/rakit-web/src/rakit_web/file_uploads.py packages/rakit-web/tests/test_files.py
      - name: Commit integration and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-web/src/rakit_web/form_routes.py packages/rakit-web/src/rakit_web/file_uploads.py packages/rakit-web/src/rakit_web/templates/forms/form.html packages/rakit-web/pyproject.toml packages/rakit-web/tests/test_files.py uv.lock
          git rm .github/workflows/integrate-file-create.yml
          git commit -m "feat(web): integrate file upload create lifecycle"
          git push origin HEAD:feat/storage-foundation

name: Adapter Foundation Maintenance

on:
  push:
    branches: [feat/adapter-capability-foundation]

permissions:
  contents: write

jobs:
  verify-and-lock:
    if: ${{ !contains(github.event.head_commit.message, '[adapter-foundation-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/adapter-capability-foundation
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Register new distribution in compatibility checks
        run: |
          python - <<'PY'
          from pathlib import Path

          compiler = Path("packages/rakit-core/src/rakit_core/compiler.py")
          text = compiler.read_text()
          old = '    "rakit-core",\n    "rakit-web",\n'
          new = '    "rakit-core",\n    "rakit-server",\n    "rakit-web",\n'
          if '    "rakit-server",\n' not in text:
              if old not in text:
                  raise SystemExit("official package insertion anchor not found")
              text = text.replace(old, new, 1)
              compiler.write_text(text)

          examples = Path("tests/examples/test_read_examples.py")
          text = examples.read_text()
          text = text.replace(
              "test_all_packages_builds_exactly_the_eight_official_distributions",
              "test_all_packages_builds_exactly_the_nine_official_distributions",
              1,
          )
          old = '        "rakit_core",\n        "rakit_server_uvicorn",\n'
          new = '        "rakit_core",\n        "rakit_server",\n        "rakit_server_uvicorn",\n'
          if '        "rakit_server",\n' not in text:
              if old not in text:
                  raise SystemExit("distribution expectation insertion anchor not found")
              text = text.replace(old, new, 1)
          examples.write_text(text)
          PY
      - run: uv lock
      - run: uv sync --all-packages --dev --locked
      - run: uv run ruff format .
      - run: uv run ruff check --fix .
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest packages/rakit-core/tests/test_capabilities.py packages/rakit-server/tests -q
      - run: uv run pytest -q
      - name: Commit generated lock and compatibility updates
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock packages/rakit-core packages/rakit-server tests/examples/test_read_examples.py
          git commit -m "build: register rakit-server distribution [adapter-foundation-ci]"
          git push origin HEAD:feat/adapter-capability-foundation

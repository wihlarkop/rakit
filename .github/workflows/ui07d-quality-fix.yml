name: UI-07D quality fixes

on:
  push:
    branches: [ui-07d-advanced-widget-foundation]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ui-07d-advanced-widget-foundation
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.12'
      - name: Run quality fix and capture evidence
        shell: bash
        run: |
          set +e
          uv sync --all-packages --dev --locked > /tmp/sync.log 2>&1
          sync_exit=$?
          if [ "$sync_exit" -eq 0 ]; then
            python .github/ui07d_quality_patch.py > /tmp/patch.log 2>&1
            patch_exit=$?
          else
            patch_exit=99
            echo 'skipped because uv sync failed' > /tmp/patch.log
          fi
          if [ "$patch_exit" -eq 0 ]; then
            uv run ruff format \
              packages/rakit-core/src/rakit_core/fields.py \
              packages/rakit-core/src/rakit_core/relationships.py \
              packages/rakit-web/src/rakit_web \
              packages/rakit-web/tests/test_field_presentation.py \
              packages/rakit-web/tests/test_advanced_widget_contracts.py \
              packages/rakit-web/tests/test_relationship_autocomplete.py \
              examples/ui_showcase/advanced_states.py > /tmp/format.log 2>&1
            format_exit=$?
            uv run ruff check --fix \
              packages/rakit-core/src/rakit_core/fields.py \
              packages/rakit-core/src/rakit_core/relationships.py \
              packages/rakit-web/src/rakit_web \
              packages/rakit-web/tests/test_field_presentation.py \
              packages/rakit-web/tests/test_advanced_widget_contracts.py \
              packages/rakit-web/tests/test_relationship_autocomplete.py \
              examples/ui_showcase/advanced_states.py > /tmp/lint.log 2>&1
            lint_exit=$?
            python -m compileall -q packages/rakit-core/src packages/rakit-web/src packages/rakit/src examples/ui_showcase > /tmp/python.log 2>&1
            python_exit=$?
            node --check packages/rakit-web/src/rakit_web/static/rakit-widgets.js > /tmp/js.log 2>&1
            js_exit=$?
          else
            format_exit=99; lint_exit=99; python_exit=99; js_exit=99
            echo 'skipped because source patch failed' > /tmp/format.log
            cp /tmp/format.log /tmp/lint.log
            cp /tmp/format.log /tmp/python.log
            cp /tmp/format.log /tmp/js.log
          fi
          {
            echo "sync=$sync_exit"
            echo "patch=$patch_exit"
            echo "format=$format_exit"
            echo "lint=$lint_exit"
            echo "python=$python_exit"
            echo "js=$js_exit"
            for name in patch format lint python js; do
              echo
              echo "===== $name ====="
              tail -n 120 "/tmp/$name.log"
            done
          } > .github/ui07d-quality-result.txt
      - name: Commit changes and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/rakit-core packages/rakit-web examples/ui_showcase .github/ui07d-quality-result.txt
          git commit -m 'ci: record UI-07D quality fix result'
          git push origin HEAD:ui-07d-advanced-widget-foundation

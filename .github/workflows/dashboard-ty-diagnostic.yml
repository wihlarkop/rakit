name: Dashboard ty diagnostic

on:
  push:
    branches:
      - feat/dashboard-foundation

permissions:
  contents: read

jobs:
  ty-findings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - run: uv sync --all-packages --dev --locked
      - name: Capture ty findings
        shell: bash
        run: |
          set +e
          uv run ty check > /tmp/ty.txt 2>&1
          status=$?
          encoded=$(base64 -w0 /tmp/ty.txt)
          echo "::error title=ty-findings::$encoded"
          exit $status

name: Debug UI-05C test formatting

on:
  push:
    branches:
      - ui-05c-resource-detail-forms

permissions:
  contents: write

jobs:
  format-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ui-05c-resource-detail-forms
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - run: |
          uv run ruff format packages/rakit-web/tests/test_resource_detail_form_ui_maturity.py
          uv run ruff check --fix packages/rakit-web/tests/test_resource_detail_form_ui_maturity.py
      - name: Commit normalized test
        run: |
          if git diff --quiet -- packages/rakit-web/tests/test_resource_detail_form_ui_maturity.py; then
            echo "Test already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-web/tests/test_resource_detail_form_ui_maturity.py
          git commit -m "style(tests): normalize UI-05C contract tests"
          git push origin HEAD:ui-05c-resource-detail-forms

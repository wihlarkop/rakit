name: B2 source finalize

on:
  push:
    branches: [phase-b2-alpha-hardening]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-b2-alpha-hardening
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - name: Finalize typed release checker
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/check_artifacts.py")
          source = path.read_text(encoding="utf-8")
          if "from typing import Any\n" not in source:
              marker = "from pathlib import Path, PurePosixPath\n"
              if marker not in source:
                  raise SystemExit("release checker import anchor changed")
              source = source.replace(marker, marker + "from typing import Any\n", 1)
          old = "def _rakit_project(root: Path) -> dict[str, object]:"
          new = "def _rakit_project(root: Path) -> dict[str, Any]:"
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit("release checker project helper signature changed")
          path.write_text(source, encoding="utf-8")
          PY
      - name: Verify HTTP status literals are semantic
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          pattern = re.compile(r"\bstatus_code\s*(?:==|!=|<=|>=|=|<|>)\s*\d{3}\b")
          violations = []
          for path in sorted(Path("packages/rakit-web/src/rakit_web").rglob("*.py")):
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if pattern.search(line):
                      violations.append(f"{path}:{number}: {line.strip()}")
          if violations:
              raise SystemExit("numeric HTTP status_code literals remain:\n" + "\n".join(violations))
          print("all explicit web status_code literals use semantic values")
          PY
      - run: uv run ruff check --fix scripts/check_artifacts.py packages/rakit-web/src/rakit_web packages/rakit-auth-sqlalchemy/src/rakit_auth_sqlalchemy
      - run: uv run ruff format scripts/check_artifacts.py packages/rakit-web/src/rakit_web packages/rakit-auth-sqlalchemy/src/rakit_auth_sqlalchemy
      - name: Commit source finalization
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo "Source already finalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_artifacts.py packages/rakit-web/src/rakit_web packages/rakit-auth-sqlalchemy/src/rakit_auth_sqlalchemy
          git commit -m "style: finalize B2 runtime hardening"
          git push origin HEAD:phase-b2-alpha-hardening

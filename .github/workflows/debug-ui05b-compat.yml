name: Debug UI-05B compatibility

on:
  pull_request:

permissions:
  contents: write

jobs:
  compatibility:
    if: github.event.pull_request.head.ref == 'ui-05b-resource-list-experience'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ui-05b-resource-list-experience
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - name: Apply compatibility fixes
        run: python .github/ui05b_compat.py
      - name: Normalize touched tests
        run: |
          uv run ruff format \
            packages/rakit-web/tests/test_query_ui.py \
            tests/examples/test_read_examples.py \
            tests/test_ui_showcase.py
          uv run ruff check \
            packages/rakit-web/tests/test_query_ui.py \
            tests/examples/test_read_examples.py \
            tests/test_ui_showcase.py
      - name: Run focused compatibility tests
        run: |
          uv run pytest \
            packages/rakit-web/tests/test_query_ui.py \
            packages/rakit-web/tests/test_accessibility_contracts.py \
            packages/rakit-web/tests/test_resource_pages.py \
            packages/rakit-web/tests/test_resource_list_ui_maturity.py \
            tests/examples/test_read_examples.py \
            tests/test_ui_showcase.py \
            -q
      - name: Commit compatibility pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/rakit-web/src/rakit_web/templates/resources/_count.html \
            packages/rakit-web/src/rakit_web/templates/resources/_table.html \
            packages/rakit-web/tests/test_query_ui.py \
            tests/examples/test_read_examples.py \
            tests/test_ui_showcase.py
          if git diff --cached --quiet; then
            echo "No compatibility changes to commit."
            exit 0
          fi
          git commit -m "fix(web): preserve resource list compatibility contracts"
          git push origin HEAD:ui-05b-resource-list-experience

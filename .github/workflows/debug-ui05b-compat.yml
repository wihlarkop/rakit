name: Debug UI-05B compatibility

on:
  push:
    branches:
      - ui-05b-resource-list-experience

permissions:
  contents: write

jobs:
  compatibility:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ui-05b-resource-list-experience
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev --locked
      - name: Apply compatibility fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          count = Path("packages/rakit-web/src/rakit_web/templates/resources/_count.html")
          count.write_text("{{ total }}\n", encoding="utf-8")

          table = Path("packages/rakit-web/src/rakit_web/templates/resources/_table.html")
          text = table.read_text(encoding="utf-8")
          old = '''      <span data-rakit-total-deferred hx-get="{{ count_url }}" hx-trigger="load" hx-swap="outerHTML">Calculating total…</span>'''
          new = '''      <span data-rakit-total-deferred><span hx-get="{{ count_url }}" hx-trigger="load" hx-swap="innerHTML">Calculating</span> total</span>'''
          if old not in text:
              raise SystemExit("deferred count placeholder not found")
          text = text.replace(old, new, 1)
          old = '''                aria-label="Change sort for {{ header.field }}"'''
          new = '''                aria-label="Sort by {{ header.field }}"'''
          if old not in text:
              raise SystemExit("sort aria-label placeholder not found")
          text = text.replace(old, new, 1)
          table.write_text(text, encoding="utf-8")

          examples = Path("tests/examples/test_read_examples.py")
          text = examples.read_text(encoding="utf-8")
          if text.count('assert "Total unknown" in fragment.text') != 2:
              raise SystemExit("unexpected Total unknown assertion count")
          text = text.replace(
              'assert "Total unknown" in fragment.text',
              'assert "Total unavailable" in fragment.text',
          )
          examples.write_text(text, encoding="utf-8")

          showcase = Path("tests/test_ui_showcase.py")
          text = showcase.read_text(encoding="utf-8")
          old = '    assert "Page 2" in orders_page_two.text\n'
          new = '    assert \'aria-current="page">2</a>\' in orders_page_two.text\n'
          if old not in text:
              raise SystemExit("showcase page assertion not found")
          showcase.write_text(text.replace(old, new, 1), encoding="utf-8")

          query_tests = Path("packages/rakit-web/tests/test_query_ui.py")
          text = query_tests.read_text(encoding="utf-8")
          old = '''def _sort_link(document: str, field: str) -> tuple[str, list[tuple[str, str]]]:
              form_match = re.search(
                  (
                      r'<form id="(rakit-sort-[^"]+)" method="get" action="([^"]+)" '
                      r'class="hidden" aria-hidden="true">(.*?)</form>'
                  ),
                  document,
                  flags=re.DOTALL,
              )
              assert form_match is not None
              form_id, action, body = form_match.groups()
              button = re.search(
                  rf'<button\\s+type="submit"\\s+form="{re.escape(form_id)}"\\s+name="sort"\\s+value="([^"]+)"[^>]*>\\s*{re.escape(field)}\\s*</button>',
                  document,
                  flags=re.DOTALL,
              )
              assert button is not None
              hidden = re.findall(
                  r'<input\\s+type="hidden"\\s+name="([^"]+)"\\s+value="([^"]*)"\\s*/?>',
                  body,
              )
              pairs = [(html.unescape(name), html.unescape(value)) for name, value in hidden]
              pairs.append(("sort", html.unescape(button.group(1))))
              url = f"{html.unescape(action)}?{urlencode(pairs)}"
              return url, pairs
          '''.replace("          ", "")
          new = '''def _sort_link(document: str, field: str) -> tuple[str, list[tuple[str, str]]]:
              form_match = re.search(
                  (
                      r'<form id="(rakit-sort-[^"]+)" method="get" action="([^"]+)" '
                      r'class="hidden" aria-hidden="true">(.*?)</form>'
                  ),
                  document,
                  flags=re.DOTALL,
              )
              assert form_match is not None
              form_id, action, body = form_match.groups()
              button = re.search(
                  rf'<button\\s+type="submit"\\s+form="{re.escape(form_id)}"\\s+name="sort"\\s+value="([^"]+)"[^>]*>(.*?)</button>',
                  document,
                  flags=re.DOTALL,
              )
              assert button is not None
              button_value, button_body = button.groups()
              button_text = html.unescape(re.sub(r"<[^>]+>", "", button_body)).strip()
              assert button_text == field
              hidden = re.findall(
                  r'<input\\s+type="hidden"\\s+name="([^"]+)"\\s+value="([^"]*)"\\s*/?>',
                  body,
              )
              pairs = [(html.unescape(name), html.unescape(value)) for name, value in hidden]
              pairs.append(("sort", html.unescape(button_value)))
              url = f"{html.unescape(action)}?{urlencode(pairs)}"
              return url, pairs
          '''.replace("          ", "")
          if old not in text:
              raise SystemExit("sort helper block not found")
          text = text.replace(old, new, 1)

          anchor = '''def _pagination_link(document: str, label: str) -> tuple[str, list[tuple[str, str]]] | None:
              match = re.search(rf'<a[^>]+aria-label="{re.escape(label)}"[^>]+href="([^"]+)"', document)
              if match is None:
                  return None
              url = html.unescape(match.group(1))
              return url, parse_qsl(urlsplit(url).query, keep_blank_values=True)
          '''.replace("          ", "")
          addition = anchor + '''\n\ndef _has_pagination_landmark(document: str) -> bool:
              return re.search(r'<nav[^>]+aria-label="Resource pagination"', document) is not None


def _has_current_page(document: str, page: int) -> bool:
              return (
                  re.search(
                      rf'aria-current="page"[^>]*>\\s*{page}\\s*</(?:a|span)>',
                      document,
                  )
                  is not None
              )


def _sorted_header_has_field(document: str, *, aria_sort: str, field: str) -> bool:
              match = re.search(
                  rf'<th[^>]*aria-sort="{re.escape(aria_sort)}"[^>]*>(.*?)</th>',
                  document,
                  flags=re.DOTALL,
              )
              if match is None:
                  return False
              text_content = html.unescape(re.sub(r"<[^>]+>", "", match.group(1)))
              return field in text_content.split()
          '''.replace("          ", "")
          if anchor not in text:
              raise SystemExit("pagination helper anchor not found")
          text = text.replace(anchor, addition, 1)

          replacements = {
              '    assert \'nav aria-label="Resource pagination"\' in first.text\n': '    assert _has_pagination_landmark(first.text)\n',
              '    assert ">Page 1<" in first.text\n': '    assert _has_current_page(first.text, 1)\n',
              '    assert ">Page 2<" in middle.text\n': '    assert _has_current_page(middle.text, 2)\n',
              '    assert ">Page 3<" in last.text\n': '    assert _has_current_page(last.text, 3)\n',
          }
          for old_value, new_value in replacements.items():
              if old_value not in text:
                  raise SystemExit(f"pagination assertion not found: {old_value!r}")
              text = text.replace(old_value, new_value, 1)

          old = '''    assert re.search(
              r'aria-sort="descending"[^>]*>\\s*<button[^>]*>\\s*name\\s*</button>', response.text
          )
              assert re.search(r'aria-sort="other"[^>]*>\\s*<button[^>]*>\\s*email\\s*</button>', response.text)
              assert re.search(r'aria-sort="none"[^>]*>\\s*<button[^>]*>\\s*id\\s*</button>', response.text)
          '''.replace("          ", "")
          new = '''    assert _sorted_header_has_field(response.text, aria_sort="descending", field="name")
              assert _sorted_header_has_field(response.text, aria_sort="other", field="email")
              assert _sorted_header_has_field(response.text, aria_sort="none", field="id")
          '''.replace("          ", "")
          if old not in text:
              raise SystemExit("aria-sort assertion block not found")
          text = text.replace(old, new, 1)
          query_tests.write_text(text, encoding="utf-8")
          PY

          uv run ruff format \
            packages/rakit-web/tests/test_query_ui.py \
            tests/examples/test_read_examples.py \
            tests/test_ui_showcase.py
          uv run ruff check \
            packages/rakit-web/tests/test_query_ui.py \
            tests/examples/test_read_examples.py \
            tests/test_ui_showcase.py
      - name: Run focused compatibility tests
        shell: bash
        run: |
          uv run pytest \
            packages/rakit-web/tests/test_query_ui.py \
            packages/rakit-web/tests/test_accessibility_contracts.py \
            packages/rakit-web/tests/test_resource_pages.py \
            packages/rakit-web/tests/test_resource_list_ui_maturity.py \
            tests/examples/test_read_examples.py \
            tests/test_ui_showcase.py \
            -q
      - name: Commit compatibility pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/rakit-web/src/rakit_web/templates/resources/_count.html \
            packages/rakit-web/src/rakit_web/templates/resources/_table.html \
            packages/rakit-web/tests/test_query_ui.py \
            tests/examples/test_read_examples.py \
            tests/test_ui_showcase.py
          if git diff --cached --quiet; then
            echo "No compatibility changes to commit."
            exit 0
          fi
          git commit -m "fix(web): preserve resource list compatibility contracts"
          git push origin HEAD:ui-05b-resource-list-experience

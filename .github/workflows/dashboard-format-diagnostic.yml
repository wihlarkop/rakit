name: Dashboard format diagnostic

on:
  push:
    branches:
      - feat/dashboard-foundation

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - run: uv sync --all-packages --dev --locked
      - name: Capture Ruff format diff
        shell: bash
        run: |
          set +e
          uv run ruff format --diff . > /tmp/ruff-format.diff
          status=$?
          encoded=$(base64 -w0 /tmp/ruff-format.diff)
          echo "::error title=ruff-format-diff::$encoded"
          exit $status

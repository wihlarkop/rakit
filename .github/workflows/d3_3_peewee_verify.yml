name: D3.3 Peewee source verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --dev --locked
      - name: Source quality
        run: |
          uv run ruff format --check packages/rakit-peewee packages/rakit/src/rakit/_install.py
          uv run ruff check packages/rakit-peewee packages/rakit/src/rakit/_install.py
          uv run ty check
      - name: SQLite read-write-root-UoW smoke
        run: |
          uv run python - <<'PY'
          import asyncio
          import os
          import tempfile

          from peewee import IntegerField, TextField
          from playhouse.pwasyncio import AsyncSqliteDatabase
          from rakit_core.compiler import ApplicationBuilder
          from rakit_core.definitions import ResourceFieldPolicy
          from rakit_core.generated_input import GeneratedInput
          from rakit_core.generated_operations import GeneratedCrudRequest
          from rakit_core.generated_runtime import GeneratedResourceExecutorContext
          from rakit_core.operations import CancellationContext, OperationContext
          from rakit_core.pagination import PageResult
          from rakit_core.query import ResourceQuery
          from rakit_core.transactions import TransactionPolicy
          from rakit_peewee.capabilities import PEEWEE_CAPABILITIES
          from rakit_peewee.plugin import PeeweePlugin

          fd, path = tempfile.mkstemp(suffix=".sqlite3")
          os.close(fd)
          db = AsyncSqliteDatabase(path, pool_size=1)

          class Widget(db.Model):
              name = TextField()
              group = TextField()
              score = IntegerField()

          policy = ResourceFieldPolicy(
              list_fields=("id", "name", "group", "score"),
              detail_fields=("id", "name", "group", "score"),
              filter_fields=("group", "score"),
              search_fields=("name",),
              sort_fields=("name", "group", "score"),
          )

          async def execute(factory, executor, request, *, success):
              context = OperationContext(
                  deadline=None,
                  cancellation=CancellationContext(),
                  resource_id="widgets",
              )
              async with factory.open(
                  policy=TransactionPolicy.AUTO,
                  event_publisher=None,
                  operation_context=context,
              ) as uow:
                  object.__setattr__(context, "unit_of_work", uow)
                  try:
                      result = await executor.execute(context, request)
                      if success:
                          await uow.mark_success()
                  finally:
                      object.__setattr__(context, "unit_of_work", None)
              return result, context

          async def scenario():
              async with db:
                  await db.acreate_tables([Widget])
              for name, group, score in (
                  ("bravo", "engineering", 20),
                  ("alpha", "engineering", 10),
                  ("charlie", "science", 30),
              ):
                  await db.aexecute(Widget.insert(name=name, group=group, score=score))
              if not db.is_closed():
                  await db.aclose()

              builder = ApplicationBuilder()
              plugin = PeeweePlugin(database=db)
              builder.install(plugin)
              runtime = plugin._claim(Widget, policy)
              assert runtime is not None
              assert runtime.generated_executor_provider is not None
              source = runtime.data_source

              page = await source.list(
                  ResourceQuery.from_params(
                      sort="name",
                      page=1,
                      per_page=2,
                      allowed_sort_fields=("name",),
                      identity_fields=("id",),
                  )
              )
              assert isinstance(page, PageResult)
              assert [item.name for item in page.items] == ["alpha", "bravo"]
              assert page.total_count == 3
              if not db.is_closed():
                  await db.aclose()

              executor = runtime.generated_executor_provider.build(
                  GeneratedResourceExecutorContext(
                      resource_id="widgets",
                      data_source=runtime.data_source,
                  )
              )
              factory = dict(builder.unit_of_work_factories)["persistence.peewee"]

              created, commit_context = await execute(
                  factory,
                  executor,
                  GeneratedCrudRequest.create(
                      GeneratedInput(
                          values={"name": "delta", "group": "test", "score": 1},
                          present_fields=frozenset({"name", "group", "score"}),
                      )
                  ),
                  success=True,
              )
              assert commit_context.durable_commit_completed is True

              rolled_back, rollback_context = await execute(
                  factory,
                  executor,
                  GeneratedCrudRequest.update_partial(
                      created.identity,
                      GeneratedInput(
                          values={"score": 99},
                          present_fields=frozenset({"score"}),
                      ),
                  ),
                  success=False,
              )
              assert rolled_back.record.score == 99
              assert (await source.detail(created.identity)).score == 1
              assert rollback_context.durable_commit_completed is False
              if not db.is_closed():
                  await db.aclose()

              updated, update_context = await execute(
                  factory,
                  executor,
                  GeneratedCrudRequest.update_partial(
                      created.identity,
                      GeneratedInput(
                          values={"score": 2},
                          present_fields=frozenset({"score"}),
                      ),
                  ),
                  success=True,
              )
              assert updated.record.score == 2
              assert update_context.durable_commit_completed is True

              _, delete_context = await execute(
                  factory,
                  executor,
                  GeneratedCrudRequest.delete(created.identity),
                  success=True,
              )
              assert delete_context.durable_commit_completed is True
              assert await db.run(Widget.select().count) == 3
              assert PEEWEE_CAPABILITIES.capabilities.names == (
                  "persistence.read",
                  "persistence.write",
                  "transactions.root-uow",
              )
              await db.close_pool()

          try:
              asyncio.run(scenario())
          finally:
              if os.path.exists(path):
                  os.unlink(path)
          PY

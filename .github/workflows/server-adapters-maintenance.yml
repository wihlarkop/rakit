name: Server Adapters Maintenance

on:
  push:
    branches: [feat/server-uvicorn-granian]

permissions:
  contents: write

jobs:
  verify-and-lock:
    if: ${{ !contains(github.event.head_commit.message, '[server-adapters-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/server-uvicorn-granian
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Register Granian distribution in compatibility checks
        run: |
          python - <<'PY'
          from pathlib import Path

          compiler = Path("packages/rakit-core/src/rakit_core/compiler.py")
          text = compiler.read_text()
          old = '    "rakit-storage-local",\n    "rakit-server-uvicorn",\n'
          new = '    "rakit-storage-local",\n    "rakit-server-granian",\n    "rakit-server-uvicorn",\n'
          if '    "rakit-server-granian",\n' not in text:
              if old not in text:
                  raise SystemExit("official package insertion anchor not found")
              compiler.write_text(text.replace(old, new, 1))

          compiler_tests = Path("packages/rakit-core/tests/test_compiler.py")
          text = compiler_tests.read_text()
          old = '        "rakit-storage-local": "0.1.0a1",\n        "rakit-server-uvicorn": "0.1.0a1",\n'
          new = '        "rakit-storage-local": "0.1.0a1",\n        "rakit-server-granian": "0.1.0a1",\n        "rakit-server-uvicorn": "0.1.0a1",\n'
          if '        "rakit-server-granian": "0.1.0a1",\n' not in text:
              if old not in text:
                  raise SystemExit("version fixture insertion anchor not found")
              compiler_tests.write_text(text.replace(old, new, 1))

          examples = Path("tests/examples/test_read_examples.py")
          text = examples.read_text()
          text = text.replace(
              "test_all_packages_builds_exactly_the_nine_official_distributions",
              "test_all_packages_builds_exactly_the_ten_official_distributions",
              1,
          )
          old = '        "rakit_server",\n        "rakit_server_uvicorn",\n'
          new = '        "rakit_server",\n        "rakit_server_granian",\n        "rakit_server_uvicorn",\n'
          if '        "rakit_server_granian",\n' not in text:
              if old not in text:
                  raise SystemExit("distribution expectation insertion anchor not found")
              text = text.replace(old, new, 1)
          examples.write_text(text)

          uvicorn_server = Path(
              "packages/rakit-server-uvicorn/src/rakit_server_uvicorn/server.py"
          )
          text = uvicorn_server.read_text()
          text = text.replace(
              "UvicornServer.run() requires a target unless app was supplied to the constructor",
              "UvicornServer.run() requires a target unless constructor app is set",
          )
          uvicorn_server.write_text(text)
          PY
      - run: uv lock
      - run: uv sync --all-packages --dev --locked
      - run: uv run ruff format .
      - run: uv run ruff check --fix .
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: >-
          uv run pytest
          packages/rakit-server/tests
          packages/rakit-server-uvicorn/tests
          packages/rakit-server-granian/tests
          packages/rakit/tests/test_server_facade.py
          packages/rakit/tests/test_run_cli.py
          -q
      - run: uv run pytest -q
      - name: Commit generated and formatted updates
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock packages tests/examples/test_read_examples.py
          git commit -m "build: register server adapters [server-adapters-ci]"
          git push origin HEAD:feat/server-uvicorn-granian

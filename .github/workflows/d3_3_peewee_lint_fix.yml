name: D3.3 Peewee lint fix

on:
  push:
    branches: [phase-d3-3-peewee]

permissions:
  contents: write

jobs:
  lint-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-d3-3-peewee
      - uses: astral-sh/setup-uv@20cfd1bf9454377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --dev --locked
      - name: Apply Ruff safe fixes
        run: |
          uv run ruff check --fix packages/rakit-peewee
          uv run ruff format packages/rakit-peewee
      - name: Shorten overlong regression test name
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("packages/rakit-peewee/tests/test_peewee_introspection.py")
          text = path.read_text()
          old = "test_peewee_introspection_accepts_async_models_and_keeps_relationships_out_of_scalar_fields"
          new = "test_peewee_introspection_keeps_relationships_out_of_scalar_fields"
          if old in text:
              text = text.replace(old, new)
          path.write_text(text)
          PY
          uv run ruff format packages/rakit-peewee/tests/test_peewee_introspection.py
          uv run ruff check packages/rakit-peewee
      - name: Commit canonical lint fixes
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/rakit-peewee; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-peewee
          git commit -m "style(peewee): apply canonical regression lint fixes"
          git push origin HEAD:phase-d3-3-peewee

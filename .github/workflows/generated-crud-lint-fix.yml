name: Generated CRUD Lint Fix

on:
  push:
    branches: [feat/generated-crud-api-foundation]

permissions:
  contents: write

jobs:
  fix:
    if: "${{ github.event.head_commit.message == 'ci: apply generated CRUD lint fixes' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/generated-crud-api-foundation
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --dev --locked
      - name: Apply lint-safe fixes
        run: |
          uv run ruff check --fix . || true
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/rakit-core/src/rakit_core/generated_operations.py')
          text = path.read_text()
          old = '            f"Generated operation {request.operation.value!r} is not exposed by resource {api.resource_id!r}"\n'
          new = (
              '            "Generated operation "\n'
              '            f"{request.operation.value!r} is not exposed by resource "\n'
              '            f"{api.resource_id!r}"\n'
          )
          assert old in text
          path.write_text(text.replace(old, new, 1))

          path = Path('packages/rakit-core/tests/test_generated_api_definitions.py')
          text = path.read_text()
          text = text.replace(
              '    with pytest.raises(Exception):\n'
              '        definition.read_fields += ("secret",)  # type: ignore[misc]\n',
              '    with pytest.raises(AttributeError):\n'
              '        definition.read_fields = ("secret",)  # type: ignore[misc]\n',
              1,
          )
          path.write_text(text)
          PY
          uv run ruff format .
          uv run ruff check .
      - name: Commit lint fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: satisfy generated CRUD lint checks"
          git push origin HEAD:feat/generated-crud-api-foundation

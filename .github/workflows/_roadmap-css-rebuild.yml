name: Roadmap canonical CSS rebuild

on:
  push:
    branches: [docs/full-roadmap]

permissions:
  contents: write

jobs:
  rebuild-css:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/full-roadmap
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: 1.3.14
      - name: Verify scoped Tailwind source is already committed
        run: |
          grep -F '@import "tailwindcss" source("../");' packages/rakit-web/src/rakit_web/assets/rakit.css
      - run: bun install --frozen-lockfile
      - run: bun run css:build
      - name: Commit canonical generated CSS
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- packages/rakit-web/src/rakit_web/static/rakit.css; then
            echo "Generated CSS is already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-web/src/rakit_web/static/rakit.css
          git commit -m "build(web): refresh scoped Tailwind CSS"
          git push origin HEAD:docs/full-roadmap

# Temporary workflow; remove after the canonical CSS commit lands.

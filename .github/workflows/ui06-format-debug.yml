name: UI-06A format diagnostic

on:
  pull_request:
    branches:
      - ui-06-advanced-operations

permissions:
  contents: write

jobs:
  format-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-06a-actions-bulk
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev
      - name: Apply exact Ruff formatting to child branch
        run: |
          uv run ruff format .
          if git diff --quiet; then
            echo "Ruff formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply Ruff formatting"
          git push origin HEAD:ui-06a-actions-bulk

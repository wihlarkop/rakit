name: UI-06A format diagnostic

on:
  pull_request:
    branches:
      - ui-06-advanced-operations

permissions:
  contents: write

jobs:
  format-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-06a-actions-bulk
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev
      - name: Align bulk confirmation with compiled BULK policy
        run: |
          python - <<'PY'
          from pathlib import Path

          showcase = Path("examples/ui_showcase/main.py")
          text = showcase.read_text()
          old = '''            preview=lambda _context: ActionPreview(
                title="Cancel selected orders",
                description="Review the selected orders before cancellation.",
                impact="The selected orders will be cancelled in this development-only showcase.",
            ),
            executor=ShowcaseAction("Selected orders cancelled in the UI showcase"),
            needs_preview=True,
            needs_confirmation=True,
            bulk_policy=BulkPolicy(
                execution=BulkExecutionPolicy.BEST_EFFORT,
                require_concurrency_snapshot=False,
            ),'''
          new = '''            executor=ShowcaseAction("Selected orders cancelled in the UI showcase"),
            bulk_policy=BulkPolicy(
                execution=BulkExecutionPolicy.BEST_EFFORT,
                confirmation_threshold=1,
                require_concurrency_snapshot=False,
            ),'''
          assert old in text
          showcase.write_text(text.replace(old, new, 1))

          tests = Path("packages/rakit-web/tests/test_advanced_ui_maturity.py")
          text = tests.read_text()
          old = '''            preview=(
                lambda _context: ActionPreview(
                    title="Archive selected",
                    description="Review selected records.",
                    impact="Selected records will be archived.",
                )
                if needs_confirmation
                else None
            ),
            executor=DomainActionExecutor(execute),
            needs_preview=needs_confirmation,
            needs_confirmation=needs_confirmation,
            bulk_policy=BulkPolicy(require_concurrency_snapshot=require_snapshot),'''
          new = '''            executor=DomainActionExecutor(execute),
            bulk_policy=BulkPolicy(
                confirmation_threshold=1 if needs_confirmation else 20,
                require_concurrency_snapshot=require_snapshot,
            ),'''
          assert old in text
          tests.write_text(text.replace(old, new, 1))
          PY
      - name: Apply exact Ruff formatting to child branch
        run: |
          uv run ruff format .
          if git diff --quiet; then
            echo "UI-06A source is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix(web): align bulk confirmation policy"
          git push origin HEAD:ui-06a-actions-bulk

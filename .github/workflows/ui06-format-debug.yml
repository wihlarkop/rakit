name: UI-06A final cleanup

on:
  pull_request:
    branches:
      - ui-06-advanced-operations

permissions:
  contents: write

jobs:
  cleanup-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-06a-actions-bulk
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev
      - name: Fix import order and remove temporary workflow
        run: |
          uv run ruff check --fix packages/rakit-web/tests/test_advanced_ui_maturity.py
          uv run ruff format packages/rakit-web/tests/test_advanced_ui_maturity.py
          git rm .github/workflows/ui06-format-debug.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-web/tests/test_advanced_ui_maturity.py
          git commit -m "style(web): fix UI-06A regression imports"
          git push origin HEAD:ui-06a-actions-bulk

name: D3.4 Piccolo format fix

on:
  push:
    branches: [phase-d3-4-piccolo]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-d3-4-piccolo
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --dev --locked
      - run: uv run ruff format packages/rakit-piccolo/src/rakit_piccolo/generated.py
      - name: Commit canonical formatting
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/rakit-piccolo/src/rakit_piccolo/generated.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-piccolo/src/rakit_piccolo/generated.py
          git commit -m "style(piccolo): format generated executor"
          git push origin HEAD:phase-d3-4-piccolo

name: Run File Create Integration

on:
  push:
    branches: [feat/storage-foundation]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/storage-foundation
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - run: python .github/scripts/integrate_file_create.py
      - run: uv lock
      - run: uv run ruff format packages/rakit-web/src/rakit_web/form_routes.py packages/rakit-web/src/rakit_web/file_uploads.py packages/rakit-web/tests/test_files.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-web uv.lock
          git rm .github/scripts/integrate_file_create.py .github/workflows/run-file-create-integration.yml
          git commit -m "feat(web): integrate file upload create lifecycle"
          git push origin HEAD:feat/storage-foundation

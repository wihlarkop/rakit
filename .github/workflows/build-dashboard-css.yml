name: Build Dashboard CSS

on:
  push:
    branches:
      - feat/dashboard-foundation

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/dashboard-foundation
      - name: Build Tailwind stylesheet
        run: |
          npm install --no-save tailwindcss@4.1.18 @tailwindcss/cli@4.1.18
          npx tailwindcss --input packages/rakit-web/src/rakit_web/assets/rakit.css --output packages/rakit-web/src/rakit_web/static/rakit.css --minify
      - name: Commit compiled stylesheet and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rakit-web/src/rakit_web/static/rakit.css
          git rm .github/workflows/build-dashboard-css.yml
          git commit -m "style(web): regenerate Tailwind admin asset"
          git push origin HEAD:feat/dashboard-foundation

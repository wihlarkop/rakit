name: UI-07D source integration patch

on:
  push:
    branches: [ui-07d-advanced-widget-foundation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ui-07d-advanced-widget-foundation
      - name: Apply source patch
        run: python .github/ui07d_source_patch.py
      - name: Validate Python syntax
        run: python -m compileall -q packages/rakit-core/src packages/rakit-web/src packages/rakit/src
      - name: Commit source integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/rakit-core packages/rakit-web packages/rakit
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
          else
            git commit -m 'feat(web): integrate advanced presentation runtime'
            git push origin HEAD:ui-07d-advanced-widget-foundation
          fi

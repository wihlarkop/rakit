name: UI05E temporary ruff fix

on:
  push:
    branches: [ui-05e-filter-rail-responsive-filters]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ui-05e-filter-rail-responsive-filters
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --dev --locked
      - name: Apply Ruff import fix
        run: |
          uv run ruff check --fix packages/rakit/tests/test_query_configuration_facade.py
          uv run ruff format packages/rakit/tests/test_query_configuration_facade.py
      - name: Commit Ruff result
        shell: bash
        run: |
          set -euo pipefail
          git add packages/rakit/tests/test_query_configuration_facade.py
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(test): apply Ruff import ordering"
          git push origin HEAD:ui-05e-filter-rail-responsive-filters

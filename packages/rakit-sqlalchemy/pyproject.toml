[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rakit-sqlalchemy"
version = "0.1.0a1"
requires-python = ">=3.12"
dependencies = ["rakit-core==0.1.0a1", "sqlalchemy[asyncio]>=2.0.16,<2.1"]

[dependency-groups]
dev = ["aiosqlite>=0.20", "pytest>=8.3,<9", "pytest-anyio>=0.0.0"]

[tool.uv.sources]
rakit-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/rakit_sqlalchemy"]

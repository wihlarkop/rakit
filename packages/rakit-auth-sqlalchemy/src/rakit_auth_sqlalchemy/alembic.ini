[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# Real deployments override this via the RAKIT_AUTH_SQLALCHEMY_URL
# environment variable (see alembic/env.py) or -x db_url=<url>. It is never
# read as a hardcoded production credential.
sqlalchemy.url = sqlite:///:memory:

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

<a
  href="{{ navigation.dashboard.path }}"
  class="flex min-h-10 items-center rounded-lg px-3 text-sm font-semibold {% if navigation.dashboard.active %}bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-950{% else %}text-slate-700 hover:bg-slate-100 hover:text-slate-950 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white{% endif %}"
  {% if navigation.dashboard.active %}aria-current="page"{% endif %}
>Dashboard</a>

{% if navigation.resources %}
<div class="mt-6">
  <p class="mb-2 px-3 text-xs font-semibold uppercase tracking-wide text-slate-400 dark:text-slate-500">Resources</p>
  <ul class="space-y-1">
    {% for item in navigation.resources %}
    <li>
      <a
        href="{{ item.path }}"
        class="flex min-h-10 items-center rounded-lg px-3 text-sm font-medium {% if item.active %}bg-slate-100 text-slate-950 dark:bg-slate-800 dark:text-white{% else %}text-slate-600 hover:bg-slate-50 hover:text-slate-950 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white{% endif %}"
        {% if item.active %}aria-current="page"{% endif %}
      >{{ item.label }}</a>
    </li>
    {% endfor %}
  </ul>
</div>
{% endif %}

{% if navigation.pages %}
<div class="mt-6">
  <p class="mb-2 px-3 text-xs font-semibold uppercase tracking-wide text-slate-400 dark:text-slate-500">Pages</p>
  <ul class="space-y-1">
    {% for item in navigation.pages %}
    <li>
      <a
        href="{{ item.path }}"
        class="flex min-h-10 items-center rounded-lg px-3 text-sm font-medium {% if item.active %}bg-slate-100 text-slate-950 dark:bg-slate-800 dark:text-white{% else %}text-slate-600 hover:bg-slate-50 hover:text-slate-950 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white{% endif %}"
        {% if item.active %}aria-current="page"{% endif %}
      >{{ item.label }}</a>
    </li>
    {% endfor %}
  </ul>
</div>
{% endif %}

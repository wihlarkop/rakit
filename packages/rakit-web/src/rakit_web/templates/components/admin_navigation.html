{% set provider = request.scope.get('state', {}).get('rakit_navigation_provider') %}
{% if provider %}
  {% set navigation = provider(request) %}
  <aside
    data-rakit-desktop-navigation
    class="hidden min-h-screen w-64 shrink-0 border-r border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900 lg:sticky lg:top-0 lg:flex lg:h-screen lg:flex-col"
  >
    <div class="flex min-h-16 items-center border-b border-slate-200 px-5 dark:border-slate-800">
      <a href="{{ navigation.dashboard.path }}" class="min-w-0 flex-1 truncate text-base font-semibold tracking-tight text-slate-950 dark:text-white">
        {{ navigation.title }}
      </a>
      <span class="ml-3 rounded border border-slate-200 px-2 py-0.5 text-xs font-medium text-slate-500 dark:border-slate-700 dark:text-slate-400">Admin</span>
    </div>

    <nav class="min-h-0 flex-1 overflow-y-auto px-3 py-5" aria-label="Primary navigation">
      {% include "components/admin_navigation_items.html" %}
    </nav>

    <div class="border-t border-slate-200 p-4 dark:border-slate-800">
      <label class="mb-1.5 block text-xs font-medium text-slate-500 dark:text-slate-400" for="rakit-theme-select-desktop">Theme</label>
      <select
        id="rakit-theme-select-desktop"
        data-rakit-theme-select
        class="rakit-select"
      >
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>
  </aside>
{% endif %}

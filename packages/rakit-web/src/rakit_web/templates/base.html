<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ resource.label if resource else "Rakit" }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ static_url('rakit.css') }}" />
    <link rel="stylesheet" href="{{ static_url('rakit-dashboard.css') }}" />
    <script src="{{ static_url('htmx.min.js') }}" defer></script>
  </head>
  <body class="min-h-screen">
    <main class="mx-auto w-full max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
      {% block content %}{% endblock %}
    </main>
    <script src="{{ static_url('rakit-ui.js') }}" defer></script>
  </body>
</html>

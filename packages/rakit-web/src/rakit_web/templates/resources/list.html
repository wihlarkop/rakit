{% extends "base.html" %}
{% block title %}{{ resource.label }}{% endblock %}
{% block content %}
<div id="rakit-resource-list-root">
  <nav class="mb-3 flex items-center gap-2 text-sm text-slate-500 dark:text-slate-400" aria-label="Breadcrumb">
    <a href="{{ request.scope.get('root_path', '').rstrip('/') }}/" class="hover:text-slate-900 hover:underline dark:hover:text-white">Dashboard</a>
    <span aria-hidden="true">/</span>
    <span aria-current="page" class="text-slate-700 dark:text-slate-300">{{ resource.label }}</span>
  </nav>
  <header class="mb-6">
    <p class="text-sm font-medium text-slate-500 dark:text-slate-400">Resource</p>
    <h1 class="mt-1 text-2xl font-semibold tracking-tight text-slate-950 dark:text-white">{{ resource.label }}</h1>
    <p class="mt-2 text-sm leading-6 text-slate-600 dark:text-slate-300">Browse, search, and inspect the records available in this resource.</p>
  </header>
  {% include table_template %}
</div>
{% endblock %}

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rakit-server-uvicorn"
version = "0.1.0a1"
requires-python = ">=3.12"
dependencies = [
    "rakit-server==0.1.0a1",
    "uvicorn>=0.51.0",
]

[project.entry-points."rakit.servers"]
uvicorn = "rakit_server_uvicorn:UvicornServer"

[tool.uv.sources]
rakit-server = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/rakit_server_uvicorn"]

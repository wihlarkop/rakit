[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rakit-tortoise"
version = "0.1.0a1"
requires-python = ">=3.12"
dependencies = ["rakit-core==0.1.0a1", "tortoise-orm>=1.1.7,<2"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-anyio>=0.0.0"]

[project.entry-points."rakit.integrations"]
"persistence.tortoise" = "rakit_tortoise.discovery:TORTOISE_INTEGRATION"

[tool.uv.sources]
rakit-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/rakit_tortoise"]

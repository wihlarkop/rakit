[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rakit-peewee"
version = "0.1.0a1"
requires-python = ">=3.12"
dependencies = [
  "greenlet>=3.1,<4",
  "peewee>=4.0,<5",
  "rakit-core==0.1.0a1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=8.3,<9",
  "pytest-anyio>=0.0.0",
]

[project.entry-points."rakit.integrations"]
"persistence.peewee" = "rakit_peewee.discovery:PEEWEE_INTEGRATION"

[tool.uv.sources]
rakit-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/rakit_peewee"]

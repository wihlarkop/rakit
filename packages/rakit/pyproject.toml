[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rakit"
version = "0.1.0a1"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "rakit-core==0.1.0a1",
    "rakit-server==0.1.0a1",
    "rakit-storage==0.1.0a1",
    "rakit-web==0.1.0a1",
]

[project.optional-dependencies]
uvicorn = ["rakit-server-uvicorn==0.1.0a1"]
granian = ["rakit-server-granian==0.1.0a1"]
server-uvicorn = ["rakit-server-uvicorn==0.1.0a1"]
sqlalchemy = ["rakit-sqlalchemy==0.1.0a1"]
auth-sqlalchemy = ["rakit-auth-sqlalchemy==0.1.0a1"]
storage-local = ["rakit-storage-local==0.1.0a1"]
standard = [
    "rakit-sqlalchemy==0.1.0a1",
    "rakit-auth-sqlalchemy==0.1.0a1",
    "rakit-storage-local==0.1.0a1",
    "rakit-server-uvicorn==0.1.0a1",
]

[project.scripts]
rakit = "rakit.cli:cli"

[tool.uv.sources]
rakit-core = { workspace = true }
rakit-server = { workspace = true }
rakit-server-uvicorn = { workspace = true }
rakit-server-granian = { workspace = true }
rakit-sqlalchemy = { workspace = true }
rakit-auth-sqlalchemy = { workspace = true }
rakit-storage = { workspace = true }
rakit-storage-local = { workspace = true }
rakit-web = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/rakit"]

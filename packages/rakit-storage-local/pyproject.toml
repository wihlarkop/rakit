[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rakit-storage-local"
version = "0.1.0a1"
requires-python = ">=3.12"
dependencies = ["rakit-storage==0.1.0a1", "rakit-core==0.1.0a1"]

[project.entry-points."rakit.integrations"]
"storage.local" = "rakit_storage_local.discovery:STORAGE_LOCAL_INTEGRATION"

[tool.uv.sources]
rakit-storage = { workspace = true }
rakit-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/rakit_storage_local"]

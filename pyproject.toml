[project]
name = "rakit-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3,<9",
  "pytest-anyio>=0.0.0",
  "ruff>=0.12,<0.13",
  "ty>=0.0.1a16",
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
anyio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[project]
name = "rakit-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[project.optional-dependencies]
examples = [
  "aiosqlite>=0.20",
  "fastapi>=0.116",
  "rakit[sqlalchemy]",
  "uvicorn>=0.35",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
rakit = { workspace = true }

[dependency-groups]
dev = [
  "fastapi>=0.116",
  "httpx>=0.28.1",
  "mkdocs-material>=9.6,<10",
  "pytest>=8.3,<9",
  "pytest-anyio>=0.0.0",
  "pytest-cov>=6,<8",
  "pytest-xdist>=3.8.0",
  "ruff>=0.12,<0.13",
  "ty>=0.0.1a16",
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
anyio_mode = "auto"
addopts = "--basetemp=.pytest-tmp"

[tool.coverage.run]
branch = true
source = [
  "rakit_core",
  "rakit_web",
  "rakit_sqlalchemy",
  "rakit_auth_sqlalchemy",
  "rakit_storage",
  "rakit_storage_local",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
